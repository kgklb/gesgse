<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="interactive-prototype">
<title>护航电竞平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--bg-card:#14141f;--bg-card-2:#1a1a28;--bg-hover:#22223a;
  --text:#f0f0f5;--text-2:#a0a0b8;--text-3:#6a6a82;
  --gold:#d4af37;--gold-2:#f5d76e;--gold-dark:#9a7b2a;--gold-bg:rgba(212,175,55,0.1);
  --border:#2a2a40;--border-2:#1e1e30;
  --success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;
  --shadow:0 4px 20px rgba(0,0,0,0.4);--shadow-gold:0 4px 20px rgba(212,175,55,0.15);
  --radius:12px;--radius-lg:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:60px}
/* 隐藏平台注入的右下角水印/标识 */
[class*="watermark"],[id*="watermark"],[class*="powered"],[id*="powered"],
[class*="doubao"],[id*="doubao"],[class*="aiforce"],[id*="aiforce"],
[class*="miaoda-badge"],[id*="miaoda-badge"],[class*="miaoda-watermark"],[id*="miaoda-watermark"],
[class*="brand-badge"],[id*="brand-badge"],[class*="ai-generated"],[id*="ai-generated"]{
  display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important
}
#app.admin-mode{max-width:100%;padding-bottom:0}

/* Top Bar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-2)}
.topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.topbar .logo .logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.topbar .title{font-size:16px;font-weight:600}
.topbar .icons{display:flex;align-items:center;gap:14px}
.topbar .icon-btn{position:relative;width:24px;height:24px;color:var(--text-2);cursor:pointer}
.topbar .icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.topbar .sync-status{position:absolute;top:50%;right:60px;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3);opacity:.5}
.topbar .sync-status .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.topbar .sync-status.sync-connected .sync-dot{background:#10b981}
.topbar .sync-status.sync-connecting .sync-dot{background:#f59e0b;animation:pulse 1.2s infinite}
.topbar .sync-status.sync-failed{display:none}
.topbar .sync-status.sync-offline{display:none}

/* Bottom Tab Bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-card);border-top:1px solid var(--border-2);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--text-3);cursor:pointer;font-size:11px;transition:color .2s}
.tabbar .tab.active{color:var(--gold)}
.tabbar .tab svg{width:22px;height:22px}

/* Page Container */
.page{display:none;padding:0 0 20px;min-height:calc(100vh - 120px)}
.page.active{display:block}

/* Banner */
.banner-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:12px 16px 4px;scroll-behavior:smooth}
.banner-carousel::-webkit-scrollbar{display:none}
.banner-slide{flex:0 0 calc(100% - 32px);scroll-snap-align:center;height:140px;border-radius:var(--radius-lg);padding:0 24px;display:flex;align-items:center;position:relative;overflow:hidden}
.banner-slide::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(212,175,55,0.15),transparent 50%)}
.banner-slide-content{position:relative;z-index:2}
.banner-slide-title{font-size:22px;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,var(--gold-2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.banner-slide-sub{font-size:13px;color:var(--text-2)}
.banner-dots{display:flex;gap:6px;justify-content:center;padding:6px 0 10px}
.banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);transition:all .3s}
.banner-dots span.active{background:var(--gold);width:18px;border-radius:3px}

/* Game Scroll */
.section-title{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.section-title h3{font-size:16px;font-weight:600}
.section-title .more{font-size:12px;color:var(--text-3);cursor:pointer}
.announce-entries{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.announce-entry{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:var(--bg-card);border-radius:12px;cursor:pointer;border:1px solid var(--border-2);transition:all .2s}.announce-entry:active{transform:scale(0.97)}.announce-entry-icon{width:44px;height:44px;border-radius:12px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;font-size:22px}.announce-entry span{font-size:12px;color:var(--text-2)}
.game-scroll{display:flex;gap:12px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.game-scroll::-webkit-scrollbar{display:none}
.game-item{flex-shrink:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.game-item .game-icon{width:52px;height:52px;border-radius:14px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--border)}
.game-item .game-name{font-size:12px;color:var(--text-2)}

/* Cards */
.card{background:var(--bg-card);border-radius:var(--radius);margin:10px 16px;padding:14px;border:1px solid var(--border-2)}
.booster-card{background:var(--bg-card);border-radius:var(--radius);margin:10px 16px;padding:14px;border:1px solid var(--border-2);cursor:pointer;transition:border-color .2s}
.booster-card:active{border-color:var(--gold)}
/* 首页热门订单 - 两列网格卡片 */
.featured-orders-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 16px}
.featured-order-card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-2);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column}
.featured-order-card:active{transform:scale(0.97);border-color:var(--gold);box-shadow:0 4px 20px rgba(212,175,55,0.15)}
.featured-order-cover{width:100%;aspect-ratio:4/3;border-radius:0;overflow:hidden;background:var(--bg-card-2)}
.featured-order-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:2px}
.featured-order-title{font-size:14px;font-weight:600;color:var(--text-1);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-order-desc{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.featured-order-price{font-size:18px;font-weight:800;color:var(--gold);line-height:1.2}
.featured-order-btn{margin-top:auto;padding:6px 10px;font-size:12px;margin-top:8px;width:100%}
/* 分类页-服务卡片 */
.service-card{background:var(--bg-card);border-radius:var(--radius);padding:14px;border:1px solid var(--border-2);display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s}
.service-card:active{border-color:var(--gold)}
.booster-card .booster-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:18px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar.lg{width:64px;height:64px;font-size:24px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.booster-info{flex:1;min-width:0}
.booster-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.rank-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:var(--gold-bg);color:var(--gold)}
.booster-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--text-2)}
.booster-meta .rating{color:var(--gold);font-weight:600}
.booster-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{padding:3px 8px;border-radius:4px;font-size:11px;background:var(--bg-card-2);color:var(--text-2)}
.tag.gold{background:var(--gold-bg);color:var(--gold)}
.booster-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border-2)}
.price{color:var(--gold);font-weight:700;font-size:16px}
.price .unit{font-size:11px;font-weight:400;color:var(--text-2);margin-left:2px}

/* Filter Bar */
.filter-bar{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg);position:sticky;top:50px;z-index:50;border-bottom:1px solid var(--border-2)}
.filter-bar::-webkit-scrollbar{display:none}
.filter-pill{padding:6px 14px;border-radius:20px;font-size:13px;background:var(--bg-card);color:var(--text-2);white-space:nowrap;cursor:pointer;border:1px solid var(--border-2)}
.filter-pill.active{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-dark)}

/* Bottom fixed bar */
.bottom-bar{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-card);border-top:1px solid var(--border-2);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:90}
.bottom-bar .action-icons{display:flex;gap:16px}
.bottom-bar .action-icon{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-2);font-size:10px;cursor:pointer}
.bottom-bar .action-icon svg{width:20px;height:20px}
.bottom-bar .btn-primary{flex:1}

/* Buttons */
.btn{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-danger{background:var(--danger);color:#fff}

// 同步日志：最近 50 条
let SYNC_LOGS = [];

/**
 * 追加同步日志，自动截断保留最近 50 条
 */
function addSyncLog(level, table, action, msg) {
  const entry = { time: Date.now(), level, table, action, msg };
  SYNC_LOGS.unshift(entry);
  if (SYNC_LOGS.length > 50) SYNC_LOGS.length = 50;
  logSupabase(level, action, `[${table}] ${msg}`);
}

/**
 * 更新某张表的同步状态
 */
function setTableSyncStatus(table, status, errorMsg, count) {
  SYNC_TABLE_STATUS[table] = {
    status,
    error: errorMsg || '',
    count: count != null ? count : (SYNC_TABLE_STATUS[table]?.count ?? 0),
    time: Date.now()
  };
  addSyncLog(status === 'success' ? 'info' : 'error', table, 'sync',
    status === 'success' ? `成功 ${count || 0} 条` : `失败：${errorMsg || '未知错误'}`);
}

/**
 * 带超时的 Supabase 请求封装
 * @param {Promise} promise - Supabase 查询 Promise
 * @param {number} timeoutMs - 超时毫秒数，默认 15 秒
 * @returns {Promise} 原 Promise 结果，超时则 reject
 */
function withTimeout(promise, timeoutMs = 15000) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`请求超时（${timeoutMs}ms）`)), timeoutMs)
    )
  ]);
}

/**
 * 带重试的写入操作
 * @param {Function} fn - 返回 Promise 的函数
 * @param {number} retries - 最大重试次数（不含首次）
 * @param {number} delayMs - 重试间隔
 */
async function withRetry(fn, retries = 1, delayMs = 1000) {
  let lastError;
  for (let i = 0; i <= retries; i++) {
    try {
      return await fn();
    } catch (e) {
      lastError = e;
      if (i < retries) {
        await new Promise(r => setTimeout(r, delayMs));
      }
    }
  }
  throw lastError;
}

// 读取登录态（localStorage）
function loadAuthState() {
  try {
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    if (!raw) {
      AUTH_STATE.isLoggedIn = false;
      return false;
    }
    const data = JSON.parse(raw);
    const now = Date.now();
    if (data.expireTime && data.expireTime < now) {
      // 已过期
      localStorage.removeItem(AUTH_STORAGE_KEY);
      AUTH_STATE.isLoggedIn = false;
      logAuth('load', '登录态已过期');
      return false;
    }
    AUTH_STATE = Object.assign(AUTH_STATE, data);
    AUTH_STATE.isLoggedIn = true;
    logAuth('load', `登录态有效，userId=${data.userId}`);
    return true;
  } catch (e) {
    console.warn('[Auth] 读取登录态失败:', e.message);
    AUTH_STATE.isLoggedIn = false;
    return false;
  }
}

  try {

        return { success: false, message: '昵称已被注册' };

// 用户登录（昵称+密码，兼容老用户 username/phone 作为登录名）
async function loginUser(nickname, password) {
  const account = (nickname || '').trim();
  if (!account) {
    return { success: false, message: '请输入昵称' };
  }
  if (!password || password.length < 6) {
    return { success: false, message: '密码至少6位' };
  }

  // 优先从 Supabase 验证（10 秒超时，超时或失败降级到本地）
  if (supabaseClient && SUPABASE_ENABLED) {
    try {
      const timeoutMs = 10000;
      let timeoutHit = false;
      const timeoutPromise = new Promise((_, reject) => {
        setTimeout(() => { timeoutHit = true; reject(new Error('timeout')); }, timeoutMs);
      });

      // 先按 nickname 查询
      let { data, error } = await Promise.race([
        supabaseClient.from('users').select('*').eq('nickname', account).limit(1),
        timeoutPromise
      ]);
      // 没找到再按 username 兼容（老用户）
      if ((!data || data.length === 0) && !error && !timeoutHit) {
        const unameRes = await Promise.race([
          supabaseClient.from('users').select('*').eq('username', account).limit(1),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), timeoutMs))
        ]);
        if (unameRes.data && unameRes.data.length > 0) {
          data = unameRes.data;
        }
      }
      // 再没找到按 phone 兼容（更老用户）
      if ((!data || data.length === 0) && !error && !timeoutHit) {
        const phoneRes = await Promise.race([
          supabaseClient.from('users').select('*').eq('phone', account).limit(1),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), timeoutMs))
        ]);
        if (phoneRes.data && phoneRes.data.length > 0) {
          data = phoneRes.data;
        }
      }
      if (error && error.code !== 'PGRST116') {
        console.warn('[Auth] 登录查询失败:', error.message);
      } else if (data && data.length > 0) {
        const user = data[0];
        if (user.password && user.password === password) {
          setupLoggedInUser(user);
          return { success: true, message: '登录成功', userId: user.id };
        } else {
          return { success: false, message: '昵称或密码错误' };
        }
      }
    } catch (e) {
      console.warn('[Auth] Supabase 登录异常，降级到本地:', e.message);
    }
  }

  // 降级：从本地 DB.users 验证（nickname/username/phone 都能匹配）
  if (DB.users && DB.users.length > 0) {
    const localUser = DB.users.find(u =>
      (u.nickname && u.nickname === account) ||
      (u.username && u.username === account) ||
      (u.phone && u.phone === account)
    );
    if (localUser && localUser.password === password) {
      AUTH_STATE.userId = localUser.id;
      AUTH_STATE.username = localUser.username || '';
      AUTH_STATE.nickname = localUser.nickname;
      AUTH_STATE.role = 'user';
      AUTH_STATE.isLoggedIn = true;
      saveAuthState();
      DB.currentUser = {
        id: localUser.id,
        username: localUser.username || '',
        phone: localUser.phone || '',
        nickname: localUser.nickname,
        avatar: localUser.avatar || localUser.nickname.charAt(0),
        level: localUser.vipLevel || '普通会员',
        balance: localUser.balance || 0,
        coupons: 0,
        favorites: []
      };
      localStorage.setItem(USER_ID_KEY, localUser.id);
      saveData(false);
      return { success: true, message: '登录成功', userId: localUser.id };
    }
  }

  return { success: false, message: '昵称或密码错误' };
}

function logSupabase(level, tag, msg, data) {
  if (!SUPABASE_DEBUG) return;
  const fn = level === 'error' ? console.error : (level === 'warn' ? console.warn : console.log);
  const prefix = `[Supabase:${tag}]`;
  if (data !== undefined) fn(prefix, msg, data);
  else fn(prefix, msg);
}

function setSupabaseStatus(status, errorMsg) {
  const prev = SUPABASE_STATUS;
  SUPABASE_STATUS = status;
  if (errorMsg) SUPABASE_LAST_ERROR = errorMsg;
  if (status === 'connected') SUPABASE_ENABLED = true;
  if (status === 'failed' || status === 'offline') {
    // 注意：不直接关闭 SUPABASE_ENABLED，保留重试机会
    SUPABASE_ENABLED = true;
  }
  if (prev !== status) {
    logSupabase('info', 'status', `${prev} -> ${status}${errorMsg ? ' ('+errorMsg+')' : ''}`);
  }
}
function initSupabase() {
  setSupabaseStatus('connecting');
  try {
    if (typeof supabase !== 'undefined' && window.supabase && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        realtime: {
          params: { eventsPerSecond: 20 }
        }
      });
      SUPABASE_ENABLED = true;
      setSupabaseStatus('connected');
      logSupabase('info', 'init', 'SDK 初始化成功');
      return true;
    } else {
      setSupabaseStatus('offline', 'SDK 未加载');
      SUPABASE_ENABLED = false;
      console.warn('[Supabase] SDK 未加载，降级到本地存储');
      return false;
    }
  } catch (e) {
    setSupabaseStatus('failed', e.message);
    SUPABASE_ENABLED = false;
    console.warn('[Supabase] 初始化失败:', e.message);
    return false;
  }
}

// ============ Realtime 订阅 ============
function subscribeOrdersRealtime() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    // 先清理旧频道
    if (SUPABASE_ORDERS_CHANNEL) {
      supabaseClient.removeChannel(SUPABASE_ORDERS_CHANNEL);
    }
    SUPABASE_ORDERS_CHANNEL = supabaseClient
      .channel('orders-changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'orders' },
        (payload) => {
          console.log('[Realtime] orders change:', payload.eventType, payload.new?.id || payload.old?.id);
          // 增量更新本地 DB
          if (payload.eventType === 'INSERT' && payload.new) {
            const row = toCamel(payload.new);
            if (!DB.orders.find(o => o.id === row.id)) {
              DB.orders.push(row);
            }
          } else if (payload.eventType === 'UPDATE' && payload.new) {
            const row = toCamel(payload.new);
            const idx = DB.orders.findIndex(o => o.id === row.id);
            if (idx >= 0) DB.orders[idx] = row;
            else DB.orders.push(row);
          } else if (payload.eventType === 'DELETE' && payload.old) {
            const row = toCamel(payload.old);
            DB.orders = DB.orders.filter(o => o.id !== row.id);
          }
          // 更新最新时间戳，避免轮询重复拉取
          if (payload.new) {
            const ct = new Date(payload.new.create_time || 0).getTime();
            if (ct > _lastOrderUpdateTime) _lastOrderUpdateTime = ct;
          }
          saveData(false); // 仅存本地，不回写云端
          render();
        }
      )
      .subscribe((status) => {
        console.log('[Realtime] orders channel:', status);
        if (status === 'SUBSCRIBED') {
          logSupabase('info', 'realtime', 'orders 实时订阅已连接');
        } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
          logSupabase('warn', 'realtime', 'orders 实时订阅断开: ' + status + '，已降级为 8 秒轮询');
        }
      });
  } catch (e) {
    console.warn('[Realtime] orders subscription failed:', e.message);
    logSupabase('warn', 'realtime', 'orders 订阅初始化失败，使用轮询同步');
  }
}

function subscribeChatRealtime() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    if (SUPABASE_CHAT_CHANNEL) {
      supabaseClient.removeChannel(SUPABASE_CHAT_CHANNEL);
    }
    SUPABASE_CHAT_CHANNEL = supabaseClient
      .channel('chat-changes')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'chat_messages' },
        (payload) => {
          console.log('[Realtime] chat_message insert:', payload.new?.id);
          const msg = toCamel(payload.new);
          const sid = msg.sessionId || 'default';
          if (!DB.chatMessages[sid]) DB.chatMessages[sid] = [];
          if (!DB.chatMessages[sid].find(m => m.id === msg.id)) {
            DB.chatMessages[sid].push(msg);
            // 同步更新会话列表
            const sess = DB.chatSessions.find(s => s.id === sid);
            if (sess) {
              sess.lastMsg = msg.content;
              sess.lastTime = msg.createTime || Date.now();
              if (msg.senderType !== 'admin' || DB.currentIdentity !== 'admin') {
                sess.unread = (sess.unread || 0) + 1;
              }
            }
            saveData(false);
            // 如果当前在客服页，刷新
            if (STATE.page === 'chat' || STATE.subPage === 'chatDetail' || (DB.currentIdentity === 'admin' && adminTab === 'chat')) {
              render();
            }
          }
        }
      )
      .subscribe((status) => {
        console.log('[Realtime] chat channel:', status);
      });
  } catch (e) {
    console.warn('[Realtime] chat subscription failed:', e.message);
  }
}

function showSQLModal() {
  generateSQL();
  showModal(`
    <div style="max-width:600px;width:90vw">
      <div class="modal-header"><h4>数据库初始化 SQL</h4><span class="modal-close" onclick="closeModal()">${ICONS.close}</span></div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-2);margin-bottom:10px">请将以下 SQL 语句复制到 <b>Supabase → SQL Editor</b> 中执行，执行完成后即可启用云端数据存储。</p>
        <textarea id="sqlTextarea" readonly style="width:100%;height:300px;background:var(--bg-card-2);color:var(--text-1);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:monospace;resize:vertical">${SQL_SCHEMA.replace(/`/g,'\`')}</textarea>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn btn-primary" style="flex:1" onclick="copySQL()">复制 SQL 到剪贴板</button>
          <button class="btn btn-outline" style="flex:1" onclick="testSupabaseConnection()">测试连接</button>
        </div>
        <div id="sqlResult" style="margin-top:10px;font-size:12px;color:var(--text-3)"></div>
      </div>
    </div>`, { closeOnOverlay: true });
}

function copySQL() {
  const ta = document.getElementById('sqlTextarea');
  if (!ta) return;
  ta.select();
  ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    toast('SQL 已复制到剪贴板');
  } catch (e) {
    toast('复制失败，请手动选择复制');
  }
}

async function testSupabaseConnection() {
  const resultEl = document.getElementById('sqlResult');
  resultEl.textContent = '正在测试连接...';
  resultEl.style.color = 'var(--text-2)';
  try {
    if (!supabaseClient) throw new Error('Supabase 未初始化');
    const { data, error } = await supabaseClient.from('settings').select('id').limit(1);
    if (error) throw error;
    resultEl.textContent = '✅ 连接成功！Supabase 数据库可用。';
    resultEl.style.color = '#22c55e';
    SUPABASE_ENABLED = true;
    // 连接成功后尝试从云端拉取数据
    await syncFromSupabase();
    setTimeout(() => { closeModal(); render(); toast('云端数据已同步'); }, 1000);
  } catch (e) {
    resultEl.textContent = '❌ 连接失败：' + e.message + '（请先在 Supabase 执行建表 SQL）';
    resultEl.style.color = '#ef4444';
    SUPABASE_ENABLED = false;
  }
}

async function ensureCurrentUser() {

      phone: '',
      username: AUTH_STATE.username || '',
      level: '黄金会员',
      balance: 500,
      coupons: 2,
      favorites: []
    };
  }
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    // 查询用户是否存在
    const { data, error } = await supabaseClient.from('users').select('*').eq('id', uid).single();
    if (error && error.code === 'PGRST116') {

      const userData = {

        avatar: DB.currentUser.avatar || '玩',

      };
      await supabaseClient.from('users').insert(userData);
      console.log('[Supabase] 新匿名用户已创建:', uid);
    } else if (data) {
      // 已存在，同步数据到本地
      DB.currentUser.id = data.id;
      DB.currentUser.nickname = data.nickname || DB.currentUser.nickname;
      DB.currentUser.avatar = data.avatar || DB.currentUser.avatar;
      DB.currentUser.balance = parseFloat(data.balance || 0);
      DB.currentUser.level = data.vip_level || '普通会员';
      console.log('[Supabase] 用户信息已同步');

  }
}

async function verifyAdminLogin(username, password) {
  if (!supabaseClient || !SUPABASE_ENABLED) {
    // 降级：本地默认密码
    return { ok: password === (DB.adminPassword || 'admin888'), source: 'local' };
  }
  try {
    // 10 秒超时保护：Supabase 查询卡住时自动降级，避免一直 loading
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('timeout')), 10000);
    });
    
    // 先确保 admins 表存在默认管理员记录（防止表为空时无法登录）
    // 同样加超时，避免 ensure 卡住
    await Promise.race([
      ensureAdminInSupabase(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('ensure_timeout')), 5000))
    ]).catch(() => {
      // ensure 失败不阻断登录，继续查询
      console.warn('[AdminLogin] ensureAdminInSupabase 超时或失败，跳过');
    });
    
    const queryPromise = supabaseClient
      .from('admins')
      .select('*')
      .eq('username', username)
      .single();
    
    const { data, error } = await Promise.race([queryPromise, timeoutPromise]);
    
    if (error || !data) {
      // Supabase 查询未命中，降级到本地密码
      console.warn('[AdminLogin] admin not found in Supabase, fallback to local');
      return { ok: password === (DB.adminPassword || 'admin888'), source: 'local_fallback' };
    }
    // 明文比较（数据库中 password 字段存明文）
    return { ok: data.password === password, source: 'supabase' };
  } catch (e) {
    console.warn('[AdminLogin] verify failed, fallback to local:', e.message);
    const isTimeout = e.message === 'timeout' || e.message === 'ensure_timeout';
    // 降级到本地密码
    return {
      ok: password === (DB.adminPassword || 'admin888'),
      source: isTimeout ? 'timeout_fallback' : 'error_fallback',
      error: e.message
    };
  }
}

async function loadSupabaseInBackground() {
  if (!supabaseClient) {
    setSupabaseStatus('offline', '无客户端');
    return;
  }
  // 启动网络状态监听（断线重连）
  setupNetworkListeners();
  try {
    setSupabaseStatus('connecting');
    const ok = await syncFromSupabase();
    if (ok) {
      setSupabaseStatus('connected');
      logSupabase('info', 'sync', '全量同步完成');
      SUPABASE_LAST_SYNC = Date.now();
      startPolling();
      subscribeOrdersRealtime();
      subscribeChatRealtime();
      await ensureCurrentUser();
      // 重放离线队列
      flushOfflineQueue();
      render();
    } else {
      setSupabaseStatus('failed', '同步失败');
      // 不直接关闭 SUPABASE_ENABLED，保留写入和轮询重试机会
      SUPABASE_ENABLED = true;
      startPolling();
      logSupabase('warn', 'sync', '全量同步失败，继续使用本地数据，后台持续重试');
    }
  } catch (e) {
    setSupabaseStatus('failed', e.message);
    SUPABASE_ENABLED = true;
    startPolling();
    logSupabase('error', 'sync', '加载云端数据异常: ' + e.message);
  }
}

const REVERSE_FIELD_MAP = {};

function toSnake(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toSnake);
  const out = {};
  for (const k of Object.keys(obj)) {
    const sk = FIELD_MAP[k] || k;
    out[sk] = obj[k];
  }
  return out;
}

function toCamel(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toCamel);
  const out = {};
  for (const k of Object.keys(obj)) {
    const ck = REVERSE_FIELD_MAP[k] || k;
    out[ck] = obj[k];
  }
  return out;
}

// 将 settings 行（key-value 数组）转换为 DB.settings 对象
// 云端 settings 表结构：id(uuid)、key(text unique)、value(jsonb)、updated_at(timestamptz)
// 每一条配置存一行，通过 key 唯一标识，彻底避免 id 类型不匹配问题
function settingsRowsToDB(rows) {
  if (!rows || !Array.isArray(rows) || rows.length === 0) return null;
  const result = {};
  for (const row of rows) {
    const key = row.key;
    let value = row.value;
    // 兼容 value 已经是对象 / 字符串 JSON 两种情况
    if (typeof value === 'string') {
      try { value = JSON.parse(value); } catch (e) { /* 已是原始字符串 */ }
    }
    result[key] = value;
  }
  return result;
}

// 将 DB.settings 对象转换为 [{key, value, updated_at}] 数组
// 不传 id 字段，让数据库自动生成 UUID，用 key 做 onConflict upsert
function settingsDBToRows(s) {
  if (!s || typeof s !== 'object') return [];
  const now = new Date().toISOString();
  const rows = [];
  // 需要同步的设置项白名单（只同步运营配置，不同步本地偏好如 darkMode）
  const syncKeys = [
    'commissionRates',    // 抽成比例
    'platformInfo',       // 平台信息（名称、客服等）
    'platformName',       // 平台名称（独立字段）
    'serviceQQ',          // 客服QQ
    'serviceWechat',      // 客服微信
    'paymentQrWechat',    // 微信收款码
    'paymentQrAlipay',    // 支付宝收款码
    'featuredTitle',      // 热门订单标题
    'quickReplies',       // 快捷回复
    'banners',            // 横幅公告
    'announcements',      // 公告列表
    'adminPassword',      // 管理员密码
  ];
  // 额外把整个 s 中的所有键都尝试同步，保证新增字段自动同步
  const allKeys = [...new Set([...syncKeys, ...Object.keys(s)])];
  for (const key of allKeys) {
    if (!(key in s)) continue;
    // 跳过纯本地偏好设置（不同步到云端）
    if (['darkMode', 'notifications', 'voiceEnabled', 'lastReadAnnouncement'].includes(key)) continue;
    const value = s[key];
    rows.push({
      key: key,
      value: typeof value === 'string' ? value : JSON.stringify(value),
      updated_at: now
    });
  }
  return rows;
}

/**
 * 判断字符串是否为合法 UUID 格式
 * 用于推送前校验本地 id 是否能安全写入 UUID 类型列
 */
function isValidUUID(str) {
  if (typeof str !== 'string') return false;
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str);
}

/**
 * 清洗数据中的 id 字段：
 * - 如果 id 是合法 UUID → 保留（可正常 upsert）
 * - 如果 id 不是 UUID（如数字、自定义字符串）→ 删除 id，让数据库自动生成
 * - 同时删除可能是 UUID 类型但格式错误的字段
 * @param {Object|Array} data - 单行或多行数据
 * @returns {Object|Array} 清洗后的数据
 */
function sanitizeIds(data) {
  if (!data) return data;
  if (Array.isArray(data)) {
    return data.map(sanitizeIds);
  }
  if (typeof data !== 'object') return data;
  const out = { ...data };
  // 只处理主键 id，其他 _id 字段可能是外键（text 类型）不动
  if (out.id !== undefined && !isValidUUID(out.id)) {
    delete out.id;
  }
  return out;
}

/**
 * 合并本地订单与云端订单（核心保护逻辑）
 * 
 * 策略：
 * 1. 本地有、云端没有 → 保留本地（可能是刚创建尚未同步到云端的新订单，绝不能丢）
 * 2. 云端有、本地没有 → 新增到本地
 * 3. 两边都有 → 以更新时间（createTime / takeTime / completeTime 等最大时间戳）较新的为准
 * 
 * @param {Array} localOrders - 本地订单数组
 * @param {Array} remoteOrders - 云端订单数组
 * @param {Object} stats - 统计对象（写入 added/updated/localOnly）
 * @returns {Array} 合并后的订单数组
 */
function mergeOrders(localOrders, remoteOrders, stats) {
  const localMap = new Map();
  (localOrders || []).forEach(o => localMap.set(o.id, o));
  
  const merged = [];
  const usedLocalIds = new Set();
  
  // 遍历云端订单，逐条与本地对比
  remoteOrders.forEach(remote => {
    const local = localMap.get(remote.id);
    if (!local) {
      // 云端有、本地没有 → 新增
      merged.push(remote);
      if (stats) stats.added++;
    } else {
      // 两边都有 → 以更新时间较新的为准
      // 比较双方各时间戳的最大值，作为"最后更新时间"
      const localMax = Math.max(local.createTime || 0, local.takeTime || 0,
        local.completeTime || 0, local.cancelTime || 0, local.payTime || 0, local.reviewTime || 0);
      const remoteMax = Math.max(remote.createTime || 0, remote.takeTime || 0,
        remote.completeTime || 0, remote.cancelTime || 0, remote.payTime || 0, remote.reviewTime || 0);
      
      if (remoteMax >= localMax) {
        merged.push(remote);
        if (stats && remoteMax > localMax) stats.updated++;
        else if (stats) stats.unchanged++;
      } else {
        // 本地更新，保留本地（极端情况：本地刚改了状态还没同步上去）
        merged.push(local);
        if (stats) stats.unchanged++;
      }
      usedLocalIds.add(remote.id);
    }
  });
  
  // 本地有、云端没有的订单 → 保留（新创建但尚未同步到云端的订单）
  localOrders.forEach(local => {
    if (!usedLocalIds.has(local.id)) {
      merged.push(local);
      if (stats) stats.localOnly++;
    }
  });
  
  return merged;
}

/**
 * 合并本地考核/入驻申请与云端申请（核心保护逻辑）
 * 策略同 mergeOrders：本地独有保留、云端独有新增、两边都有以更新时间新的为准
 * @param {Array} localList - 本地数据
 * @param {Array} remoteList - 云端数据
 * @param {Object} stats - 统计对象
 * @returns {Array} 合并后数据
 */
function mergeAssessments(localList, remoteList, stats) {
  const localMap = new Map();
  (localList || []).forEach(o => localMap.set(o.id, o));
  
  const merged = [];
  const usedLocalIds = new Set();
  
  remoteList.forEach(remote => {
    const local = localMap.get(remote.id);
    if (!local) {
      merged.push(remote);
      if (stats) stats.added++;
    } else {
      // 比较最后更新时间（审核时间或提交时间）
      const localMax = Math.max(local.submitTime || 0, local.verifyTime || 0);
      const remoteMax = Math.max(remote.submitTime || 0, remote.verifyTime || 0);
      
      if (remoteMax >= localMax) {
        merged.push(remote);
        if (stats && remoteMax > localMax) stats.updated++;
        else if (stats) stats.unchanged++;
      } else {
        merged.push(local);
        if (stats) stats.unchanged++;
      }
      usedLocalIds.add(remote.id);
    }
  });
  
  // 本地有、云端没有的 → 保留（新提交但尚未同步到云端的申请）
  localList.forEach(local => {
    if (!usedLocalIds.has(local.id)) {
      merged.push(local);
      if (stats) stats.localOnly++;
    }
  });
  
  return merged;
}

/**
 * 同步前备份本地订单数据（保护措施：如果同步后数据异常可恢复）
 * 仅备份 orders 表，存到 localStorage 独立 key
 */
function backupLocalOrders() {
  try {
    const backup = {
      time: Date.now(),
      orderCount: (DB.orders || []).length,
      orders: DB.orders || []
    };
    localStorage.setItem(STORAGE_KEY + '_orders_backup', JSON.stringify(backup));
    return true;
  } catch (e) {
    console.warn('[Backup] 备份订单失败:', e.message);
    return false;
  }
}

/** 从备份恢复本地订单（系统设置页调用） */
function restoreLocalOrders() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY + '_orders_backup');
    if (!raw) return false;
    const backup = JSON.parse(raw);
    if (backup && Array.isArray(backup.orders)) {
      DB.orders = backup.orders;
      saveData(false);
      return backup.orders.length;
    }
    return false;
  } catch (e) {
    console.warn('[Backup] 恢复订单失败:', e.message);
    return false;
  }
}

async function syncFromSupabase() {
  if (!supabaseClient) return false;
  try {
    // 同步前备份本地订单，防止同步异常导致数据丢失
    backupLocalOrders();
    
    // 构建查询列表（跳过 settings（单独处理） 和 admins 表）
    const tablesToFetch = TABLE_MAP.filter(t => t.table !== 'settings' && t.table !== 'admins');
    
    // settings 单独查询（key-value 多行）
    const settingsPromise = withTimeout(
      supabaseClient.from('settings').select('*'),
      10000
    ).then(r => ({ table: 'settings', result: r }))
     .catch(e => ({ table: 'settings', error: e }));
    
    // 其他表并发查询，每个请求单独加超时
    const tablePromises = tablesToFetch.map(t => {
      let query = supabaseClient.from(t.table).select('*');
      // 大数据量表限制，避免超时（此处暂不限制，靠超时保护）
      return withTimeout(query, 15000)
        .then(r => ({ table: t.table, result: r }))
        .catch(e => ({ table: t.table, error: e }));
    });
    
    const allResults = await Promise.all([settingsPromise, ...tablePromises]);
    
    // 结果映射：table -> { data, error }
    const resultMap = {};
    allResults.forEach(r => {
      if (r.error) {
        resultMap[r.table] = { error: r.error.message || r.error };
        // settings 表失败降级为本地模式，不算失败
        if (r.table === 'settings') {
          setTableSyncStatus(r.table, 'local', r.error.message || r.error, 0);
        } else {
          setTableSyncStatus(r.table, 'failed', r.error.message || r.error, 0);
        }
      } else if (r.result?.error) {
        resultMap[r.table] = { error: r.result.error.message };
        if (r.table === 'settings') {
          setTableSyncStatus(r.table, 'local', r.result.error.message, 0);
        } else {
          setTableSyncStatus(r.table, 'failed', r.result.error.message, 0);
        }
      } else {
        const data = r.result.data;
        const count = Array.isArray(data) ? data.length : (data ? 1 : 0);
        resultMap[r.table] = { data };
        setTableSyncStatus(r.table, 'success', '', count);
      }
    });
    
    // 应用到 DB
    // ---- settings 特殊处理：key-value 行 → 本地对象 ----
    if (resultMap.settings?.data && Array.isArray(resultMap.settings.data)) {
      const remoteSettings = settingsRowsToDB(resultMap.settings.data);
      if (remoteSettings && Object.keys(remoteSettings).length > 0) {
        // 合并策略：云端设置覆盖本地运营配置，但保留本地偏好（darkMode等）
        const localPrefs = {
          darkMode: DB.settings?.darkMode,
          notifications: DB.settings?.notifications,
          voiceEnabled: DB.settings?.voiceEnabled,
          lastReadAnnouncement: DB.settings?.lastReadAnnouncement,
        };
        DB.settings = { ...DB.settings, ...remoteSettings, ...localPrefs };
        // 单独处理 adminPassword
        if (remoteSettings.adminPassword) {
          DB.adminPassword = remoteSettings.adminPassword;
        }
        addSyncLog('info', 'settings', 'pull', `拉取 ${resultMap.settings.data.length} 项配置`);
      }
    }
    
    // 集合表（除 settings / chat_messages 特殊处理外）
    // 注意：orders / assessments 表使用合并策略而非直接覆盖，防止本地新创建但尚未同步到云端的数据被覆盖丢失
    let orderStats = { added: 0, updated: 0, unchanged: 0, localOnly: 0 };
    let assessStats = { added: 0, updated: 0, unchanged: 0, localOnly: 0 };
    TABLE_MAP.forEach(t => {
      if (t.table === 'settings' || t.table === 'admins') return;
      if (t.table === 'chat_messages') return; // 单独处理
      if (!resultMap[t.table]?.data) return;
      
      const remoteData = toCamel(resultMap[t.table].data);
      
      // orders 表特殊处理：合并策略，保护本地新创建但尚未同步到云端的订单
      if (t.table === 'orders') {
        const merged = mergeOrders(DB.orders || [], remoteData, orderStats);
        DB[t.key] = merged;
        if (orderStats.added > 0 || orderStats.updated > 0 || orderStats.localOnly > 0) {
          addSyncLog('info', 'orders', 'pull',
            `拉取 ${remoteData.length} 条，新增 ${orderStats.added}，更新 ${orderStats.updated}，保留本地 ${orderStats.localOnly} 条未上云订单`);
        }
        return;
      }
      
      // assessments 表特殊处理：合并策略，保护本地新提交的考核/入驻申请
      if (t.table === 'assessments') {
        const merged = mergeAssessments(DB.assessments || [], remoteData, assessStats);
        DB[t.key] = merged;
        if (assessStats.added > 0 || assessStats.updated > 0 || assessStats.localOnly > 0) {
          addSyncLog('info', 'assessments', 'pull',
            `拉取 ${remoteData.length} 条，新增 ${assessStats.added}，更新 ${assessStats.updated}，保留本地 ${assessStats.localOnly} 条未上云申请`);
        }
        return;
      }
      
      // 其他表直接覆盖（数据量小且主要由管理端维护）
      DB[t.key] = remoteData;
    });
    
    // chat_messages 转为 { sessionId: [messages] } 结构
    if (resultMap.chat_messages?.data) {
      const msgs = toCamel(resultMap.chat_messages.data);
      const grouped = {};
      msgs.forEach(m => {
        const sid = m.sessionId || 'default';
        if (!grouped[sid]) grouped[sid] = [];
        grouped[sid].push(m);
      });
      DB.chatMessages = grouped;
    }
    
    // 统计成功/失败表数
    const allTables = Object.keys(resultMap);
    const successCount = allTables.filter(t => resultMap[t].data !== undefined).length;
    const failedCount = allTables.length - successCount;
    
    SUPABASE_ENABLED = true;
    SUPABASE_LAST_SYNC = Date.now();
    
    if (failedCount === 0) {
      setSupabaseStatus('connected');
    } else if (successCount > 0) {
      setSupabaseStatus('failed', `部分表同步失败（${failedCount}/${allTables.length}）`);
    } else {
      setSupabaseStatus('failed', '全部表同步失败');
    }
    
    migrateData();
    return failedCount === 0;
  } catch (e) {
    console.warn('[Supabase] syncFromSupabase failed:', e.message);
    setSupabaseStatus('failed', e.message);
    addSyncLog('error', 'all', 'pull', '同步异常：' + e.message);
    return false;
  }
}

// ============ 离线队列 ============
function addToOfflineQueue(table, record, mode = 'upsert') {
  SUPABASE_OFFLINE_QUEUE.push({ table, record, mode, time: Date.now() });
  logSupabase('warn', 'queue', `加入离线队列: ${table} (${SUPABASE_OFFLINE_QUEUE.length} 条)`);
  scheduleFlushQueue();
}

function scheduleFlushQueue() {
  if (SUPABASE_QUEUE_TIMER) return;
  SUPABASE_QUEUE_TIMER = setTimeout(() => {
    SUPABASE_QUEUE_TIMER = null;
    flushOfflineQueue();
  }, 3000);
}

async function flushOfflineQueue() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  if (SUPABASE_OFFLINE_QUEUE.length === 0) return;
  const queue = SUPABASE_OFFLINE_QUEUE.slice();
  SUPABASE_OFFLINE_QUEUE = [];
  logSupabase('info', 'queue', `开始重放 ${queue.length} 条离线操作`);
  let success = 0;
  for (const item of queue) {
    try {
      if (item.mode === 'upsert') {
        const { error } = await supabaseClient.from(item.table).upsert(item.record);
        if (error) throw error;
      }
      success++;
    } catch (e) {
      logSupabase('warn', 'queue', `重放失败 ${item.table}: ${e.message}`);
      SUPABASE_OFFLINE_QUEUE.push(item);
    }
  }
  if (success > 0) {
    logSupabase('info', 'queue', `重放成功 ${success}/${queue.length} 条`);
  }
  if (SUPABASE_OFFLINE_QUEUE.length > 0) {
    scheduleFlushQueue();
  }
}

// ============ 单条订单强制写入（立即，不防抖） ============
async function forceSyncOrder(order) {
  if (!supabaseClient || !SUPABASE_ENABLED) {
    addToOfflineQueue('orders', toSnake(order));
    return false;
  }
  try {
    const payload = toSnake(order);
    const { error } = await supabaseClient.from('orders').upsert(payload);
    if (error) throw error;
    logSupabase('info', 'order', `订单已同步: ${order.id}`);
    return true;
  } catch (e) {
    logSupabase('error', 'order', `订单写入失败: ${e.message}`);
    addToOfflineQueue('orders', toSnake(order));
    return false;
  }
}

async function forceFetchPendingOrders() {
  if (!supabaseClient || !SUPABASE_ENABLED) return null;
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('*')
      .eq('status', 'pending');
    if (error) throw error;
    const list = toCamel(data || []);
    // 合并到本地 DB（以云端为准，更新/追加）
    const map = new Map(DB.orders.map(o => [o.id, o]));
    list.forEach(o => map.set(o.id, o));
    DB.orders = Array.from(map.values());
    logSupabase('info', 'orders', `拉取待接单订单: ${list.length} 条`);
    return list;
  } catch (e) {
    logSupabase('error', 'orders', `拉取待接单订单失败: ${e.message}`);
    return null;
  }
}

/**
 * 从云端按 ID 拉取单条订单并合并到本地（订单详情页兜底）
 * @param {string} orderId - 订单 ID
 * @returns {Promise<boolean>} 是否找到订单
 */
async function fetchOrderFromCloud(orderId) {
  if (!supabaseClient || !SUPABASE_ENABLED || !orderId) return false;
  try {
    const { data, error } = await withTimeout(
      supabaseClient.from('orders').select('*').eq('id', orderId).limit(1),
      5000
    );
    if (error) throw error;
    if (!data || data.length === 0) {
      logSupabase('warn', 'order', `云端未找到订单: ${orderId}`);
      return false;
    }
    const order = toCamel(data[0]);
    // 合并到本地（有则更新，无则新增）
    const idx = DB.orders.findIndex(o => o.id === order.id);
    if (idx >= 0) {
      DB.orders[idx] = order;
    } else {
      DB.orders.push(order);
    }
    saveData(false);
    logSupabase('info', 'order', `从云端拉取订单: ${orderId}`);
    return true;
  } catch (e) {
    logSupabase('error', 'order', `拉取订单失败 ${orderId}: ${e.message}`);
    return false;
  }
}

// ============ 保存到 Supabase（异步，不阻塞渲染） ============
let _saveTimer = null;
let _savePending = false;

function scheduleSupabaseSave() {
  if (!SUPABASE_ENABLED || !supabaseClient) return;
  _savePending = true;
  if (_saveTimer) return;
  _saveTimer = setTimeout(() => {
    _saveTimer = null;
    if (_savePending) {
      _savePending = false;
      saveToSupabase().catch(e => console.warn('[Supabase] 保存失败:', e.message));
    }
  }, 500); // 500ms 防抖合并写入
}

async function saveToSupabase() {
  if (!supabaseClient) return false;
  let hasError = false;
  let successCount = 0;
  let totalTables = 0;
  
  try {
    // ============ 1. 构建待写入的表数据 ============
    const writeList = []; // [{ table, data, onConflict? }]
    
    // ---- settings 表：key-value 多行模式 ----
    // 用 key 字段作为唯一标识做 upsert，不传 id，彻底解决 UUID 类型不匹配问题
    // 每一个设置项存一行，便于增量更新和跨设备同步
    const settingsRows = settingsDBToRows(DB.settings);
    // 同时把 adminPassword 也同步进去（如果有）
    if (DB.adminPassword) {
      const now = new Date().toISOString();
      // 检查是否已有 adminPassword 行，有则覆盖，无则追加
      const existingIdx = settingsRows.findIndex(r => r.key === 'adminPassword');
      if (existingIdx >= 0) {
        settingsRows[existingIdx].value = DB.adminPassword;
        settingsRows[existingIdx].updated_at = now;
      } else {
        settingsRows.push({ key: 'adminPassword', value: DB.adminPassword, updated_at: now });
      }
    }
    if (settingsRows.length > 0) {
      writeList.push({
        table: 'settings',
        data: settingsRows,
        onConflict: 'key'  // 用 key 字段做 upsert，不是 id
      });
    }
    
    // 普通集合表（从 TABLE_MAP 取，过滤掉 settings / admins / chat_messages 特殊表）
    TABLE_MAP.forEach(t => {
      if (t.table === 'settings' || t.table === 'admins') return;
      if (t.table === 'chat_messages' || t.table === 'order_chat_messages') return;
      const localData = DB[t.key];
      if (Array.isArray(localData) && localData.length > 0) {
        // 字段名转 snake_case，并对 id 做安全清洗（非UUID格式的id会被移除，避免写入UUID列时报错）
        let data = toSnake(localData);
        data = sanitizeIds(data);
        writeList.push({
          table: t.table,
          data: data
        });
      } else if (Array.isArray(localData) && localData.length === 0) {
        // 空表也写一次，确保云端也为空（同步删除）
        writeList.push({ table: t.table, data: [] });
      }
    });
    
    // chat_messages 展平
    if (DB.chatMessages && typeof DB.chatMessages === 'object') {
      const flat = [];
      for (const [sid, arr] of Object.entries(DB.chatMessages)) {
        if (Array.isArray(arr)) {
          arr.forEach(m => flat.push({ ...m, sessionId: sid }));
        }
      }
      let data = toSnake(flat);
      data = sanitizeIds(data);
      writeList.push({ table: 'chat_messages', data: data });
    }
    
    // order_chat_messages 展平
    if (DB.orderChatMessages && typeof DB.orderChatMessages === 'object') {
      const flat = [];
      for (const [oid, arr] of Object.entries(DB.orderChatMessages)) {
        if (Array.isArray(arr)) {
          arr.forEach(m => {
            flat.push({
              id: m.id,
              order_id: oid,
              user_id: m.userId,
              booster_id: m.boosterId,
              sender: m.sender,
              content: m.content,
              is_read: m.isRead || false,
              created_at: m.createTime ? new Date(m.createTime).toISOString() : new Date().toISOString()
            });
          });
        }
      }
      const data = sanitizeIds(flat);
      writeList.push({ table: 'order_chat_messages', data: data });
    }
    
    totalTables = writeList.length;
    
    // ============ 2. 逐表执行 upsert，带超时+重试 ============
    for (const item of writeList) {
      const { table, data, onConflict } = item;
      const count = Array.isArray(data) ? data.length : 1;
      
      try {
        await withRetry(async () => {
          let promise;
          if (Array.isArray(data) && data.length === 0) {
            // 空数组 upsert 会报错，跳过（留待删除队列处理）
            return { data: [], error: null };
          } else if (Array.isArray(data) && data.length > 500) {
            // 数据量大时分批写入（每批 500 条）
            return batchUpsert(table, data, 500, onConflict);
          } else {
            // 如果指定了 onConflict 字段（如 settings 的 key），用它做冲突处理
            // 否则默认按主键 id upsert
            if (onConflict) {
              promise = supabaseClient.from(table).upsert(data, { onConflict: onConflict });
            } else {
              promise = supabaseClient.from(table).upsert(data);
            }
          }
          
          const result = await withTimeout(promise, 20000);
          if (result?.error) throw new Error(result.error.message || 'upsert failed');
          return result;
        }, 2, 1500); // 重试 2 次（共 3 次尝试），间隔 1.5 秒
        
        setTableSyncStatus(table, 'success', '', count);
        successCount++;
      } catch (e) {
        // settings 表如果云端不存在或结构不兼容，降级为本地模式（蓝色），不算失败
        // 其他表正常记录失败
        if (table === 'settings') {
          setTableSyncStatus(table, 'local', e.message || '云端未初始化', count);
          addSyncLog('warn', table, 'push', '云端settings表未初始化，使用本地模式：' + (e.message || e));
        } else {
          hasError = true;
          setTableSyncStatus(table, 'failed', e.message || '写入失败', 0);
          addSyncLog('error', table, 'push', '写入失败：' + (e.message || e));
          // 检测是否为网络错误，是则触发断线重连流程
          handleSyncFailure(table, e.message || e);
          // 启动离线队列重试（指数退避）
          scheduleOfflineRetry();
        }
      }
    }
    
    // 全部成功时重置离线重试计数
    if (!hasError) {
      _offlineRetryAttempts = 0;
    }
    
    // ============ 3. 处理删除队列 ============
    if (DB.deletionQueues && Object.keys(DB.deletionQueues).length > 0) {
      for (const [table, ids] of Object.entries(DB.deletionQueues)) {
        if (!ids || ids.length === 0) continue;
        totalTables++;
        try {
          let deletedCount = 0;
          // 分批删，每批 100 个
          for (let i = 0; i < ids.length; i += 100) {
            const batch = ids.slice(i, i + 100);
            await withRetry(async () => {
              const result = await withTimeout(
                supabaseClient.from(table).delete().in('id', batch),
                10000
              );
              if (result?.error) throw new Error(result.error.message);
              return result;
            }, 1, 800);
            deletedCount += batch.length;
          }
          clearDeletionFromQueue(table, ids);
          // 更新状态（追加删除统计）
          const prev = SYNC_TABLE_STATUS[table] || {};
          setTableSyncStatus(table, 'success', '', (prev.count || 0));
          addSyncLog('info', table, 'delete', `已同步删除 ${deletedCount} 条`);
          successCount++;
        } catch (e) {
          hasError = true;
          addSyncLog('error', table, 'delete', '删除失败：' + (e.message || e));
          // 保留在队列中下次重试
        }
      }
      // 回写 localStorage（删除队列可能变化）
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (_) {}
    }
    
    // ============ 4. 更新总状态 ============
    if (!hasError) {
      SUPABASE_LAST_SYNC = Date.now();
      setSupabaseStatus('connected');
      addSyncLog('info', 'all', 'push', `推送完成：${successCount}/${totalTables} 表成功`);
    } else {
      const failedCount = totalTables - successCount;
      setSupabaseStatus('failed', `${failedCount} 个表写入失败`);
      addSyncLog('warn', 'all', 'push', `推送部分失败：${successCount}/${totalTables} 成功`);
    }
    return !hasError;
  } catch (e) {
    logSupabase('error', 'save', 'saveToSupabase 异常: ' + e.message);
    setSupabaseStatus('failed', e.message);
    addSyncLog('error', 'all', 'push', '推送异常：' + e.message);
    return false;
  }
}

/**
 * 分批 upsert 大数据量表
 * @param {string} table - 表名
 * @param {Array} data - 完整数据数组（已转 snake_case）
 * @param {number} batchSize - 每批条数
 */
async function batchUpsert(table, data, batchSize = 500, onConflict = null) {
  for (let i = 0; i < data.length; i += batchSize) {
    const batch = data.slice(i, i + batchSize);
    const opts = onConflict ? { onConflict } : {};
    const result = await supabaseClient.from(table).upsert(batch, opts);
    if (result?.error) throw new Error(`批次 ${Math.floor(i/batchSize)+1} 失败：${result.error.message}`);
  }
  return { data: [], error: null };
}

// ============ 轮询同步 ============
// 最近一次云端订单的最大更新时间戳，用于快速判断是否有新数据
let _lastOrderUpdateTime = 0;
let _pendingAdminBadge = 0; // 管理后台新订单红点计数

function startPolling() {
  if (SUPABASE_POLL_TIMER) return;
  SUPABASE_POLL_TIMER = setInterval(async () => {
    if (!SUPABASE_ENABLED || !supabaseClient) return;
    try {
      // --- 快查：先看最新订单的更新时间，无变更则跳过全量拉取 ---
      const fastCheck = await fastCheckOrdersChanged();
      if (fastCheck === false) {
        // 无变化，不做全量同步，节省带宽
        return;
      }

      // 记录轮询前的 pending 订单数量和 ID 集合，用于新订单检测
      const prevPendingIds = new Set(DB.orders.filter(o => o.status === 'pending').map(o => o.id));
      const prevOrderCount = DB.orders.length;
      // 记录轮询前的聊天消息数量，用于新消息检测
      const prevOrderChatCount = countTotalOrderChatMessages();
      const prevChatCount = countTotalChatMessages();

      await syncFromSupabase();
      await syncOrderChatFromSupabase();

      // --- 新订单检测（管理员端：提示新订单红点）---
      if (DB.currentIdentity === 'admin') {
        const newOrders = DB.orders.filter(o => !prevPendingIds.has(o.id) && o.createTime && (Date.now() - o.createTime < 30000));
        if (newOrders.length > 0) {
          _pendingAdminBadge += newOrders.length;
          updateAdminBadge();
        }
      }

      // --- 新订单检测（打手端：语音播报）---
      if (DB.currentIdentity === 'booster') {
        const newPending = DB.orders.filter(o => o.status === 'pending' && !prevPendingIds.has(o.id));
        if (newPending.length > 0 && VOICE_STATE.initialized) {
          newPending.forEach(o => {
            if (!VOICE_STATE.announcedOrders.has(o.id)) {
              VOICE_STATE.announcedOrders.add(o.id);
              speak('您有新的订单，请及时抢单', { priority: 'high' });
            }
          });
        }
      }

      // --- 新消息检测 ---
      const newOrderChatCount = countTotalOrderChatMessages();
      const newChatCount = countTotalChatMessages();
      if (newOrderChatCount > prevOrderChatCount || newChatCount > prevChatCount) {
        const hasNewMsgForMe = checkHasNewIncomingMessage(prevOrderChatCount, prevChatCount);
        if (hasNewMsgForMe && VOICE_STATE.initialized) {
          const voiceText = DB.currentIdentity === 'admin' ? '您有新的客服消息' : '您有新的消息';
          speak(voiceText, { priority: 'low' });
        }
      }

      // 更新标题未读数
      updateTitleUnread();

      render();
      // 如果正在订单聊天页，滚动到底部
      if (STATE.subPage === 'orderChatDetail') {
        setTimeout(scrollOrderChatBottom, 50);
      }
    } catch (e) {
      // 静默失败，不影响用户使用
      logSupabase('warn', 'poll', '轮询异常: ' + (e.message || '未知'));
    }
  }, 8000); // 每 8 秒拉取一次
}

// ============ 网络状态监听与自动重连 ============
let _networkOnline = typeof navigator !== 'undefined' ? navigator.onLine : true;
let _reconnectTimer = null;
let _reconnectAttempts = 0;

/** 指数退避时间（毫秒）：1s, 2s, 4s, 8s, 16s, 30s, 30s... */
function getReconnectDelay(attempt) {
  if (attempt <= 0) return 1000;
  const delay = Math.min(1000 * Math.pow(2, attempt), 30000);
  return delay;
}

/** 监听浏览器网络状态变化，网络恢复时自动重连 */
function setupNetworkListeners() {
  if (typeof window === 'undefined') return;
  window.addEventListener('online', () => {
    _networkOnline = true;
    logSupabase('info', 'network', '网络已恢复，开始重连...');
    addSyncLog('info', 'all', 'network', '网络已恢复，正在重连云端...');
    // 网络恢复，立即重连 + 刷新离线队列
    _reconnectAttempts = 0;
    scheduleReconnect(500);
    // 立即处理离线队列
    scheduleOfflineRetry(1000);
  });
  window.addEventListener('offline', () => {
    _networkOnline = false;
    logSupabase('warn', 'network', '网络断开');
    setSupabaseStatus('offline', '网络断开');
    addSyncLog('warn', 'all', 'network', '网络断开，当前为本地模式，数据将在恢复后自动同步');
    render();
  });
}

/** 调度一次重连尝试（指数退避） */
function scheduleReconnect(delay) {
  if (_reconnectTimer) return; // 已有定时器不重复创建
  const actualDelay = delay != null ? delay : getReconnectDelay(_reconnectAttempts);
  _reconnectTimer = setTimeout(async () => {
    _reconnectTimer = null;
    if (!_networkOnline) {
      // 网络还没恢复，继续等
      _reconnectAttempts++;
      scheduleReconnect();
      return;
    }
    try {
      logSupabase('info', 'reconnect', `第 ${_reconnectAttempts + 1} 次重连尝试...`);
      setSupabaseStatus('connecting');
      const ok = initSupabase();
      if (ok) {
        logSupabase('info', 'reconnect', '重连成功');
        setSupabaseStatus('connected');
        _reconnectAttempts = 0;
        // 重连成功：拉取云端数据 + 处理离线队列
        await syncFromSupabase();
        await syncOrderChatFromSupabase();
        processOfflineQueue();
        addSyncLog('info', 'all', 'network', '云端重连成功，数据已同步');
        render();
      } else {
        throw new Error('初始化失败');
      }
    } catch (e) {
      _reconnectAttempts++;
      logSupabase('warn', 'reconnect', `重连失败: ${e.message}，${Math.round(getReconnectDelay(_reconnectAttempts)/1000)}s后重试`);
      setSupabaseStatus('offline', e.message || '重连失败');
      scheduleReconnect();
    }
  }, actualDelay);
}

/** 当保存到云端连续失败时触发断线重连流程 */
function handleSyncFailure(table, error) {
  // 如果错误是网络相关，启动重连流程
  const msg = (error || '').toString().toLowerCase();
  const isNetworkError = msg.includes('network') || msg.includes('timeout') || 
                         msg.includes('fetch') || msg.includes('econn') ||
                         msg.includes('enotfound') || msg.includes('offline') ||
                         msg.includes('failed to fetch') || msg.includes('abort');
  if (isNetworkError && SUPABASE_STATUS !== 'offline') {
    setSupabaseStatus('offline', error || '网络异常');
    addSyncLog('warn', 'all', 'network', '网络异常，切换到本地模式，恢复后自动重连');
    scheduleReconnect();
    render();
  }
}

// ============ 离线队列增强：指数退避重试 ============
let _offlineRetryTimer = null;
let _offlineRetryAttempts = 0;

/** 调度离线队列重试（指数退避） */
function scheduleOfflineRetry(delay) {
  if (_offlineRetryTimer) return;
  const actualDelay = delay != null ? delay : Math.min(1000 * Math.pow(2, _offlineRetryAttempts), 30000);
  _offlineRetryTimer = setTimeout(() => {
    _offlineRetryTimer = null;
    if (!_networkOnline || !supabaseClient) {
      _offlineRetryAttempts++;
      scheduleOfflineRetry();
      return;
    }
    processOfflineQueue().then(remaining => {
      if (remaining > 0) {
        _offlineRetryAttempts++;
        scheduleOfflineRetry();
      } else {
        _offlineRetryAttempts = 0;
      }
    }).catch(() => {
      _offlineRetryAttempts++;
      scheduleOfflineRetry();
    });
  }, actualDelay);
}

/**
 * 快查订单是否有变化
 * - 查最新 1 条订单的 create_time 和 update_time
 * - 与上次时间戳比对，无变化则返回 false（跳过全量拉取）
 * - 有变化或查询失败返回 true（继续全量同步）
 */
async function fastCheckOrdersChanged() {
  if (!supabaseClient || !SUPABASE_ENABLED) return true;
  try {
    const { data, error } = await withTimeout(
      supabaseClient
        .from('orders')
        .select('create_time, update_time, id')
        .order('create_time', { ascending: false })
        .limit(1),
      3000
    );
    if (error || !data || data.length === 0) return true; // 查询失败走全量
    const latestCreate = new Date(data[0].create_time || 0).getTime();
    const latestUpdate = new Date(data[0].update_time || data[0].create_time || 0).getTime();
    const latest = Math.max(latestCreate, latestUpdate);
    if (latest <= _lastOrderUpdateTime && DB.orders.length > 0) {
      return false; // 无变化
    }
    _lastOrderUpdateTime = latest;
    return true;
  } catch (e) {
    return true; // 快查失败，走全量兜底
  }
}

// ============== 语音播报 & 未读提示 ==============
const VOICE_STATE = {
  initialized: false,       // 是否已获得用户交互授权（浏览器自动播放策略）
  announcedOrders: new Set(), // 已播报过的订单 ID（去重）
  announcedMessages: new Set(), // 已播报过的消息 ID（去重）
  currentUtterance: null,   // 当前正在播放的语音
  currentPriority: 'low'    // 当前语音优先级 high > low
};

// 初始化语音播报（需在用户首次交互后调用，绕过浏览器自动播放限制）
function initVoice() {
  if (VOICE_STATE.initialized) return;
  if (!('speechSynthesis' in window)) return;
  // 尝试播放一个空语音以触发权限
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
    VOICE_STATE.initialized = true;
  } catch (e) {
    // 静默失败
  }
}

// 语音播报主函数
// priority: 'high'（新订单，可打断 low） / 'low'（新消息，不打断 high）
function speak(text, opts = {}) {
  const priority = opts.priority || 'low';

  // 检查开关
  if (!DB.settings.voiceEnabled) return;
  // 检查浏览器支持
  if (!('speechSynthesis' in window)) return;
  // 检查初始化（用户交互权限）
  if (!VOICE_STATE.initialized) return;

  // 优先级控制：新订单可以打断新消息，反之不行
  if (VOICE_STATE.currentUtterance) {
    if (priority === 'high' && VOICE_STATE.currentPriority === 'low') {
      window.speechSynthesis.cancel();
    } else {
      return; // 有更高或同级语音在播，跳过
    }
  }

  try {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 1.0;     // 正常语速
    utter.pitch = 1.0;    // 正常音调
    utter.volume = 0.8;   // 适中音量

    // 尝试选择中文女声
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('zh') && !v.name.toLowerCase().includes('male'));
    if (zhVoice) utter.voice = zhVoice;

    utter.onstart = () => {
      VOICE_STATE.currentUtterance = utter;
      VOICE_STATE.currentPriority = priority;
    };
    utter.onend = () => {
      VOICE_STATE.currentUtterance = null;
    };
    utter.onerror = () => {
      VOICE_STATE.currentUtterance = null;
    };

    window.speechSynthesis.speak(utter);
  } catch (e) {
    // 静默降级
  }
}

// 统计订单聊天消息总数（用于新消息检测）
function countTotalOrderChatMessages() {
  if (!DB.orderChatMessages) return 0;
  let count = 0;
  Object.values(DB.orderChatMessages).forEach(arr => { count += arr.length; });
  return count;
}

// 统计客服聊天消息总数
function countTotalChatMessages() {
  if (!DB.chatMessages) return 0;
  let count = 0;
  Object.values(DB.chatMessages).forEach(arr => { count += arr.length; });
  return count;
}

// 检查是否有发给我的新消息（排除自己发的 & 当前正在聊天的会话）
function checkHasNewIncomingMessage(prevOrderChatCount, prevChatCount) {
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';
  let hasNew = false;

  // 订单聊天：只统计对方发来的、且不在当前聊天页的消息
  if (DB.orderChatMessages) {
    Object.entries(DB.orderChatMessages).forEach(([oid, msgs]) => {
      const isCurrentChat = STATE.subPage === 'orderChatDetail' && STATE.orderChatOrderId === oid;
      if (isCurrentChat) return;
      msgs.forEach(m => {
        if (m.sender !== identity && !VOICE_STATE.announcedMessages.has(m.id)) {
          VOICE_STATE.announcedMessages.add(m.id);
          hasNew = true;
        }
      });
    });
  }

  // 客服聊天
  if (DB.chatMessages && DB.chatSessions) {
    DB.chatSessions.forEach(s => {
      const msgs = DB.chatMessages[s.id] || [];
      const isCurrentChat = STATE.subPage === 'chatDetail' && STATE.chatSessionId === s.id;
      if (isCurrentChat) return;
      msgs.forEach(m => {
        // 对方发来的消息（admin 发给我，或我是 admin 时用户发给我）
        const isIncoming = identity === 'admin' ? m.senderType !== 'admin' : m.senderType === 'admin';
        if (isIncoming && !VOICE_STATE.announcedMessages.has(m.id)) {
          VOICE_STATE.announcedMessages.add(m.id);
          hasNew = true;
        }
      });
    });
  }

  return hasNew;
}

// 计算总未读数（订单聊天 + 客服聊天 + 系统通知）
function getTotalUnread() {
  let count = 0;
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';

  // 订单聊天未读
  if (DB.orderChatMessages) {
    Object.values(DB.orderChatMessages).forEach(msgs => {
      msgs.forEach(m => {
        if (m.sender !== identity && !m.isRead) count++;
      });
    });
  }

  // 客服聊天未读
  if (DB.chatSessions) {
    DB.chatSessions.forEach(s => {
      if (s.unread) count += s.unread;
    });
  }

  // 系统通知未读（取第一条示例的 unread，实际场景可能是数组）
  if (DB.messages) {
    DB.messages.forEach(m => {
      if (m.unread) count += m.unread;
    });
  }

  return count;
}

// 更新浏览器标签页标题（显示未读数）
function updateTitleUnread() {
  const total = getTotalUnread();
  const baseName = DB.settings.platformName || '护航电竞';
  document.title = total > 0 ? `（${total}）${baseName}` : baseName;
}

function reconnectSupabase() {
  stopPolling();
  SUPABASE_ENABLED = false;
  const ok = initSupabase();
  if (ok) {
    loadSupabaseInBackground();
    toast('正在重新连接云端...');
  } else {
    toast('云端未连接，继续使用本地数据');
  }
  render();
}


function migrateData() {
  // 迁移：抽成比例设置（平台抽成百分比）
  if (!DB.settings.commissionRates) {
    DB.settings.commissionRates = { junior: 70, intermediate: 60, senior: 45, top: 10 };
  }
  // 迁移：护航师等级字段
  if (DB.boosters) {
    DB.boosters.forEach((b, i) => {
      if (!b.level) {
        // 前2个高级，中间2个中级，后2个初级
        if (i < 2) b.level = 'senior';
        else if (i < 4) b.level = 'intermediate';
        else b.level = 'junior';
      }
    });
  }
  // 迁移：已完成订单补抽成字段
  if (DB.orders) {
    DB.orders.forEach(o => {
      if (o.status === 'completed' && o.boosterIncome === undefined) {
        const calc = calcCommission(o.realPay, o.boosterId);
        o.platformCommission = calc.platform;
        o.boosterIncome = calc.booster;
        o.commissionRate = calc.rate;
      }
    });
  }
  // 迁移：收入记录补字段
  if (DB.incomeRecords) {
    DB.incomeRecords.forEach(r => {
      if (r.platformIncome === undefined && r.rate === undefined) {
        r.platformIncome = 0;
        r.rate = 20;
      }
    });
  }
  // 迁移：KG 俱乐部和平精英地铁逃生物品与热门订单
  // - 版本化迁移：每次版本号提升都会重刷官方护航商品（删除旧的再注入新的），
  //   确保价格表更新后老用户本地也能看到最新商品（不影响用户自建商品）
  const KG_PRODUCTS_VERSION = 2;
  if (DB.settings._migratedKgClubVersion !== KG_PRODUCTS_VERSION) {
    // 删除旧的官方护航商品（按 boosterId 判断），避免重名/残留
    if (DB.products) {
      DB.products = DB.products.filter(p => p.boosterId !== KG_BOOSTER_ID);
    }
    // 删除旧的热门订单（按 productId 前缀判断）
    if (DB.featuredOrders) {
      DB.featuredOrders = DB.featuredOrders.filter(f => !f.productId || !f.productId.startsWith('p_kg_'));
    }
    seedKGClubProducts();
    DB.settings._migratedKgClubVersion = KG_PRODUCTS_VERSION;
  }
  saveData();
}

    scheduleSupabaseSave();
    // 同步当前用户信息
    scheduleUserSync();
  }
}

/**
 * 登记一条待同步到 Supabase 的删除操作
 * 因为 upsert 只能增/改，删不掉数据库里已有的记录
 * 所以每次删除本地数据时，把 id 加入对应表的删除队列，下次 saveToSupabase 时执行 delete
 * @param {string} table 数据库表名（蛇形）
 * @param {string} id 记录 id
 */
function enqueueDeletion(table, id) {
  if (!DB.deletionQueues) DB.deletionQueues = {};
  if (!DB.deletionQueues[table]) DB.deletionQueues[table] = [];
  if (!DB.deletionQueues[table].includes(id)) {
    DB.deletionQueues[table].push(id);
  }
}

/**
 * 从删除队列中移除已成功同步删除的 id
 */
function clearDeletionFromQueue(table, ids) {
  if (!DB.deletionQueues || !DB.deletionQueues[table]) return;
  const removeSet = new Set(Array.isArray(ids) ? ids : [ids]);
  DB.deletionQueues[table] = DB.deletionQueues[table].filter(id => !removeSet.has(id));
  if (DB.deletionQueues[table].length === 0) {
    delete DB.deletionQueues[table];
  }
}

      balance: parseFloat(u.balance || 0),

    };

  } catch (e) {

  }
}

function $(sel) { return document.querySelector(sel); }

function formatTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const pad = n => n.toString().padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatTimeShort(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  const pad = n => n.toString().padStart(2, '0');
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function formatMoney(n) { return (n || 0).toFixed(2); }
function genId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

/**
 * 生成唯一订单号
 * 格式：O + 时间戳后10位 + 2位随机数（如 O1725000000AB）
 * 自动去重：如果和已有订单重复则重新生成
 */
function genOrderId() {
  let id;
  let attempts = 0;
  const existingIds = new Set(DB.orders.map(o => o.id));
  do {
    const rand = Math.random().toString(36).substr(2, 2).toUpperCase();
    id = 'O' + Date.now().toString().slice(-10) + rand;
    attempts++;
  } while (existingIds.has(id) && attempts < 10);
  return id;
}

const LEVEL_MAP = {
  junior: { name:'初级', color:'#b87333', bg:'rgba(184,115,51,0.15)' },
  intermediate: { name:'中级', color:'#c0c0c0', bg:'rgba(192,192,192,0.15)' },
  senior: { name:'高级', color:'#d4af37', bg:'rgba(212,175,55,0.2)' },
  top: { name:'顶级', color:'#ff4d4d', bg:'rgba(255,77,77,0.2)' }
};

function getLevelInfo(level) {
  return LEVEL_MAP[level] || LEVEL_MAP.junior;
}

function getBoosterCommission(booster) {
  if (!booster) return 20;
  // 优先使用自定义抽成，否则用等级默认抽成
  if (booster.customCommission !== undefined && booster.customCommission !== null && booster.customCommission !== '') {
    return Number(booster.customCommission);
  }
  const level = booster.level || 'junior';
  return DB.settings.commissionRates?.[level] ?? 20;
}

function getCommissionRate(boosterId) {
  const b = getBooster(boosterId);
  return getBoosterCommission(b);
}

function calculateIncome(orderAmount, commissionRate) {
  // commissionRate 为百分比整数（如 70 表示平台抽 70%）
  const rate = Number(commissionRate) / 100;
  const platform = Math.round(orderAmount * rate * 100) / 100;
  const booster = Math.round((orderAmount - platform) * 100) / 100;
  return { platformCommission: platform, boosterIncome: booster, rate: commissionRate };
}

function calcCommission(amount, boosterId) {
  const rate = getCommissionRate(boosterId);
  const result = calculateIncome(amount, rate);
  return { platform: result.platformCommission, booster: result.boosterIncome, rate };
}

function renderLevelBadge(level, size) {
  const info = getLevelInfo(level);
  const s = size || 'sm';
  const padding = s === 'sm' ? '2px 8px' : '3px 10px';
  const fontSize = s === 'sm' ? '10px' : '12px';
  return `<span style="display:inline-block;padding:${padding};border-radius:4px;font-size:${fontSize};font-weight:600;background:${info.bg};color:${info.color};border:1px solid ${info.color}40">${info.name}护航师</span>`;
}

function toast(msg, duration = 2000) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

  if (opts.closeOnOverlay !== false) {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();

  }

}

function clearLoginError() {
  const el = document.getElementById('loginError');
  if (el) el.textContent = '';
}

function setLoginError(msg) {
  LOGIN_STATE.errorMsg = msg;
  const el = document.getElementById('loginError');
  if (el) el.textContent = msg;
}

function showAdminLogin() {
  LOGIN_STATE.adminMode = true;

  LOGIN_STATE.adminMode = false;
  LOGIN_STATE.errorMsg = '';

async function doLogin() {
  const nickname = document.getElementById('loginNickname')?.value.trim();
  const password = document.getElementById('loginPassword')?.value;
  
  if (!nickname) { setLoginError('请输入昵称'); return; }
  if (!password) { setLoginError('请输入密码'); return; }
  
  LOGIN_STATE.loading = true;
  render();
  
  try {
    const result = await loginUser(nickname, password);
    if (result.success) {
      toast('登录成功');
      // 登录后默认进入用户端首页
      DB.currentIdentity = 'user';
      STATE.page = 'home';
      STATE.subPage = null;
      LOGIN_STATE.loading = false;
      render();
    } else {
      LOGIN_STATE.loading = false;
      setLoginError(result.message);
      render();
    }
  } catch (e) {
    LOGIN_STATE.loading = false;
    setLoginError('登录失败：' + e.message);
    render();
  }
}

async function doRegister() {
  const nickname = document.getElementById('regNickname')?.value.trim();
  const password = document.getElementById('regPassword')?.value;
  const password2 = document.getElementById('regPassword2')?.value;
  
  if (!nickname) { setLoginError('请输入昵称'); return; }
  if (nickname.length < 2 || nickname.length > 20) { setLoginError('昵称2-20位字符'); return; }
  if (!password) { setLoginError('请输入密码'); return; }
  if (password.length < 6) { setLoginError('密码至少6位'); return; }
  if (password !== password2) { setLoginError('两次密码不一致'); return; }
  
  LOGIN_STATE.loading = true;
  render();
  
  try {
    const result = await registerUser(nickname, password);
    if (result.success) {
      toast('注册成功');
      DB.currentIdentity = 'user';
      STATE.page = 'home';
      STATE.subPage = null;
      LOGIN_STATE.loading = false;
      render();
    } else {
      LOGIN_STATE.loading = false;
      setLoginError(result.message);
      render();
    }
  } catch (e) {
    LOGIN_STATE.loading = false;
    setLoginError('注册失败：' + e.message);
    render();
  }
}

async function doAdminLogin() {
  const username = document.getElementById('adminLoginUser')?.value.trim() || 'admin';
  const password = document.getElementById('adminLoginPwd')?.value;
  
  if (!username) { setLoginError('请输入管理员账号'); return; }
  if (!password) { setLoginError('请输入密码'); return; }
  
  // 防止重复点击
  if (LOGIN_STATE.loading) return;
  
  LOGIN_STATE.loading = true;
  LOGIN_STATE.errorMsg = '';
  render();
  
  try {
    const result = await verifyAdminLogin(username, password);
    
    if (result.ok) {
      // 设置管理员登录态
      AUTH_STATE.isLoggedIn = true;
      AUTH_STATE.userId = 'admin';
      AUTH_STATE.nickname = '管理员';
      AUTH_STATE.role = 'admin';
      saveAuthState();
      
      DB.currentIdentity = 'admin';
      STATE.adminNav = 'dashboard';
      
      // 超时降级时提示用户网络异常
      if (result.source === 'timeout_fallback') {
        toast('网络较慢，已使用本地验证登录');
      } else {
        toast('登录成功');
      }
      
      LOGIN_STATE.loading = false;
      render();
    } else {
      LOGIN_STATE.loading = false;
      setLoginError('账号或密码错误');
      render();
    }
  } catch (e) {
    console.error('[AdminLogin] doAdminLogin error:', e);
    LOGIN_STATE.loading = false;
    setLoginError('登录失败：' + (e.message || '未知错误'));
    render();
  }
}

/** 格式化同步时间（相对时间或绝对时间） */
function formatSyncTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/** 管理后台刷新：强制从云端拉取最新数据 */
let _adminRefreshing = false;
async function refreshAdminData() {
  if (_adminRefreshing) return;
  if (!supabaseClient || !SUPABASE_ENABLED) {
    toast('当前为本地模式，无需刷新');
    return;
  }
  _adminRefreshing = true;
  const btn = document.getElementById('adminRefreshBtn');
  if (btn) btn.classList.add('spinning');
  try {
    const ok = await syncFromSupabase();
    if (ok) {
      toast('数据已更新');
      SUPABASE_LAST_SYNC = Date.now();
    } else {
      toast('刷新失败，请检查云端连接');
    }
    render();
  } catch (err) {
    toast('刷新失败：' + (err.message || '未知错误'));
  } finally {
    _adminRefreshing = false;
    const btn2 = document.getElementById('adminRefreshBtn');
    if (btn2) btn2.classList.remove('spinning');
  }
}

  const el = document.getElementById('bannerCarousel');
  if (!el) return;
  const w = el.clientWidth;
  const idx = Math.round(el.scrollLeft / w);
  STATE.bannerIndex = idx;
  const dots = document.querySelectorAll('#bannerDots span');
  dots.forEach((d,i) => d.classList.toggle('active', i === idx));
}

// 首页手动刷新：强制从 Supabase 同步最新的热门订单/商品/游戏等数据
let _homeRefreshing = false;
async function refreshHomeData(e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  if (_homeRefreshing) return;
  if (!supabaseClient || !SUPABASE_ENABLED) {
    toast('当前为本地模式，无需刷新');
    return;
  }
  _homeRefreshing = true;
  // 旋转图标提示加载中
  const icon = document.getElementById('homeRefreshIcon');
  if (icon) icon.style.transition = 'transform 0.6s linear', icon.style.transform = 'rotate(360deg)';
  try {
    const ok = await syncFromSupabase();
    if (ok) {
      toast('已更新');
      SUPABASE_LAST_SYNC = Date.now();
    } else {
      toast('刷新失败，请稍后重试');
    }
    render();
  } catch (err) {
    toast('刷新失败');
  } finally {
    _homeRefreshing = false;
    const i2 = document.getElementById('homeRefreshIcon');
    if (i2) setTimeout(() => { i2.style.transform = 'rotate(0deg)'; }, 50);
  }
}

function nextBanner() {
  const banners = (DB.banners || []).filter(b => b.enabled !== false);
  STATE.bannerIndex = (STATE.bannerIndex + 1) % Math.max(banners.length, 1);
  const el = document.getElementById('bannerCarousel');
  if (el) {
    const w = el.clientWidth;
    el.scrollTo({ left: STATE.bannerIndex * w, behavior: 'smooth' });
  }
  render();
}

  const total = p.price * orderForm.quantity;
  let discount = 0;
  if (orderForm.couponId) {
    const c = DB.coupons.find(x=>x.id===orderForm.couponId);
    if (c && total >= c.minAmount) discount = c.amount;
  }
  const realPay = total - discount;
  
  const order = {
    id: genOrderId(),
    orderNo: genOrderId(),
    userId: DB.currentUser.id,
    userName: DB.currentUser.nickname,
    boosterId: '',          // 抢单模式：下单时不指定护航师，由打手抢单后绑定

    productId: p.id,
    productName: p.name,
    productType: p.type,
    unitPrice: p.price,
    quantity: orderForm.quantity,
    totalAmount: total,
    unit: p.unit,
    price: total,
    realPay: realPay,
    couponId: orderForm.couponId,
    couponAmount: discount,
    server: orderForm.server,
    gameIdAccount: orderForm.gameAccount,
    gameAccount: orderForm.gameAccount,
    requirement: orderForm.requirement,
    contact: orderForm.contact,
    status: 'pending',
    payStatus: 'unpaid',
    createTime: Date.now(),
    payTime: null,
    takeTime: null,        // 抢单时间

    completeTime: null

  STATE.pendingOrder = order;

        <button class="btn btn-primary btn-block" onclick="confirmPay()">确认支付 ¥${formatMoney(order.realPay)}</button>
      </div>
    </div>`;
}

function confirmPay() {
  const order = STATE.pendingOrder;
  if (!order) return;
  const payway = document.querySelector('input[name="payway"]:checked')?.value || 'qrcode';
  
  if (payway === 'qrcode') {
    showQrCodePayModal(order);
  } else {
    if (DB.currentUser.balance < order.realPay) {
      toast('余额不足，请先充值');
      return;
    }
    DB.currentUser.balance -= order.realPay;
    completeOrderPay(order, 'balance');
  }
}

  if (!order) return;

  order.payStatus = 'pendingConfirm';
  order.payway = 'qrcode';
  order.status = 'pendingPay';
  
  // 确保订单已入列表（新订单首次提交）
  const existing = DB.orders.find(x => x.id === order.id);
  if (!existing) {
    DB.orders.push(order);
  }
  
  // 【关键】立即保存到 localStorage，防止页面刷新或跳转丢失
  // 注意：saveData 默认会触发云端同步，但我们下面会单独 forceSyncOrder 立即同步
  saveData();
  
  // 支付记录
  DB.paymentRecords.push({
    id: 'pay_' + Date.now(),
    orderId: order.id,
    userId: order.userId,
    amount: order.realPay,
    payway: 'qrcode',
    status: 'pendingConfirm',
    createTime: Date.now()
  });

  showModal(`

  setTimeout(() => {
    closeModal();

    STATE.page = 'orders';
    STATE.subPage = 'orderDetail';
    STATE.pendingOrder = null;
    orderForm = { quantity:1, server:'', gameAccount:'', requirement:'', contact:'', couponId:null };
