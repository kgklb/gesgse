function completeOrderPay(order, payway) {
  order.status = 'pending'; // 待接单
  order.payStatus = 'paid';
  order.payTime = Date.now();
  order.payway = payway;
  DB.orders.push(order);
  
  // Record payment
  DB.paymentRecords.push({
    id: genId('P'),
    orderId: order.id,
    userId: order.userId,
    amount: order.realPay,
    payway: payway,
    status: 'success',
    createTime: Date.now(),
    payTime: Date.now(),
    tradeNo: ''
  });
  
  // Flow record
  DB.flowRecords.push({
    id: genId('F'),
    userId: order.userId,
    type: 'consume',
    amount: order.realPay,
    balanceChange: -order.realPay,
    orderId: order.id,
    description: `订单支付 ${order.productName}`,
    createTime: Date.now()
  });
  
  // 扣减优惠券
  if (order.couponId) {
    const idx = DB.userCoupons.indexOf(order.couponId);
    if (idx > -1) DB.userCoupons.splice(idx, 1);
  }
  
  // 增加系统消息
  addSystemMessage('订单支付成功', `您的订单 ${order.id} 已支付成功，等待护航师接单`);
  
  saveData();
  
  // 立即同步订单到 Supabase（不等待防抖，静默同步）
  forceSyncOrder(order).catch(e => logSupabase('warn', 'order', `订单同步失败，稍后自动重试: ${e.message}`));
}

// 给指定用户发送一条客服会话消息（用户端消息页可看到）
function addMessageToUser(userId, fromName, content) {
  if (!userId || !content) return;
  const sessionId = 'sys_' + userId;
  let session = DB.chatSessions.find(s => s.id === sessionId);
  if (!session) {
    session = {
      id: sessionId,
      userId: userId,
      userName: fromName || '系统',
      avatar: fromName?.substr(0,1) || '系',
      lastMsg: content,
      lastTime: Date.now(),
      unread: 1,
      isSystem: true
    };
    DB.chatSessions.push(session);
  } else {
    session.lastMsg = content;
    session.lastTime = Date.now();
    session.unread = (session.unread || 0) + 1;
  }
  if (!DB.chatMessages) DB.chatMessages = {};
  if (!DB.chatMessages[sessionId]) DB.chatMessages[sessionId] = [];
  DB.chatMessages[sessionId].push({
    id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    senderType: 'system',
    senderId: 'system',
    senderName: fromName || '系统',
    content: content,
    createTime: Date.now(),
    isRead: false
  });
}

// --- ORDERS ---
function renderOrdersPage() {
  const tabs = [
    { k:'all', n:'全部' },
    { k:'pending', n:'待接单' },
    { k:'ongoing', n:'已接单' },
    { k:'in_progress', n:'服务中' },
    { k:'toConfirm', n:'待确认' },
    { k:'completed', n:'已完成' },
    { k:'refund', n:'退款' }
  ];
  
  let orders = DB.orders.filter(o => o.userId === DB.currentUser.id);
  if (STATE.orderTab !== 'all') {
    if (STATE.orderTab === 'refund') {
      orders = orders.filter(o => o.status === 'refunding' || o.status === 'refunded');
    } else {
      orders = orders.filter(o => o.status === STATE.orderTab);
    }
  }
  orders.sort((a,b) => b.createTime - a.createTime);
  
  return `
    <div class="page active">
      <div class="inner-tabs">
        ${tabs.map(t => `<div class="inner-tab ${STATE.orderTab===t.k?'active':''}" onclick="STATE.orderTab='${t.k}';render()">${t.n}</div>`).join('')}
      </div>
      ${orders.length === 0 ? '<div class="empty"><p>暂无订单</p></div>' : orders.map(o => renderOrderCard(o)).join('')}
    </div>`;
}

function renderOrderCard(o) {
  const chatMsgs = DB.orderChatMessages?.[o.id] || [];
  const unread = chatMsgs.filter(m => m.sender !== 'user' && !m.isRead).length;
  return `
    <div class="order-card" onclick="goSubPage('orderDetail',{selectedOrderId:'${o.id}'})">
      <div class="order-header">
        <span class="order-game">${o.gameName} · ${o.productName}</span>
        <span class="order-status ${getStatusClass(o.status)}">${getStatusText(o.status)}${unread>0?'<span class="unread-dot" style="margin-left:4px"></span>':''}</span>
      </div>
      <div class="order-body">
        <div class="avatar sm">${o.boosterName?o.boosterName.substr(0,1):'?'}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">${o.boosterName || '等待接单中'}</div>
          <div style="font-size:12px;color:var(--text-3);margin-top:3px">${o.quantity}${o.unit} · 下单于 ${formatTimeShort(o.createTime)}</div>
        </div>
        <div style="text-align:right">
          <div class="price" style="font-size:15px">¥${formatMoney(o.realPay)}</div>
        </div>
      </div>
      <div class="order-footer">
        ${renderOrderActions(o, unread)}
      </div>
    </div>`;
}

function renderOrderActions(o, unread = 0) {
  let btns = [];
  if (o.status === 'pending') {
    btns.push(`<button class="btn btn-gray btn-sm" onclick="event.stopPropagation();cancelOrder('${o.id}')">取消订单</button>`);
  } else if (o.status === 'ongoing' || o.status === 'in_progress') {
    btns.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openOrderChat('${o.id}')">${unread>0?'消息('+unread+')':'联系护航师'}</button>`);
  } else if (o.status === 'toConfirm') {
    btns.push(`<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();confirmComplete('${o.id}')">确认完成</button>`);
    btns.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openOrderChat('${o.id}')">${unread>0?'消息('+unread+')':'联系护航师'}</button>`);
  } else if (o.status === 'completed') {
    btns.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();goSubPage('orderDetail',{selectedOrderId:'${o.id}'})">去评价</button>`);
  }
  return btns.join('');
}

function renderOrderDetail() {
  const o = DB.orders.find(x => x.id === STATE.selectedOrderId);
  // 找不到订单时：如果云端已连接，显示加载中并后台从云端拉取该订单
  if (!o) {
    if (SUPABASE_ENABLED && supabaseClient && STATE.selectedOrderId) {
      // 启动单次拉取（只拉一次，避免死循环）
      if (!STATE._orderDetailRetryDone) {
        STATE._orderDetailRetryDone = true;
        fetchOrderFromCloud(STATE.selectedOrderId).then(found => {
          if (found) {
            render();
          } else {
            // 云端也没有，标记为确认不存在
            STATE._orderDetailNotFound = true;
            render();
          }
        });
      }
      if (STATE._orderDetailNotFound) {
        return `
          <div class="empty">
            <div style="font-size:40px;margin-bottom:12px">📋</div>
            <div style="font-size:14px;color:var(--text-2);margin-bottom:8px">订单不存在</div>
            <div style="font-size:12px;color:var(--text-3)">订单号：${STATE.selectedOrderId || ''}</div>
          </div>`;
      }
      return `
        <div class="empty">
          <div class="loading-spinner" style="margin-bottom:12px"></div>
          <div style="font-size:14px;color:var(--text-2)">订单加载中...</div>
          <div style="font-size:12px;color:var(--text-3);margin-top:4px">正在从云端同步订单数据</div>
        </div>`;
    }
    return '<div class="empty">订单不存在</div>';
  }
  // 找到订单，重置重试标记
  if (STATE._orderDetailRetryDone) {
    STATE._orderDetailRetryDone = false;
    STATE._orderDetailNotFound = false;
  }
  
  const steps = [
    { k:'paid', label:'已支付', done: !!o.payTime },
    { k:'taken', label:'已接单', done: o.status === 'ongoing' || o.status === 'in_progress' || o.status === 'toConfirm' || o.status === 'completed' || o.status === 'reviewed' },
    { k:'serving', label:'服务中', done: o.status === 'in_progress' || o.status === 'toConfirm' || o.status === 'completed' || o.status === 'reviewed' },
    { k:'pending', label:'待确认', done: o.status === 'toConfirm' || o.status === 'completed' || o.status === 'reviewed' },
    { k:'done', label:'已完成', done: o.status === 'completed' || o.status === 'reviewed' }
  ];
  
  return `
    <div class="page active">
      <div class="detail-section">
        <div class="progress-steps">
          ${steps.map(s => `<div class="progress-step ${s.done?'done':''}"><div class="step-dot">${s.done?ICONS.check.replace('stroke-width="3"','stroke-width="2"').replace('<svg','<svg width="12" height="12"') : ''}</div><span class="step-label">${s.label}</span></div>`).join('')}
        </div>
        <div style="text-align:center;font-size:13px;color:var(--text-2)">
          当前状态：<span class="order-status ${getStatusClass(o.status)}" style="font-size:14px">${getStatusText(o.status)}</span>
        </div>
      </div>
      
      <div class="detail-section">
        <h4>服务信息</h4>
        <div class="price-row"><span class="label">护航师</span><span class="value">${o.boosterName||'等待打手抢单'}</span></div>
        <div class="price-row"><span class="label">游戏</span><span class="value">${o.gameName}</span></div>
        <div class="price-row"><span class="label">商品</span><span class="value">${o.productName}</span></div>
        <div class="price-row"><span class="label">数量</span><span class="value">${o.quantity} ${o.unit}</span></div>
        <div class="price-row"><span class="label">区服</span><span class="value">${o.server||'-'}</span></div>
        <div class="price-row"><span class="label">游戏ID</span><span class="value">${o.gameIdAccount}</span></div>
        ${o.requirement ? `<div class="price-row"><span class="label">特殊要求</span><span class="value">${o.requirement}</span></div>` : ''}
      </div>
      
      <div class="detail-section">
        <h4>订单信息</h4>
        <div class="price-row"><span class="label">订单号</span><span class="value">${o.id}</span></div>
        <div class="price-row"><span class="label">下单时间</span><span class="value">${formatTime(o.createTime)}</span></div>
        <div class="price-row"><span class="label">支付方式</span><span class="value">${o.payway==='wechat'?'微信支付':o.payway==='qrcode'?'个人收款码':'余额支付'}</span></div>
        <div class="price-row total"><span class="label">实付金额</span><span class="value">¥${formatMoney(o.realPay)}</span></div>
        ${o.status === 'completed' ? `
          <div class="price-row"><span class="label">平台抽成（${o.commissionRate||0}%）</span><span class="value" style="color:var(--text-2)">¥${formatMoney(o.platformCommission||0)}</span></div>
          <div class="price-row"><span class="label">护航师收入</span><span class="value" style="color:var(--success)">¥${formatMoney(o.boosterIncome||0)}</span></div>

      </div>
      
      ${o.status === 'completed' && !o.reviewed && DB.currentIdentity !== 'booster' ? `

          <h4>评价订单</h4>
          <div style="margin-bottom:10px">

            <span id="reviewStars" style="color:var(--gold);font-size:20px;letter-spacing:4px;cursor:pointer">
              <span onclick="setReviewRating(1)">★</span><span onclick="setReviewRating(2)">★</span><span onclick="setReviewRating(3)">★</span><span onclick="setReviewRating(4)">★</span><span onclick="setReviewRating(5)">★</span>

let reviewRating = 5;
function setReviewRating(r) {
  reviewRating = r;
  const stars = document.querySelectorAll('#reviewStars span');
  stars.forEach((s,i) => { s.style.opacity = i < r ? '1' : '0.3'; });
  const rt = document.getElementById('ratingText');
  if (rt) rt.textContent = r + '分';
}

function submitReview(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  const content = document.getElementById('reviewContent')?.value || '用户未填写评价';
  DB.reviews.push({
    id: genId('r'),
    boosterId: o.boosterId,
    userId: DB.currentUser.id,
    userName: DB.currentUser.nickname,
    rating: reviewRating,
    content: content,
    time: new Date().toISOString().split('T')[0]
  });
  o.reviewed = true;
  saveData();
  toast('评价成功');
  render();
}

function cancelOrder(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  if (confirm('确定要取消订单吗？')) {
    o.status = 'cancelled';
    o.cancelTime = Date.now();
    // 退款到余额
    DB.currentUser.balance += o.realPay;
    DB.flowRecords.push({
      id: genId('F'), type:'refund', amount: o.realPay,
      desc: `订单取消退款 ${o.id}`, time: Date.now()
    });
    saveData();
    toast('订单已取消，退款已退回余额');
    render();
  }
}

function confirmComplete(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  if (confirm('确认订单已完成？')) {
    o.status = 'completed';
    o.completeTime = Date.now();
    // 计算抽成并记录护航师收入
    const calc = calcCommission(o.realPay, o.boosterId);
    o.platformCommission = calc.platform;
    o.boosterIncome = calc.booster;
    o.commissionRate = calc.rate;
    DB.incomeRecords.push({
      id: genId('I'),
      boosterId: o.boosterId,
      orderId: o.id,
      amount: calc.booster,
      platformIncome: calc.platform,
      rate: calc.rate,
      time: Date.now()
    });
    saveData();
    toast('订单已完成');
    render();
    forceSyncOrder(o);
  }
}

function applyRefund(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  if (confirm('确定要申请退款吗？管理员审核后处理')) {
    o.status = 'refunding';
    o.refundApplyTime = Date.now();
    saveData();
    toast('退款申请已提交');
    render();
  }
}

// ========== 订单专属聊天（用户 ↔ 打手） ==========
function openOrderChat(orderId) {
  if (!DB.orderChatMessages) DB.orderChatMessages = {};
  if (!DB.orderChatMessages[orderId]) DB.orderChatMessages[orderId] = [];
  STATE.orderChatOrderId = orderId;
  // 标记所有对方发来的消息为已读
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';
  DB.orderChatMessages[orderId].forEach(m => {
    if (m.sender !== identity) m.isRead = true;
  });
  saveData(false);
  goSubPage('orderChatDetail');
}

function sendOrderChatMsg() {
  const input = document.getElementById('orderChatInput');
  const text = input?.value.trim();
  if (!text) return;
  const orderId = STATE.orderChatOrderId;
  const order = DB.orders.find(o => o.id === orderId);
  if (!order) return;
  
  // 订单已结束：双方都不能发消息
  const endedStatuses = ['completed', 'cancelled', 'refunded', 'refunding'];
  if (endedStatuses.includes(order.status)) {
    toast('订单已结束，无法发送消息');
    return;
  }
  
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';
  const msg = {
    id: genId('om'),
    orderId: orderId,
    userId: order.userId,
    boosterId: order.boosterId,
    sender: identity,
    content: text,
    isRead: false,
    createTime: Date.now()
  };
  
  if (!DB.orderChatMessages[orderId]) DB.orderChatMessages[orderId] = [];
  DB.orderChatMessages[orderId].push(msg);
  
  input.value = '';
  saveData();
  render();
  scrollOrderChatBottom();
  
  // 立即同步到 Supabase
  forceSyncOrderChat(orderId, msg);
}

async function forceSyncOrderChat(orderId, msg) {
  if (!supabaseClient || !SUPABASE_ENABLED) return false;
  try {
    const payload = {
      id: msg.id,
      order_id: orderId,
      user_id: msg.userId,
      booster_id: msg.boosterId,
      sender: msg.sender,
      content: msg.content,
      is_read: msg.isRead || false,
      created_at: new Date(msg.createTime).toISOString()
    };
    const { error } = await supabaseClient.from('order_chat_messages').upsert(payload);
    if (error) throw error;
    logSupabase('info', 'order_chat', `消息已同步: ${msg.id}`);
    return true;
  } catch (e) {
    logSupabase('error', 'order_chat', `消息同步失败: ${e.message}`);
    return false;
  }
}

async function syncOrderChatFromSupabase() {
  if (!supabaseClient || !SUPABASE_ENABLED) return null;
  try {
    const { data, error } = await supabaseClient.from('order_chat_messages').select('*');
    if (error) throw error;
    if (!DB.orderChatMessages) DB.orderChatMessages = {};
    const rows = data || [];
    rows.forEach(row => {
      const oid = row.order_id;
      if (!DB.orderChatMessages[oid]) DB.orderChatMessages[oid] = [];
      const existing = DB.orderChatMessages[oid].find(m => m.id === row.id);
      if (!existing) {
        DB.orderChatMessages[oid].push({
          id: row.id,
          orderId: row.order_id,
          userId: row.user_id,
          boosterId: row.booster_id,
          sender: row.sender,
          content: row.content,
          isRead: row.is_read,
          createTime: new Date(row.created_at).getTime()
        });
      } else {
        existing.isRead = row.is_read;
      }
    });
    Object.keys(DB.orderChatMessages).forEach(oid => {
      DB.orderChatMessages[oid].sort((a,b) => a.createTime - b.createTime);
    });
    logSupabase('info', 'order_chat', `拉取订单聊天消息: ${rows.length} 条`);
    return rows;
  } catch (e) {
    logSupabase('warn', 'order_chat', `拉取订单聊天消息失败: ${e.message}`);
    return null;
  }
}

function getUnreadOrderChatCount() {
  if (!DB.orderChatMessages) return 0;
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';
  let count = 0;
  Object.values(DB.orderChatMessages).forEach(msgs => {
    msgs.forEach(m => {
      if (m.sender !== identity && !m.isRead) count++;
    });
  });
  return count;
}

function sendChatMsg() {
  const input = document.getElementById('chatInput');
  const text = input?.value.trim();
  if (!text) return;
  
  const sessionId = STATE.chatSessionId;
  const isAdmin = DB.currentIdentity === 'admin';
  const from = isAdmin ? 'admin' : 'user';
  
  if (!DB.chatMessages[sessionId]) DB.chatMessages[sessionId] = [];
  DB.chatMessages[sessionId].push({
    id: genId('m'),
    from: from,
    content: text,
    time: Date.now()
  });
  
  // 更新会话最后消息
  const session = DB.chatSessions.find(s => s.id === sessionId);
  if (session) {
    session.lastMsg = text;
    session.lastTime = Date.now();
    // 对方未读+1
    if (isAdmin) session.unread = (session.unread || 0) + 0; // 管理员发的，用户端未读
  }
  
  input.value = '';
  saveData();
  render();
  
  // 自动回复（简易模拟）
  if (!isAdmin) {
    setTimeout(() => {
      const replies = ['好的，已收到您的消息~','客服正在核实，请稍等','请问您的订单号是多少呢？','感谢您的反馈，我们会尽快处理'];
      const reply = replies[Math.floor(Math.random()*replies.length)];
      DB.chatMessages[sessionId].push({
        id: genId('m'),
        from: 'admin',
        content: reply,
        time: Date.now()
      });
      if (session) { session.lastMsg = reply; session.lastTime = Date.now(); }
      saveData();
      if (STATE.subPage === 'chatDetail' && STATE.chatSessionId === sessionId) {
        render();
        scrollChatBottom();
      }
    }, 800);
  }
  setTimeout(scrollChatBottom, 50);
}

let _feedbackImg = '';
function onFeedbackImgChange(input) {
  const file = input.files?.[0];
  if (!file) return;
  if (file.size > 2*1024*1024) { toast('图片不能超过 2MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    _feedbackImg = e.target.result;
    document.getElementById('feedbackImgPreview').style.display = 'block';
    document.getElementById('feedbackImg').src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function submitFeedback() {
  // 从表单状态取值（防止 DOM 重渲染导致值丢失）
  const type = FEEDBACK_FORM_STATE.type || '功能异常';
  const content = (FEEDBACK_FORM_STATE.content || '').trim();
  const contact = (FEEDBACK_FORM_STATE.contact || '').trim();
  if (!content) { toast('请填写问题描述'); return; }
  
  const record = {
    id: genId('FB'),
    userId: DB.currentUser.id,
    userName: DB.currentUser.nickname,
    type, content, contact,
    screenshot: _feedbackImg,
    status: 'pending',
    createTime: Date.now()
  };
  if (!DB.feedbacks) DB.feedbacks = [];
  DB.feedbacks.push(record);
  saveData();
  
  // 同步到 Supabase
  if (supabaseClient && SUPABASE_ENABLED) {
    supabaseClient.from('feedbacks').upsert(toSnake(record)).catch(e => {
      logSupabase('warn', 'feedback', `反馈同步失败: ${e.message}`);
    });
  }
  
  _feedbackImg = '';
  // 清空表单状态
  FEEDBACK_FORM_STATE = { type: '功能异常', content: '', contact: '' };
  closeModal();
  showModal(`
    <div class="success-modal">
      <div class="success-icon">${ICONS.check}</div>
      <h3 style="font-size:18px;margin-bottom:6px">反馈已提交</h3>
      <p style="font-size:13px;color:var(--text-2)">我们会尽快处理您的反馈</p>
    </div>`, { closeOnOverlay: true });
  setTimeout(() => { closeModal(); render(); }, 1500);
}

        </div>

let _reportImg = '';
function onReportImgChange(input) {
  const file = input.files?.[0];
  if (!file) return;
  if (file.size > 2*1024*1024) { toast('图片不能超过 2MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    _reportImg = e.target.result;
    document.getElementById('reportImgPreview').style.display = 'block';
    document.getElementById('reportImg').src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function submitReport() {
  // 从表单状态取值（防止 DOM 重渲染导致值丢失）
  const boosterId = REPORT_FORM_STATE.boosterId;
  const reason = REPORT_FORM_STATE.reason || '其他';
  const content = (REPORT_FORM_STATE.content || '').trim();
  if (!boosterId) { toast('请选择被举报的打手'); return; }
  if (!content) { toast('请填写举报描述'); return; }
  
  const booster = getBooster(boosterId);
  const record = {
    id: genId('RP'),
    userId: DB.currentUser.id,
    userName: DB.currentUser.nickname,
    boosterId,
    boosterName: booster?.nickname || '',
    reason, content,
    screenshot: _reportImg,
    status: 'pending',
    createTime: Date.now()
  };
  if (!DB.reports) DB.reports = [];
  DB.reports.push(record);
  saveData();
  
  // 同步到 Supabase
  if (supabaseClient && SUPABASE_ENABLED) {
    supabaseClient.from('reports').upsert(toSnake(record)).catch(e => {
      logSupabase('warn', 'report', `举报同步失败: ${e.message}`);
    });
  }
  
  _reportImg = '';
  // 清空表单状态
  REPORT_FORM_STATE = { boosterId: '', reason: '服务态度差', content: '' };
  closeModal();
  showModal(`
    <div class="success-modal">
      <div class="success-icon">${ICONS.check}</div>
      <h3 style="font-size:18px;margin-bottom:6px">举报已提交</h3>
      <p style="font-size:13px;color:var(--text-2)">我们会尽快核实处理</p>
    </div>`, { closeOnOverlay: true });
  setTimeout(() => { closeModal(); render(); }, 1500);
}

async function saveUserProfile() {
  // 从表单状态取值（防止 DOM 重渲染导致值丢失）
  const nickname = (USER_PROFILE_EDIT_STATE.nickname || '').trim();
  if (!nickname) { toast('昵称不能为空'); return; }
  if (nickname.length < 2 || nickname.length > 20) { toast('昵称2-20位字符'); return; }
  
  // 昵称查重（排除自己）
  if (nickname !== DB.currentUser.nickname) {
    if (DB.users && DB.users.length > 0) {
      const dup = DB.users.find(u => u.nickname === nickname && u.id !== DB.currentUser.id);
      if (dup) { toast('昵称已被注册'); return; }
    }
    if (supabaseClient && SUPABASE_ENABLED) {
      try {
        const { data } = await supabaseClient
          .from('users')
          .select('id')
          .eq('nickname', nickname)
          .neq('id', DB.currentUser.id)
          .limit(1);
        if (data && data.length > 0) { toast('昵称已被注册'); return; }
      } catch (e) {
        console.warn('[Auth] 昵称查重失败:', e.message);
      }
    }
  }
  
  DB.currentUser.nickname = nickname;
  // 如果头像是字母头像，则随着昵称首字母更新；图片头像保持不变
  if (!DB.currentUser.avatar || !DB.currentUser.avatar.startsWith('data:')) {
    DB.currentUser.avatar = nickname.charAt(0);
  }
  
  // 同步 DB.users 中对应的记录
  if (DB.users) {
    const rec = DB.users.find(u => u.id === DB.currentUser.id);
    if (rec) {
      rec.nickname = nickname;
      rec.avatar = DB.currentUser.avatar;
    }
  }
  
  syncAuthFromDB();
  saveData();
  toast('保存成功');
  
  // 同步到 Supabase
  if (supabaseClient && SUPABASE_ENABLED) {
    try {
      const { error } = await supabaseClient
        .from('users')
        .update({
          nickname: nickname,
          avatar: DB.currentUser.avatar
        })
        .eq('id', DB.currentUser.id);
      if (error) console.warn('[Auth] 用户资料同步失败:', error.message);
    } catch (e) {
      console.warn('[Auth] 用户资料同步异常:', e.message);
    }
  }
  
  goBack();
}

// 用户头像：从相册选择图片上传（base64）
function uploadUserAvatar(input) {
  const file = input.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('图片不能超过 2MB');
    return;
  }
  if (!file.type.startsWith('image/')) {
    toast('请选择图片文件');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    DB.currentUser.avatar = e.target.result;
    // 同步 DB.users
    if (DB.users) {
      const rec = DB.users.find(u => u.id === DB.currentUser.id);
      if (rec) rec.avatar = e.target.result;
    }
    saveData();
    render();
    toast('头像已更换');
    // 异步同步到 Supabase
    if (supabaseClient && SUPABASE_ENABLED) {
      supabaseClient.from('users').update({ avatar: e.target.result }).eq('id', DB.currentUser.id)
        .catch(err => logSupabase('warn', 'user', `头像同步失败: ${err.message}`));
    }
  };
  reader.readAsDataURL(file);
}

function switchIdentity(identity) {
  // 切换到打手端时，先做权限校验
  if (identity === 'booster') {
    const result = checkBoosterAccess();
    if (!result.ok) {
      // 弹出对应提示
      showBoosterAccessModal(result);
      return;
    }
    // 有权限：设置当前打手身份
    DB.currentBooster = result.booster;
  }
  DB.currentIdentity = identity;
  STATE.page = 'home';
  STATE.subPage = null;
  closeModal();
  render();
  toast(`已切换到${identity==='user'?'用户端':identity==='booster'?'打手端':'管理员端'}`);
}

/**
 * 检查当前用户是否有进入打手端的权限
 * @returns {{ok: boolean, reason: string, booster: object|null, apply: object|null}}
 */
function checkBoosterAccess() {
  if (!DB.currentUser) {
    return { ok: false, reason: 'not_login', booster: null, apply: null };
  }
  // 先查是否已有通过审核的打手身份（直接关联 user_id）
  const booster = getCurrentUserBooster();
  if (booster) {
    return { ok: true, reason: 'approved', booster, apply: null };
  }
  // 查最新的入驻申请
  const apply = getCurrentUserBoosterApply();
  if (!apply) {
    return { ok: false, reason: 'not_applied', booster: null, apply: null };
  }
  if (apply.status === 'pending') {
    return { ok: false, reason: 'pending', booster: null, apply };
  }
  if (apply.status === 'rejected') {
    return { ok: false, reason: 'rejected', booster: null, apply };
  }
  return { ok: false, reason: 'unknown', booster: null, apply };
}

// 打手端访问受限弹窗
function showBoosterAccessModal(result) {
  closeModal();
  let title = '';
  let content = '';
  let confirmText = '';
  let confirmAction = '';

  switch (result.reason) {
    case 'not_applied':
      title = '还不是打手';
      content = '您还不是打手，是否申请成为打手？';
      confirmText = '去申请';
      confirmAction = 'goApplyBooster()';
      break;
    case 'pending':
      title = '审核中';
      content = '您的打手申请正在审核中，请耐心等待（1-3个工作日）。';
      confirmText = '我知道了';
      confirmAction = 'closeModal()';
      break;
    case 'rejected':
      title = '申请未通过';
      content = '您的打手申请未通过审核，是否重新申请？<br><br>' +
        `<span style="color:var(--text-2);font-size:12px">拒绝原因：${result.apply?.remark || '未填写'}</span>`;
      confirmText = '重新申请';
      confirmAction = 'goApplyBooster()';
      break;
    default:
      title = '提示';
      content = '暂时无法进入打手端';
      confirmText = '确定';
      confirmAction = 'closeModal()';
  }

  showModal(`
    <div>
      <div class="modal-header">
        <h4>${title}</h4>
        <span class="modal-close" onclick="closeModal()">${ICONS.close}</span>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-2);line-height:1.6">${content}</p>

async function verifyAdmin() {
  const input = document.getElementById('adminPwdInput')?.value;
  if (!input) return toast('请输入密码');
  
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = '验证中...'; }
  
  try {
    const ok = await verifyAdminLogin('admin', input);
    if (ok) {
      DB.currentIdentity = 'admin';
      STATE.adminNav = 'dashboard';
      // 同步登录态为管理员角色
      AUTH_STATE.isLoggedIn = true;
      AUTH_STATE.role = 'admin';
      AUTH_STATE.nickname = '管理员';
      AUTH_STATE.userId = 'admin';
      saveAuthState();
      closeModal();
      render();
    } else {
      toast('密码错误');
      if (btn) { btn.disabled = false; btn.textContent = '确认'; }
    }
  } catch (e) {
    toast('验证失败：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '确认'; }
  }
}

function renderGrabHall() {
  // 抢单权限校验：只有已通过审核的护航师才能抢单
  const currentBooster = getCurrentUserBooster();
  if (!currentBooster) {
    return `
      <div class="page active">
        <div style="text-align:center;padding:60px 24px">
          <div style="font-size:48px;margin-bottom:16px">🔒</div>
          <h3 style="font-size:18px;margin-bottom:10px">您还不是护航师</h3>
          <p style="font-size:13px;color:var(--text-3);margin-bottom:24px">请先申请成为护航师，审核通过后即可进入抢单大厅</p>
          <button class="btn btn-primary" onclick="goApplyBooster()">立即申请入驻</button>
        </div>
      </div>`;
  }
  // 待接单订单（所有用户发布的待接单）
  // 抢单模式：所有待接单都显示，但指定了打手的订单只有该打手能抢
  const orders = DB.orders.filter(o => o.status === 'pending');
  const gameFilters = [{id:'all',name:'全部游戏'}, ...DB.games.map(g=>({id:g.id,name:g.name}))];
  let filtered = orders;
  if (STATE.filterGame !== 'all') {
    filtered = orders.filter(o => o.gameId === STATE.filterGame);
  }
  const myRate = getBoosterCommission(currentBooster);
  
  return `
    <div class="page active">
      <div class="filter-bar">
        ${gameFilters.map(g=>`<span class="filter-pill ${STATE.filterGame===g.id?'active':''}" onclick="STATE.filterGame='${g.id}';render()">${g.name}</span>`).join('')}
      </div>
      <div style="padding:8px 16px 0;font-size:12px;color:var(--text-3)">当前抽成比例：${myRate}%（${getLevelInfo(currentBooster.level).name}护航师）</div>
      <div style="padding-top:4px">
        ${filtered.length === 0 ? '<div class="empty"><p>暂无可抢订单</p></div>' : filtered.map(o => {
          const calc = calculateIncome(o.realPay, myRate);
          // 判断是否指定了打手：检查 requirement 中的「指定打手:xxx」或「指定护航师:xxx」格式
          const specifiedMatch = (o.requirement || '').match(/指定(?:打手|护航师)[：:\s]*([^\s，,。]+)/);
          const isSpecified = !!specifiedMatch;
          const specifiedName = specifiedMatch ? specifiedMatch[1] : '';
          const canGrab = !isSpecified || (currentBooster && currentBooster.nickname === specifiedName);
          return `
          <div class="order-card">
            <div class="order-header">
              <span class="order-game">${o.gameName} · ${o.productName}</span>
              <span class="order-status pending">${isSpecified?'已指定':'待接单'}</span>
            </div>
            <div class="order-body">
              <div style="flex:1">
                <div style="font-size:13px;font-weight:500">${o.quantity} ${o.unit}</div>
                <div style="font-size:12px;color:var(--text-3);margin-top:4px">区服：${o.server||'-'} · 发布于 ${formatTimeShort(o.createTime)}</div>
                ${o.requirement ? `<div style="font-size:12px;color:var(--text-2);margin-top:4px">要求：${o.requirement}</div>` : ''}
                ${isSpecified ? `<div style="font-size:11px;color:var(--gold);margin-top:4px">指定打手：${specifiedName}${canGrab?'（您）':''}</div>` : ''}
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border-2)">
              <div>
                <div style="font-size:11px;color:var(--text-3);margin-bottom:2px">你可挣</div>
                <div style="font-size:20px;font-weight:800;color:var(--gold);line-height:1">¥${formatMoney(calc.boosterIncome)}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:11px;color:var(--text-3)">订单总价 ¥${formatMoney(o.realPay)}</div>
                <div style="font-size:11px;color:var(--text-3);margin-top:2px">平台抽成 ¥${formatMoney(calc.platformCommission)} (${myRate}%)</div>
                <button class="btn ${canGrab?'btn-primary':'btn-gray'} btn-sm" style="margin-top:6px" ${canGrab?`onclick="grabOrder('${o.id}')"`:'disabled'}>${canGrab?'一键抢单':'已指定'}</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function grabOrder(orderId) {
  // 非护航师不能抢单
  const booster = getCurrentUserBooster();
  if (!booster) {
    toast('您还不是护航师，请先申请入驻');
    return;
  }
  const o = DB.orders.find(x => x.id === orderId);
  if (!o || o.status !== 'pending') return;
  
  // 抢单模式：检查是否指定了打手，只有指定的打手能抢
  const specifiedMatch = (o.requirement || '').match(/指定(?:打手|护航师)[：:\s]*([^\s，,。]+)/);
  if (specifiedMatch && specifiedMatch[1] !== booster.nickname) {
    toast('该订单已指定打手，您无法抢单');
    return;
  }
  
  o.boosterId = booster.id;
  o.boosterName = booster.nickname;
  o.status = 'ongoing';
  o.takeTime = Date.now();
  DB.currentBooster = booster;
  saveData();
  toast('抢单成功！');
  render();
  // 立即同步到 Supabase
  forceSyncOrder(o);
}

// --- Booster Orders ---
function renderBoosterOrders() {
  const tabs = [
    { k:'ongoing', n:'待开始' },
    { k:'in_progress', n:'服务中' },
    { k:'toConfirm', n:'待确认' },
    { k:'completed', n:'已完成' },
    { k:'cancelled', n:'已取消' }
  ];
  
  const myBooster = getCurrentUserBooster();
  const boosterId = myBooster?.id;
  if (!boosterId) {
    return renderBoosterNotAuthorized();
  }
  let orders = DB.orders.filter(o => o.boosterId === boosterId);
  if (STATE.boosterTab) {
    orders = orders.filter(o => o.status === STATE.boosterTab);
  } else {
    STATE.boosterTab = 'ongoing';
    orders = orders.filter(o => o.status === 'ongoing');
  }
  orders.sort((a,b) => b.createTime - a.createTime);
  
  // 计算未读消息数
  const getUnread = (orderId) => {
    const msgs = DB.orderChatMessages?.[orderId] || [];
    return msgs.filter(m => m.sender !== 'booster' && !m.isRead).length;
  };
  
  return `
    <div class="page active">
      <div class="inner-tabs">
        ${tabs.map(t => `<div class="inner-tab ${STATE.boosterTab===t.k?'active':''}" onclick="STATE.boosterTab='${t.k}';render()">${t.n}</div>`).join('')}
      </div>
      ${orders.length === 0 ? '<div class="empty"><p>暂无订单</p></div>' : orders.map(o => {
        const unread = getUnread(o.id);
        return `
        <div class="order-card" onclick="goSubPage('orderDetail',{selectedOrderId:'${o.id}'})">
          <div class="order-header">
            <span class="order-game">${o.gameName} · ${o.productName}</span>
            <span class="order-status ${getStatusClass(o.status)}">${getStatusText(o.status)}${unread>0?'<span class="unread-dot" style="margin-left:4px"></span>':''}</span>
          </div>
          <div class="order-body">
            <div class="avatar sm">${o.userName?.substr(0,1)||'用'}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${o.userName}</div>
              <div style="font-size:12px;color:var(--text-3);margin-top:3px">${o.quantity}${o.unit} · ${formatTimeShort(o.createTime)}</div>
            </div>
            <div style="text-align:right">
              <div class="price" style="font-size:15px;color:var(--gold)">¥${formatMoney(o.status==='completed'?(o.boosterIncome||0):calculateIncome(o.realPay,getCommissionRate(boosterId)).boosterIncome)}</div>
              <div style="font-size:10px;color:var(--text-3);margin-top:2px">你可挣</div>
            </div>
          </div>
          <div class="order-footer">
            <div style="flex:1;font-size:11px;color:var(--text-3)">订单总价 ¥${formatMoney(o.realPay)} · 抽成 ${o.commissionRate||getCommissionRate(boosterId)}%</div>
            ${o.status === 'ongoing' ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();startService('${o.id}')">开始服务</button>` : ''}
            ${o.status === 'in_progress' ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();uploadProof('${o.id}')">完成服务</button>` : ''}
            ${(o.status === 'in_progress' || o.status === 'toConfirm') ? `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openOrderChat('${o.id}')">${unread>0?'消息('+unread+')':'联系用户'}</button>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function startService(orderId) {

/**
 * 统一计算打手的提现余额状态
 * 可提现 = 总收入 - 已通过提现 - 待审核提现（冻结中）
 * @param {string} boosterId 护航师ID
 * @returns {{totalIncome:number, withdrawn:number, pending:number, withdrawable:number}}
 */
function getBoosterWithdrawStats(boosterId) {
  const totalIncome = (DB.incomeRecords || []).filter(r => r.boosterId === boosterId).reduce((s,r)=>s+r.amount,0);
  const allW = DB.withdrawals || [];
  // 已通过提现总额
  const withdrawn = allW.filter(w => w.boosterId === boosterId && w.status === 'approved').reduce((s,w)=>s+w.amount,0);
  // 待审核（冻结中）提现总额
  const pending = allW.filter(w => w.boosterId === boosterId && w.status === 'pending').reduce((s,w)=>s+w.amount,0);
  // 可提现 = 总收入 - 已提现 - 待审核冻结
  const withdrawable = totalIncome - withdrawn - pending;
  return {
    totalIncome: Number(totalIncome.toFixed(2)),
    withdrawn: Number(withdrawn.toFixed(2)),
    pending: Number(pending.toFixed(2)),
    withdrawable: Number(withdrawable.toFixed(2))
  };
}

/**
 * 提交提现申请：写入 withdrawals 表 + 发系统消息 + 同步 Supabase
 */
function doSubmitWithdraw(boosterId) {
  const booster = getBooster(boosterId);
  if (!booster) { toast('护航师不存在'); return; }
  
  // 从表单状态取值（防止 DOM 重渲染导致值丢失）
  const amount = parseFloat(WITHDRAW_FORM_STATE.amount);
  const type = WITHDRAW_FORM_STATE.type || 'alipay';
  const account = (WITHDRAW_FORM_STATE.account || '').trim();
  const remark = (WITHDRAW_FORM_STATE.remark || '').trim();
  
  if (isNaN(amount) || amount <= 0) { toast('请输入正确的提现金额'); return; }
  if (!account) { toast('请输入收款账号'); return; }
  
  // 二次校验可提现余额（使用统一计算函数，已扣减待审核冻结金额）
  const stats = getBoosterWithdrawStats(boosterId);
  if (amount > stats.withdrawable) {
    toast('提现金额不能超过可提现金额');
    return;
  }
  
  // 手续费：1%，最低1元（可根据业务调整）
  const fee = Math.max(1, Number((amount * 0.01).toFixed(2)));
  const realPay = Number((amount - fee).toFixed(2));
  
  const record = {
    id: genId('wd'),
    boosterId: boosterId,
    boosterName: booster.nickname,
    amount: amount,
    fee: fee,
    realPay: realPay,
    withdrawType: type,         // alipay / wechat / bank
    account: account,
    status: 'pending',          // pending / approved / rejected
    applyTime: Date.now(),
    verifyTime: null,
    remark: remark,
    rejectReason: ''
  };
  
  if (!DB.withdrawals) DB.withdrawals = [];
  DB.withdrawals.push(record);
  
  // 发系统消息给打手
  addMessageToUser(
    booster.userId,
    '系统',
    `您的提现申请（¥${formatMoney(amount)}）已提交，等待管理员审核。`
  );
  
  saveData();
  closeModal();
  toast('提现申请已提交，等待审核');
  render();
}

// 提交打手入驻申请
function submitBoosterApply() {
  const s = APPLY_FORM_STATE;
  if (!s.nickname.trim()) return toast('请输入打手昵称');
  if (s.nickname.trim().length < 2) return toast('昵称至少2个字符');
  if (s.gameIds.length === 0) return toast('请至少选择一个擅长游戏');
  if (!s.rankText.trim()) return toast('请输入游戏段位/等级');
  if (!s.contactValue.trim()) return toast('请输入联系方式');

  const record = {
    id: genId('BA'),
    userId: DB.currentUser.id,
    userName: DB.currentUser.nickname,
    type: 'booster_apply',
    nickname: s.nickname.trim(),
    gameIds: [...s.gameIds],
    rankText: s.rankText.trim(),
    contactType: s.contactType,
    contactValue: s.contactValue.trim(),
    intro: s.intro.trim(),
    proofImages: s.proofText.trim() ? [s.proofText.trim()] : [],
    // 兼容旧字段
    gameId: s.gameIds[0] || '',
    gameAccount: '',
    currentRank: s.rankText.trim(),
    targetRank: '',
    contact: s.contactValue.trim(),
    status: 'pending',
    remark: '',
    submitTime: Date.now(),
    verifyTime: null
  };

  DB.assessments.push(record);
  saveData();
  toast('申请已提交，等待审核');
  
  // 立即同步到云端，失败则进入离线队列自动重试
  forceSyncAssessment(record);
  
  // 返回上一页（我的页面），显示审核中状态
  STATE.subPage = null;
  render();
}

function drawIncomeChart() {
  const canvas = document.getElementById('incomeChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;
  
  // Mock data for 7 days
  const data = [1200, 1800, 1500, 2200, 2800, 2400, 3100];
  const labels = ['周一','周二','周三','周四','周五','周六','周日'];
  const maxVal = Math.max(...data) * 1.2;
  const barW = (w - 60) / data.length * 0.5;
  const gap = (w - 60) / data.length;
  
  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = 20 + (h - 40) * i / 4;
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(w - 10, y);
    ctx.stroke();
  }
  
  // Bars
  data.forEach((v, i) => {
    const x = 50 + i * gap + (gap - barW) / 2;
    const barH = (h - 40) * v / maxVal;
    const y = h - 20 - barH;
    
    const grad = ctx.createLinearGradient(0, y, 0, h - 20);
    grad.addColorStop(0, '#d4af37');
    grad.addColorStop(1, 'rgba(212,175,55,0.2)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, 4);
    ctx.fill();
    
    // Label
    ctx.fillStyle = 'rgba(160,160,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x + barW/2, h - 4);
  });
}

function confirmQrPayment(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'pending'; // 确认到账，进入抢单大厅
  o.payStatus = 'paid';
  o.payTime = Date.now();
  // 补全支付记录
  const pay = DB.paymentRecords.find(p => p.orderId === orderId);
  if (pay) { pay.status = 'success'; pay.payTime = Date.now(); }
  // 交易流水
  DB.flowRecords.push({
    id: genId('F'),
    userId: o.userId,
    type: 'consume',
    amount: o.realPay,
    balanceChange: -o.realPay,
    orderId: o.id,
    description: `订单支付（人工确认） ${o.productName}`,
    createTime: Date.now()
  });
  // 给用户发系统消息
  addMessageToUser(o.userId, '系统', `您的订单 ${o.id} 已确认到账，正在为您匹配护航师`);
  saveData();
  toast('已确认收款，订单进入抢单大厅');
  render();
  // 立即同步到云端
  forceSyncOrder(o);
}

function rejectQrPayment(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'cancelled';
  o.payStatus = 'unpaid';
  o.cancelTime = Date.now();
  const pay = DB.paymentRecords.find(p => p.orderId === orderId);
  if (pay) { pay.status = 'failed'; }
  // 给用户发系统消息
  addMessageToUser(o.userId, '系统', `您的订单 ${o.id} 因未收到付款已被取消，如有疑问请联系客服`);
  saveData();
  toast('已取消订单');
  render();
  forceSyncOrder(o);
}

function approveRefund(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'refunded';
  o.refundTime = Date.now();

}

function rejectRefund(orderId) {

  if (!o) return;
  o.status = 'ongoing';

// 执行余额调整
function doBalanceAdjust(boosterId) {
  const b = getBooster(boosterId);
  if (!b) { toast('护航师不存在'); return; }
  
  const type = document.getElementById('adjustType').value;
  const amount = parseFloat(document.getElementById('adjustAmount').value);
  const reason = document.getElementById('adjustReason').value.trim();
  
  if (isNaN(amount) || amount <= 0) { toast('请输入正确的调整金额'); return; }
  
  // 计算当前余额（总收入 - 已提现）
  const totalIncome = DB.incomeRecords.filter(r => r.boosterId === boosterId).reduce((s,r)=>s+r.amount,0);
  const totalWithdrawn = (DB.withdrawals || []).filter(w => w.boosterId === boosterId && w.status === 'approved').reduce((s,w)=>s+w.amount,0);
  const currentBalance = totalIncome - totalWithdrawn;
  
  let changeAmount = 0;   // 正数=增加  负数=减少
  let newBalance = 0;
  let desc = '';
  
  if (type === 'increase') {
    changeAmount = amount;
    newBalance = currentBalance + amount;
    desc = `管理员增加余额 ¥${formatMoney(amount)}${reason ? '（' + reason + '）' : ''}`;
  } else if (type === 'decrease') {
    if (amount > currentBalance) { toast('减少金额不能超过当前余额'); return; }
    changeAmount = -amount;
    newBalance = currentBalance - amount;
    desc = `管理员扣减余额 ¥${formatMoney(amount)}${reason ? '（' + reason + '）' : ''}`;
  } else { // set
    changeAmount = amount - currentBalance;
    newBalance = amount;
    desc = `管理员设置余额为 ¥${formatMoney(amount)}${reason ? '（' + reason + '）' : ''}`;
  }
  
  // 通过 incomeRecords 记录调整（正数=增加收入，负数=扣减收入）
  DB.incomeRecords.push({
    id: genId('A'),
    boosterId: boosterId,
    orderId: '',
    amount: changeAmount,
    platformIncome: 0,
    rate: 0,
    time: Date.now(),
    source: 'admin_adjust',
    reason: reason,
    operator: 'admin',
    desc: desc
  });
  
  saveData();
  closeModal();
  toast(`调整成功，当前余额：¥${formatMoney(newBalance)}`);
  render();
}

function onBoosterLevelChange() {
  const level = document.getElementById('boosterLevelSelect').value;
  const customInput = document.getElementById('boosterCustomCommission');

  if (!customInput.value) {
    customInput.placeholder = DB.settings.commissionRates[level];
    hint.textContent = '当前使用等级默认抽成比例';
  } else {
    hint.textContent = '当前使用自定义抽成比例';
  }
}

function onCustomCommissionChange() {
  const customInput = document.getElementById('boosterCustomCommission');
  const hint = document.getElementById('commissionHint');
  if (customInput.value === '') {
    const level = document.getElementById('boosterLevelSelect').value;
    customInput.placeholder = DB.settings.commissionRates[level];
    hint.textContent = '当前使用等级默认抽成比例';
  } else {
    let v = parseInt(customInput.value) || 0;
    v = Math.min(100, Math.max(0, v));
    hint.textContent = `当前使用自定义抽成比例：${v}%`;
  }
}

function saveBoosterLevel(id) {
  const b = getBooster(id);
  const level = document.getElementById('boosterLevelSelect').value;
  const customVal = document.getElementById('boosterCustomCommission').value.trim();
  if (b) {
    b.level = level;
    if (customVal === '') {
      delete b.customCommission;
    } else {
      b.customCommission = Math.min(100, Math.max(0, parseInt(customVal) || 0));
    }
    saveData();
    closeModal();
    toast('设置已保存');
    render();
  }
}

function editProduct(id) {
  const p = getProduct(id);
  if (p) showProductForm(p);
}

function saveProduct(id) {
  const name = document.getElementById('pf_name').value.trim();
  if (!name) return toast('请输入商品名称');
  const data = {
    name,
    gameId: document.getElementById('pf_game').value,
    boosterId: document.getElementById('pf_booster').value,
    type: document.getElementById('pf_type').value,
    price: parseFloat(document.getElementById('pf_price').value) || 0,
    unit: document.getElementById('pf_unit').value,
    desc: document.getElementById('pf_desc').value,
    sort: parseInt(document.getElementById('pf_sort').value) || 1,
    status: parseInt(document.getElementById('pf_status').value)
  };
  
  if (id) {
    const p = getProduct(id);
    if (p) Object.assign(p, data);
  } else {
    DB.products.push({ id: genId('p'), ...data });
  }
  saveData();
  closeModal();
  toast('保存成功');
  render();
}

function toggleProduct(id) {
  const p = getProduct(id);
  if (p) { p.status = p.status ? 0 : 1; saveData(); toast(p.status?'已上架':'已下架'); render(); }
}

function deleteProduct(id) {
  if (!confirm('确定删除该商品？')) return;
  const idx = DB.products.findIndex(p => p.id === id);
  if (idx > -1) {
    DB.products.splice(idx, 1);
    // 登记到删除队列，同步到 Supabase 时真正删除
    enqueueDeletion('products', id);
    saveData();
    toast('已删除');
    render();
  }
}

/**
 * 将商品一键添加到首页热门订单
 * - 如果已关联则直接跳转编辑
 * - 否则生成新的热门订单卡片并提示成功
 */
function addProductToFeatured(productId) {
  const p = getProduct(productId);
  if (!p) return;
  if (!DB.featuredOrders) DB.featuredOrders = [];
  // 检查是否已在热门订单中
  const exist = DB.featuredOrders.find(f => f.productId === productId);
  if (exist) {
    toast('该商品已在热门订单中');
    // 切到营销管理-热门订单 tab 方便查看
    marketingTab = 'featured';
    render();
    return;
  }
  const maxSort = DB.featuredOrders.reduce((m,x) => Math.max(m, x.sortOrder||0), 0);
  const newF = {
    id: genId('f'),
    image: '',
    title: p.name,
    description: p.desc || '',
    price: p.price,
    unit: p.unit || '单',
    productId: p.id,
    sortOrder: maxSort + 1,
    status: 'active'
  };
  DB.featuredOrders.push(newF);
  saveData();
  toast('已添加到首页热门订单');
  marketingTab = 'featured';
  render();
}

/**
 * 从云端刷新考核申请列表（只刷新 assessments 表）
 * - 采用合并策略，不覆盖本地新增的申请
 * - 管理后台考核管理页「刷新」按钮调用
 */
async function refreshAssessmentsFromCloud() {
  if (!supabaseClient || !SUPABASE_ENABLED) {
    toast('云端未连接，无法刷新');
    return;
  }
  toast('正在刷新...');
  try {
    const { data, error } = await withTimeout(
      supabaseClient.from('assessments').select('*'),
      15000
    );
    if (error) throw error;
    
    const remoteData = toCamel(data || []);
    const stats = { added: 0, updated: 0, unchanged: 0, localOnly: 0 };
    DB.assessments = mergeAssessments(DB.assessments || [], remoteData, stats);
    
    setTableSyncStatus('assessments', 'success', '', DB.assessments.length);
    saveData();
    render();
    toast(`刷新成功：新增 ${stats.added} 条，更新 ${stats.updated} 条，保留本地 ${stats.localOnly} 条`);
  } catch (e) {
    setTableSyncStatus('assessments', 'failed', e.message || '拉取失败', 0);
    addSyncLog('error', 'assessments', 'pull', '手动刷新失败：' + (e.message || e));
    toast('刷新失败：' + (e.message || '未知错误'));
  }
}

// 审核通过打手入驻申请：创建 booster 记录 + 发系统消息
function approveBoosterApply(id) {
  if (!confirm('确定通过该打手入驻申请？通过后将自动创建打手账号并通知用户。')) return;
  const a = DB.assessments.find(x => x.id === id);
  if (!a) return;

  a.status = 'approved';
  a.remark = '审核通过';
  a.verifyTime = Date.now();

  // 创建打手记录（关联用户 id）
  const firstGameId = (a.gameIds && a.gameIds[0]) || a.gameId || DB.games[0]?.id || '';
  const newBooster = {
    id: genId('b'),
    userId: a.userId,              // 关键：关联用户
    nickname: a.nickname || a.userName || '新打手',
    avatar: (a.nickname || a.userName || '打').charAt(0),
    realName: '',
    idCard: '',
    gameId: firstGameId,
    gameIds: a.gameIds || [firstGameId],
    rank: a.rankText || a.currentRank || '',
    level: 'junior',
    customCommission: null,
    rating: 5.0,
    orders: 0,
    totalIncome: 0,
    price: 0,
    tags: ['新入驻'],
    description: a.intro || '',
    online: true,
    status: 'approved',
    applyTime: a.submitTime,
    verifyTime: Date.now()
  };
  DB.boosters.push(newBooster);

  // 发送系统消息给用户
  addMessageToUser(
    a.userId,
    '系统',
    '恭喜！您的打手申请已通过审核，现在可以进入打手端接单了～'
  );

  saveData();
  toast('已通过审核，打手账号已创建');
  // 立即同步审核结果到云端，确保用户端和其他管理端实时看到
  forceSyncAssessment(a);
  // 同步新创建的打手账号
  if (newBooster && supabaseClient && SUPABASE_ENABLED) {
    supabaseClient.from('boosters').upsert(toSnake(newBooster)).catch(e => {
      logSupabase('warn', 'boosters', `新打手账号同步失败: ${e.message}`);
      addToOfflineQueue('boosters', toSnake(newBooster));
    });
  }
  render();
}

// 拒绝打手入驻申请
function rejectBoosterApply(id) {
  const reason = prompt('请填写拒绝原因：', '');

  const a = DB.assessments.find(x => x.id === id);
  if (!a) return;

  a.status = 'rejected';
  a.remark = reason || '申请未通过';
  a.verifyTime = Date.now();

  // 发送系统消息给用户
  addMessageToUser(
    a.userId,
    '系统',
    `您的打手申请未通过审核，原因：${a.remark}。您可以修改资料后重新申请。`
  );

  saveData();
  toast('已拒绝');
  // 立即同步审核结果到云端
  forceSyncAssessment(a);
  render();
}

function selectAdminChat(sessionId) {
  STATE.chatSessionId = sessionId;
  const s = DB.chatSessions.find(x => x.id === sessionId);
  if (s) s.unread = 0;
  saveData();
  render();
  setTimeout(scrollChatBottom, 50);
}

function fillQuickReply(text) {
  const input = document.getElementById('chatInput');
  if (input) { input.value = text; input.focus(); }
}

function sendAdminChat() {
  const input = document.getElementById('chatInput');
  const text = input?.value.trim();
  if (!text) return;
  const sessionId = STATE.chatSessionId;
  if (!DB.chatMessages[sessionId]) DB.chatMessages[sessionId] = [];
  DB.chatMessages[sessionId].push({
    id: genId('m'), from: 'admin', content: text, time: Date.now()
  });
  const session = DB.chatSessions.find(s => s.id === sessionId);
  if (session) {
    session.lastMsg = text;
    session.lastTime = Date.now();
    session.unread = (session.unread || 0) + 1;
  }
  input.value = '';
  saveData();
  render();
  setTimeout(scrollChatBottom, 50);
}

/**
 * 审核通过提现申请
 * - 更新状态为 approved
 * - 记录审核时间
 * - 给打手发系统消息
 */
function approveWithdraw(id) {
  if (!confirm('确定通过该提现申请？通过后待审核金额将转入已提现金额，可提现余额不变。')) return;
  const w = (DB.withdrawals || []).find(x => x.id === id);
  if (!w) return;
  w.status = 'approved';
  w.verifyTime = Date.now();
  
  // 给打手发系统消息
  const booster = getBooster(w.boosterId);
  if (booster && booster.userId) {
    addMessageToUser(
      booster.userId,
      '系统',
      `您的提现申请（¥${formatMoney(w.amount)}）已通过审核，实际到账 ¥${formatMoney(w.realPay||w.amount)}，请注意查收。`
    );
  }
  
  saveData();
  toast('已通过提现申请');
  render();
}

/**
 * 拒绝提现申请
 * - 更新状态为 rejected
 * - 记录拒绝原因 + 审核时间
 * - 金额退回打手可提现余额（实际上是从提现队列释放，不需要改收入记录）
 * - 给打手发系统消息
 */
function rejectWithdraw(id) {
  const reason = prompt('请填写拒绝原因：', '');
  if (reason === null || reason.trim() === '') { toast('请填写拒绝原因'); return; }
  const w = (DB.withdrawals || []).find(x => x.id === id);
  if (!w) return;
  w.status = 'rejected';
  w.verifyTime = Date.now();
  w.rejectReason = reason.trim();
  
  // 给打手发系统消息
  const booster = getBooster(w.boosterId);
  if (booster && booster.userId) {
    addMessageToUser(
      booster.userId,
      '系统',
      `您的提现申请（¥${formatMoney(w.amount)}）被拒绝，原因：${reason.trim()}，金额已退回可提现余额。`
    );
  }
  
  saveData();
  toast('已拒绝提现申请');
  render();
}

// 保存热门订单卡片
function saveFeatured(id) {
  const title = document.getElementById('featuredTitle').value.trim();
  const description = document.getElementById('featuredDesc').value.trim();
  const price = parseFloat(document.getElementById('featuredPrice').value) || 0;
  const unit = document.getElementById('featuredUnit').value.trim() || '小时';
  const productId = document.getElementById('featuredProductId').value;
  const sortOrder = parseInt(document.getElementById('featuredSort').value) || 0;
  const status = document.getElementById('featuredStatus').value;
  const image = document.getElementById('featuredImageUrl').value.trim();
  
  if (!title) { toast('请输入标题'); return; }
  if (price <= 0) { toast('请输入正确的价格'); return; }
  
  if (!DB.featuredOrders) DB.featuredOrders = [];
  
  const data = {
    title,
    description,
    price,
    unit,
    productId: productId || '',
    sortOrder,
    status,
    image,
    updatedAt: Date.now()
  };
  
  if (id) {
    // 编辑
    const f = DB.featuredOrders.find(x => x.id === id);
    if (!f) { toast('卡片不存在'); return; }
    Object.assign(f, data);
    saveData();
    toast('保存成功');
  } else {
    // 新增
    const maxSort = DB.featuredOrders.reduce((m,x) => Math.max(m, x.sortOrder||0), 0);
    DB.featuredOrders.push({
      id: genId('fo'),
      ...data,
      sortOrder: sortOrder > 0 ? sortOrder : maxSort + 1,
      createdAt: Date.now()
    });
    saveData();
    toast('添加成功');
  }
  closeModal();
  render();
}

// 上下架切换
function toggleFeaturedStatus(id) {
  const f = (DB.featuredOrders || []).find(x => x.id === id);
  if (!f) return;
  f.status = f.status === 'active' ? 'inactive' : 'active';
  saveData();
  toast(f.status === 'active' ? '已上架' : '已下架');
  render();
}

// 排序上移/下移
function moveFeatured(id, direction) {
  const list = (DB.featuredOrders || []).slice().sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  const idx = list.findIndex(x => x.id === id);
  if (idx < 0) return;
  if (direction === 'up' && idx === 0) { toast('已经是第一个'); return; }
  if (direction === 'down' && idx === list.length - 1) { toast('已经是最后一个'); return; }
  
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  const tmp = list[idx].sortOrder;
  list[idx].sortOrder = list[swapIdx].sortOrder;
  list[swapIdx].sortOrder = tmp;
  saveData();
  render();
}

  if (!confirm('确定删除该订单卡片？删除后首页将不再显示。')) return;

// 保存优惠券（新增或编辑）
function saveCoupon(id) {
  const name = document.getElementById('couponName').value.trim();
  const type = document.getElementById('couponType').value;
  const amount = parseFloat(document.getElementById('couponAmount').value) || 0;
  const discount = parseFloat(document.getElementById('couponDiscount').value) || 0;
  const minAmount = parseFloat(document.getElementById('couponMinAmount').value) || 0;
  const validFromStr = document.getElementById('couponValidFrom').value;
  const validToStr = document.getElementById('couponValidTo').value;
  const status = parseInt(document.getElementById('couponStatus').value) || 0;
  const desc = document.getElementById('couponDesc').value.trim();
  
  if (!name) { toast('请输入优惠券名称'); return; }
  if (type === 'fixed' && amount <= 0) { toast('请输入正确的面值'); return; }
  if (type === 'discount' && (discount <= 0 || discount >= 10)) { toast('折扣比例需在 0.1~9.9 之间'); return; }
  if (minAmount < 0) { toast('使用门槛不能为负数'); return; }
  
  const validFrom = validFromStr ? new Date(validFromStr).getTime() : null;
  const validTo = validToStr ? new Date(validToStr + ' 23:59:59').getTime() : null;
  if (validFrom && validTo && validFrom > validTo) { toast('有效期开始不能晚于结束'); return; }
  
  const data = {
    name,
    type,
    amount: type === 'fixed' ? amount : 0,
    discount: type === 'discount' ? discount : 0,
    minAmount,
    validFrom,
    validTo,
    status,
    desc: desc || (type === 'fixed' ? `满${minAmount}减${amount}` : `${discount}折优惠券`)
  };
  
  if (id) {
    // 编辑
    const c = DB.coupons.find(x => x.id === id);
    if (!c) { toast('优惠券不存在'); return; }
    Object.assign(c, data);
    saveData();
    toast('保存成功');
  } else {
    // 新增
    DB.coupons.push({
      id: genId('c'),
      ...data
    });
    saveData();
    toast('添加成功');
  }
  closeModal();
  render();
}

}

// 公告显示/隐藏切换
function toggleBannerEnabled(id) {
  const b = DB.banners.find(x => x.id === id);
  if (!b) return;
  b.enabled = b.enabled === false ? true : false;
  saveData();
  toast(b.enabled ? '已显示' : '已隐藏');
  render();
}

// 删除公告
function deleteBanner(id) {
  if (!confirm('确定删除该公告？')) return;
  DB.banners = DB.banners.filter(b => b.id !== id);
  saveData();
  toast('已删除');
  render();
}

// 充值审核：通过
function approveRecharge(id) {
  const r = (DB.recharges || []).find(x => x.id === id);
  if (!r || r.status !== 'pending') return;
  // 给用户加余额
  if (DB.currentUser && DB.currentUser.id === r.userId) {
    DB.currentUser.balance += r.amount;
  }
  if (DB.users) {
    const u = DB.users.find(u => u.id === r.userId);
    if (u) u.balance = (u.balance || 0) + r.amount;
  }
  r.status = 'approved';
  // 流水记录
  DB.flowRecords.push({
    id: genId('F'), type: 'recharge', amount: r.amount,
    desc: '账户充值（管理员审核通过）', time: Date.now()
  });
  saveData();
  toast('已通过，余额已增加');
  render();
}

// 充值审核：拒绝
function rejectRecharge(id) {
  const r = (DB.recharges || []).find(x => x.id === id);
  if (!r || r.status !== 'pending') return;
  const reason = prompt('拒绝原因：') || '';
  r.status = 'rejected';
  r.remark = reason;
  saveData();
  toast('已拒绝');
  render();
}

function addGame() {
  showGameForm();
}

function editGame(id) {
  const g = DB.games.find(x => x.id === id);
  if (g) showGameForm(g);
}

// 保存游戏（新增或更新）
function saveGame(id) {
  const name = document.getElementById('gf_name').value.trim();
  if (!name) { toast('请输入游戏名称'); return; }
  
  const icon = document.getElementById('gf_icon').value.trim() || name.charAt(0);
  const color = document.getElementById('gf_color').value || '#ff6b6b';
  const sort = parseInt(document.getElementById('gf_sort').value) || 1;
  const status = parseInt(document.getElementById('gf_status').value);
  
  const data = { name, icon, color, sort, status };
  
  if (id) {
    // 编辑
    const g = DB.games.find(x => x.id === id);
    if (g) Object.assign(g, data);
  } else {
    // 新增
    DB.games.push({ id: genId('g'), ...data });
  }
  
  saveData();
  closeModal();
  toast(id ? '修改成功' : '添加成功');
  render();
}

// 上下架切换
function toggleGame(id) {
  const g = DB.games.find(x => x.id === id);
  if (!g) return;
  g.status = g.status === 0 ? 1 : 0;
  saveData();
  toast(g.status === 0 ? '已下架' : '已上架');
  render();
}

// 排序上移/下移（direction: -1 上移，1 下移）
function moveGame(id, direction) {
  const games = DB.games.slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
  const idx = games.findIndex(g => g.id === id);
  if (idx < 0) return;
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= games.length) return;
  // 交换 sort 值
  const tmp = games[idx].sort;
  games[idx].sort = games[targetIdx].sort;
  games[targetIdx].sort = tmp;
  saveData();
  render();
}

// 删除游戏
function deleteGame(id) {
  const g = DB.games.find(x => x.id === id);
  if (!g) return;
  if (!confirm(`确定删除游戏「${g.name}」吗？`)) return;
  
  const idx = DB.games.findIndex(x => x.id === id);
  if (idx > -1) {
    DB.games.splice(idx, 1);
    // 登记到删除队列，同步到 Supabase 时真正删除
    enqueueDeletion('games', id);
    saveData();
    toast('已删除');
    render();
  }
}

              <input type="file" accept="image/*" id="qrAlipayUpload" style="display:none" onchange="handleQrUpload(this, 'alipay')">
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('qrAlipayUpload').click()">上传支付宝收款码</button>
              <button class="btn btn-gray btn-sm" style="margin-left:6px" onclick="DB.settings.paymentQrAlipay='';saveData();render();toast('已清除')">清除</button>
              <div style="font-size:11px;color:var(--text-3);margin-top:6px">建议尺寸：500×500，jpg/png 格式</div>
            </div>

      </div>
    </div>`;
}

function handleQrUpload(input, type) {
  const file = input.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('图片不能超过 2MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    if (type === 'wechat') {
      DB.settings.paymentQrWechat = e.target.result;
    } else {
      DB.settings.paymentQrAlipay = e.target.result;
    }
    saveData();
    render();
    toast('收款码已上传');
  };
  reader.readAsDataURL(file);
}

/**
 * 一键诊断：检查 Supabase 连接、表存在性、RLS 状态、最近同步状态
 * - 检测连接是否正常
 * - 抽样检测 orders / assessments / users 等关键表是否存在
 * - 检测 RLS 是否启用（通过尝试一条无权限查询判断）
 * - 显示所有表最近一次同步状态统计
 * - 显示离线队列数量
 */
async function runSyncDiagnosis() {
  const box = document.getElementById('diagnosisResult');
  const content = document.getElementById('diagnosisContent');
  if (!box || !content) return;
  box.style.display = 'block';
  content.innerHTML = '<span style="color:#fbbf24">🔍 正在诊断，请稍候...</span>';
  
  const lines = [];
  const addLine = (text, color = '') => {
    const c = color ? ` style="color:${color}"` : '';
    lines.push(`<div${c}>${text}</div>`);
  };
  
  addLine('━━━ 同步诊断报告 ━━━', '#60a5fa');
  addLine('');
  
  // 1. 基础状态
  addLine(`客户端状态: ${SUPABASE_ENABLED ? '已启用' : '未启用'}`, SUPABASE_ENABLED ? '#22c55e' : '#ef4444');
  addLine(`Supabase 实例: ${supabaseClient ? '已创建' : '未创建'}`, supabaseClient ? '#22c55e' : '#ef4444');
  addLine(`最后同步: ${SUPABASE_LAST_SYNC ? new Date(SUPABASE_LAST_SYNC).toLocaleString() : '从未同步'}`);
  if (SUPABASE_LAST_ERROR) addLine(`最近错误: ${SUPABASE_LAST_ERROR}`, '#ef4444');
  addLine(`离线队列: ${SUPABASE_OFFLINE_QUEUE.length} 条待发送`, SUPABASE_OFFLINE_QUEUE.length > 0 ? '#f59e0b' : '#22c55e');
  addLine('');
  
  if (!supabaseClient) {
    addLine('❌ Supabase 客户端未初始化，无法进行云端诊断', '#ef4444');
    content.innerHTML = lines.join('');
    return;
  }
  
  // 2. 连接测试
  addLine('▶ 连接测试中...', '#60a5fa');
  content.innerHTML = lines.join('');
  
  try {
    const t0 = Date.now();
    const { data, error } = await withTimeout(
      supabaseClient.from('settings').select('id').limit(1),
      10000
    );
    const latency = Date.now() - t0;
    
    if (error) {
      addLine(`❌ 连接失败: ${error.message}`, '#ef4444');
      
      // 分析错误类型
      if (error.message?.includes('relation') || error.message?.includes('does not exist')) {
        addLine('   → 原因：settings 表不存在，请点击「初始化数据库」', '#f59e0b');
      } else if (error.message?.includes('permission') || error.message?.includes('policy') || error.code === '42501') {
        addLine('   → 原因：RLS 未配置策略，请执行禁用 RLS 的 SQL', '#f59e0b');
      } else if (error.message?.includes('Failed to fetch') || error.message?.includes('network')) {
        addLine('   → 原因：网络问题，无法连接到 Supabase', '#f59e0b');
      }
    } else {
      addLine(`✅ 连接正常 (延迟 ${latency}ms)`, '#22c55e');
    }
  } catch (e) {
    addLine(`❌ 连接超时/异常: ${e.message}`, '#ef4444');
  }
  
  addLine('');
  
  // 3. 关键表存在性检查（抽样）
  const keyTables = ['orders', 'assessments', 'users', 'boosters', 'withdrawals', 'recharges'];
  addLine('▶ 关键表存在性检查:', '#60a5fa');
  content.innerHTML = lines.join('');
  
  let tableOk = 0;
  let tableFail = 0;
  for (const table of keyTables) {
    try {
      const { error } = await withTimeout(
        supabaseClient.from(table).select('id').limit(1),
        5000
      );
      if (error) {
        addLine(`  ❌ ${table}: ${error.message}`, '#ef4444');
        tableFail++;
      } else {
        addLine(`  ✅ ${table}: 存在`, '#22c55e');
        tableOk++;
      }
    } catch (e) {
      addLine(`  ❌ ${table}: ${e.message}`, '#ef4444');
      tableFail++;
    }
    content.innerHTML = lines.join('');
  }
  
  addLine('');
  addLine(`表检测结果: ${tableOk}/${keyTables.length} 通过`, tableFail === 0 ? '#22c55e' : '#f59e0b');
  if (tableFail > 0) {
    addLine('💡 建议：点击「初始化数据库」获取建表 SQL，在 Supabase 执行', '#f59e0b');
  }
  
  addLine('');
  
  // 4. RLS 简单检测：尝试插入一条明显会被 RLS 阻止的记录
  addLine('▶ RLS 检测 (写入测试):', '#60a5fa');
  content.innerHTML = lines.join('');
  
  try {
    const testId = 'diag_test_' + Date.now();
    const { error } = await withTimeout(
      supabaseClient.from('settings').select('id').limit(1),
      5000
    );
    if (error && (error.code === '42501' || error.message?.includes('policy') || error.message?.includes('permission'))) {
      addLine('  ⚠️ 检测到 RLS 限制，建议禁用 RLS 或配置策略', '#f59e0b');
      addLine('  → 点击下方 SQL 代码块复制并在 Supabase 执行', '#f59e0b');
    } else {
      addLine('  ✅ 查询权限正常', '#22c55e');
    }
  } catch (e) {
    addLine(`  ⚠️ RLS 检测跳过: ${e.message}`, '#f59e0b');
  }
  
  addLine('');
  
  // 5. 各表同步状态汇总
  addLine('▶ 各表同步状态汇总:', '#60a5fa');
  const allTables = Object.keys(SYNC_TABLE_STATUS);
  if (allTables.length === 0) {
    addLine('  (暂无同步记录)', '#9ca3af');
  } else {
    const successTables = allTables.filter(t => SYNC_TABLE_STATUS[t]?.status === 'success');
    const failedTables = allTables.filter(t => SYNC_TABLE_STATUS[t]?.status === 'failed');
    const localTables = allTables.filter(t => SYNC_TABLE_STATUS[t]?.status === 'local');
    addLine(`  成功: ${successTables.length} 表`, '#22c55e');
    if (localTables.length > 0) {
      addLine(`  本地模式: ${localTables.length} 表（不影响使用）`, '#60a5fa');
      localTables.forEach(t => {
        addLine(`    • ${t}: ${SYNC_TABLE_STATUS[t]?.error || '云端未初始化'}`, '#60a5fa');
      });
    }
    if (failedTables.length > 0) {
      addLine(`  失败: ${failedTables.length} 表`, '#ef4444');
      failedTables.forEach(t => {
        addLine(`    • ${t}: ${SYNC_TABLE_STATUS[t]?.error || '未知错误'}`, '#ef4444');
      });
    }
  }
  
  addLine('');
  addLine('━━━ 诊断完成 ━━━', '#60a5fa');
  
  content.innerHTML = lines.join('');
}

/** 复制完整禁用 RLS 的 SQL 到剪贴板 */
function copyDisableRLSSQL() {
  const tables = TABLE_MAP.filter(t => t.table !== 'admins').map(t => t.table);
  tables.push('order_chat_messages', 'admins');
  const unique = [...new Set(tables)];
  const sql = '-- ========================================\n' +
    '-- 禁用所有表的 RLS（快速解决权限问题）\n' +
    '-- 在 Supabase SQL Editor 中执行\n' +
    '-- ========================================\n\n' +
    unique.map(t => `ALTER TABLE ${t} DISABLE ROW LEVEL SECURITY;`).join('\n') +
    '\n\n-- ========================================\n' +
    '-- 或者保留 RLS 并启用匿名全部放行策略（更安全）\n' +
    '-- ========================================\n\n' +
    unique.map(t => `DROP POLICY IF EXISTS "anon_all_${t.replace(/[^a-z0-9]/g,'_')}" ON ${t};\nCREATE POLICY "anon_all_${t.replace(/[^a-z0-9]/g,'_')}" ON ${t} FOR ALL USING (true) WITH CHECK (true);`).join('\n\n');
  try {
    const ta = document.createElement('textarea');
    ta.value = sql;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('完整 SQL 已复制到剪贴板');
  } catch (e) {
    toast('复制失败，请手动复制');
  }
}

    html += '</div>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<span style="color:#ef4444">读取失败：${e.message}</span>`;
  }
}

async function changeAdminPwd() {
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const newPwd2 = document.getElementById('newPwd2').value;
  if (!oldPwd) return toast('请输入当前密码');
  if (!newPwd || newPwd.length < 6) return toast('新密码至少6位');
  if (newPwd !== newPwd2) return toast('两次密码不一致');
  
  // 验证旧密码：优先 Supabase，降级本地
  let oldPwdValid = false;
  if (supabaseClient && SUPABASE_ENABLED) {
    try {
      const { data, error } = await supabaseClient
        .from('admins')
        .select('password')
        .eq('username', 'admin')
        .single();
      if (data && data.password === oldPwd) {
        oldPwdValid = true;
      } else if (error && error.code === 'PGRST116') {
        // 表里没有管理员记录，用本地校验
        oldPwdValid = oldPwd === (DB.adminPassword || 'admin888');
      }
    } catch (e) {
      console.warn('[Supabase] verify old pwd failed:', e.message);
      oldPwdValid = oldPwd === (DB.adminPassword || 'admin888');
    }
  } else {
    oldPwdValid = oldPwd === (DB.adminPassword || 'admin888');
  }
  
  if (!oldPwdValid) return toast('原密码错误');
  
  // 更新本地
  DB.adminPassword = newPwd;
  saveData();
  
  // 同步到 Supabase
  if (supabaseClient && SUPABASE_ENABLED) {
    try {
      // upsert：有则更新，无则插入
      await supabaseClient.from('admins').upsert(
        { username: 'admin', password: newPwd, role: 'super_admin', status: 1 },
        { onConflict: 'username' }
      );
    } catch (e) {
      console.warn('[Supabase] update admin password failed:', e.message);
      // 静默降级：本地密码已更新，云端失败不打扰用户
    }
  }
  
  toast('密码修改成功');
  render();
}

function addQuickReply() {
  DB.settings.quickReplies.push('新话术');
  saveData();
  render();
}
function removeQuickReply(i) {
  DB.settings.quickReplies.splice(i, 1);

// ============== INITIALIZATION ==============
function initUserApp() {
  // Banner auto-play（滑动轮播）
  if (STATE.page === 'home' && !STATE.subPage) {
    if (window._bannerTimer) clearInterval(window._bannerTimer);
    window._bannerTimer = setInterval(() => {
      if (STATE.page === 'home' && !STATE.subPage && DB.currentIdentity !== 'admin') {
        const banners = (DB.banners || []).filter(b => b.enabled !== false);
        if (banners.length <= 1) return;
        STATE.bannerIndex = (STATE.bannerIndex + 1) % banners.length;
        const el = document.getElementById('bannerCarousel');
        if (el) {
          const w = el.clientWidth + 12; // 含 gap
          el.scrollTo({ left: STATE.bannerIndex * w, behavior: 'smooth' });
        }
        const dots = document.querySelectorAll('#bannerDots span');
        dots.forEach((d,i) => d.classList.toggle('active', i === STATE.bannerIndex));
      }
    }, 4000);
  }
  // 订单聊天页滚动到底部
  if (STATE.subPage === 'orderChatDetail') {
    setTimeout(scrollOrderChatBottom, 50);
  }
}

function init() {
  // 1. 先读取本地数据并渲染，保证页面秒开，不依赖云端
  loadData();
  // 2. 加载登录态
  loadAuthState();
  // 3. 根据登录态同步身份
  if (AUTH_STATE.isLoggedIn && AUTH_STATE.role === 'admin') {
    DB.currentIdentity = 'admin';
  } else if (AUTH_STATE.isLoggedIn) {
    if (DB.currentIdentity === 'admin') DB.currentIdentity = 'user';
  }
  // 4. 先渲染一次本地数据，用户立即看到内容
  render();
  updateTitleUnread();
  // 5. 后台异步初始化 Supabase 并开始同步（不阻塞渲染）
  setTimeout(() => {
    const ok = initSupabase();
    if (ok) {
      loadSupabaseInBackground();
    }
  }, 100);
  // 首次用户交互后初始化语音（绕过浏览器自动播放限制）
  const firstInteract = () => {
    initVoice();
    document.removeEventListener('click', firstInteract);
    document.removeEventListener('touchstart', firstInteract);
    document.removeEventListener('keydown', firstInteract);
  };
  document.addEventListener('click', firstInteract);
  document.addEventListener('touchstart', firstInteract);
  document.addEventListener('keydown', firstInteract);
}

// Start the app
document.addEventListener('DOMContentLoaded', init);
// Fallback if DOMContentLoaded already fired
if (document.readyState !== 'loading') {
  loadData();
  loadAuthState();
  if (AUTH_STATE.isLoggedIn && AUTH_STATE.role === 'admin') {
    DB.currentIdentity = 'admin';
  } else if (AUTH_STATE.isLoggedIn && DB.currentIdentity === 'admin') {
    DB.currentIdentity = 'user';
  }
  render();
  // 后台初始化云端
  setTimeout(() => {
    const ok = initSupabase();
    if (ok) loadSupabaseInBackground();
  }, 100);
}

</script>
