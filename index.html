<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="interactive-prototype">
<title>护航电竞平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--bg-card:#14141f;--bg-card-2:#1a1a28;--bg-hover:#22223a;
  --text:#f0f0f5;--text-2:#a0a0b8;--text-3:#6a6a82;
  --gold:#d4af37;--gold-2:#f5d76e;--gold-dark:#9a7b2a;--gold-bg:rgba(212,175,55,0.1);
  --border:#2a2a40;--border-2:#1e1e30;
  --success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;
  --shadow:0 4px 20px rgba(0,0,0,0.4);--shadow-gold:0 4px 20px rgba(212,175,55,0.15);
  --radius:12px;--radius-lg:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:60px}
#app.admin-mode{max-width:100%;padding-bottom:0}

/* Top Bar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-2)}
.topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.topbar .logo .logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.topbar .title{font-size:16px;font-weight:600}
.topbar .icons{display:flex;align-items:center;gap:14px}
.topbar .icon-btn{position:relative;width:24px;height:24px;color:var(--text-2);cursor:pointer}
.topbar .icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.topbar .sync-status{position:absolute;top:50%;right:60px;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3)}
.topbar .sync-status .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.topbar .sync-status.sync-connected .sync-dot{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,0.6)}
.topbar .sync-status.sync-connecting .sync-dot{background:#f59e0b;animation:pulse 1.2s infinite}
.topbar .sync-status.sync-failed .sync-dot{background:#ef4444}
.topbar .sync-status.sync-offline .sync-dot{background:#9ca3af}

/* Bottom Tab Bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-card);border-top:1px solid var(--border-2);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--text-3);cursor:pointer;font-size:11px;transition:color .2s}
.tabbar .tab.active{color:var(--gold)}
.tabbar .tab svg{width:22px;height:22px}

/* Page Container */
.page{display:none;padding:0 0 20px;min-height:calc(100vh - 120px)}
.page.active{display:block}

/* Banner */
.banner{margin:12px 16px;border-radius:var(--radius-lg);height:140px;background:linear-gradient(135deg,#1a1a2e 0%,#2d1f3d 50%,#1a1a2e 100%);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 24px;cursor:pointer}
.banner .banner-content{flex:1;z-index:2}
.banner .banner-title{font-size:22px;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,var(--gold-2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.banner .banner-sub{font-size:13px;color:var(--text-2)}
.banner .banner-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.banner .banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);transition:all .3s}
.banner .banner-dots span.active{background:var(--gold);width:18px;border-radius:3px}

/* Game Scroll */
.section-title{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.section-title h3{font-size:16px;font-weight:600}
.section-title .more{font-size:12px;color:var(--text-3);cursor:pointer}
.game-scroll{display:flex;gap:12px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.game-scroll::-webkit-scrollbar{display:none}
.game-item{flex-shrink:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.game-item .game-icon{width:52px;height:52px;border-radius:14px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--border)}
.game-item .game-name{font-size:12px;color:var(--text-2)}

/* Cards */
.card{background:var(--bg-card);border-radius:var(--radius);margin:10px 16px;padding:14px;border:1px solid var(--border-2)}
.booster-card{background:var(--bg-card);border-radius:var(--radius);margin:10px 16px;padding:14px;border:1px solid var(--border-2);cursor:pointer;transition:border-color .2s}
.booster-card:active{border-color:var(--gold)}
.booster-card .booster-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:18px;flex-shrink:0}
.avatar.lg{width:64px;height:64px;font-size:24px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.booster-info{flex:1;min-width:0}
.booster-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.rank-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:var(--gold-bg);color:var(--gold)}
.booster-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--text-2)}
.booster-meta .rating{color:var(--gold);font-weight:600}
.booster-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{padding:3px 8px;border-radius:4px;font-size:11px;background:var(--bg-card-2);color:var(--text-2)}
.tag.gold{background:var(--gold-bg);color:var(--gold)}
.booster-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border-2)}
.price{color:var(--gold);font-weight:700;font-size:16px}
.price .unit{font-size:11px;font-weight:400;color:var(--text-2);margin-left:2px}

/* Filter Bar */
.filter-bar{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg);position:sticky;top:50px;z-index:50;border-bottom:1px solid var(--border-2)}
.filter-bar::-webkit-scrollbar{display:none}
.filter-pill{padding:6px 14px;border-radius:20px;font-size:13px;background:var(--bg-card);color:var(--text-2);white-space:nowrap;cursor:pointer;border:1px solid var(--border-2)}
.filter-pill.active{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-dark)}

/* Bottom fixed bar */
.bottom-bar{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg-card);border-top:1px solid var(--border-2);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:90}
.bottom-bar .action-icons{display:flex;gap:16px}
.bottom-bar .action-icon{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-2);font-size:10px;cursor:pointer}
.bottom-bar .action-icon svg{width:20px;height:20px}
.bottom-bar .btn-primary{flex:1}

/* Buttons */
.btn{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-danger{background:var(--danger);color:#fff}
.btn-gray{background:var(--bg-card-2);color:var(--text);border:1px solid var(--border)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}

/* Form */
.form-group{margin-bottom:14px}
.form-label{font-size:13px;color:var(--text-2);margin-bottom:6px;display:block}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border-radius:8px;background:var(--bg-card-2);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--gold)}
.form-textarea{min-height:80px;resize:vertical}
.form-row{display:flex;gap:10px}
.form-row > *{flex:1}

/* Stepper */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.stepper button{width:32px;height:32px;background:var(--bg-card-2);border:none;color:var(--text);font-size:16px;cursor:pointer}
.stepper span{width:40px;text-align:center;font-size:14px}

/* Order Card */
.order-card{background:var(--bg-card);border-radius:var(--radius);margin:10px 16px;padding:14px;border:1px solid var(--border-2)}
.order-card .order-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border-2)}
.order-card .order-game{font-size:13px;color:var(--text-2)}
.order-status{font-size:12px;font-weight:600}
.order-status.pending{color:var(--warning)}
.order-status.ongoing{color:var(--info)}
.order-status.completed{color:var(--success)}
.order-status.refund{color:var(--danger)}
.order-card .order-body{padding:12px 0;display:flex;gap:12px;align-items:center}
.order-card .order-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid var(--border-2)}

/* Profile Header */
.profile-header{padding:24px 16px;background:linear-gradient(180deg,rgba(212,175,55,0.15),transparent);display:flex;align-items:center;gap:14px}
.profile-header .avatar{width:60px;height:60px;font-size:22px}
.profile-info .name{font-size:18px;font-weight:700}
.profile-info .level{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--gold-bg);color:var(--gold)}

/* Stats Row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);padding:16px;background:var(--bg-card);margin:12px 16px;border-radius:var(--radius);border:1px solid var(--border-2)}
.stats-row .stat-item{text-align:center}
.stats-row .stat-value{font-size:18px;font-weight:700;color:var(--gold)}
.stats-row .stat-label{font-size:11px;color:var(--text-3);margin-top:2px}

/* Menu List */
.menu-list{background:var(--bg-card);margin:12px 16px;border-radius:var(--radius);border:1px solid var(--border-2);overflow:hidden}

function logSupabase(level, tag, msg, data) {
  if (!SUPABASE_DEBUG) return;
  const fn = level === 'error' ? console.error : (level === 'warn' ? console.warn : console.log);
  const prefix = `[Supabase:${tag}]`;
  if (data !== undefined) fn(prefix, msg, data);
  else fn(prefix, msg);
}

function setSupabaseStatus(status, errorMsg) {
  const prev = SUPABASE_STATUS;
  SUPABASE_STATUS = status;
  if (errorMsg) SUPABASE_LAST_ERROR = errorMsg;
  if (status === 'connected') SUPABASE_ENABLED = true;
  if (status === 'failed' || status === 'offline') {
    // 注意：不直接关闭 SUPABASE_ENABLED，保留重试机会
    SUPABASE_ENABLED = true;
  }
  if (prev !== status) {
    logSupabase('info', 'status', `${prev} -> ${status}${errorMsg ? ' ('+errorMsg+')' : ''}`);
  }
}
function initSupabase() {
  setSupabaseStatus('connecting');
  try {
    if (typeof supabase !== 'undefined' && window.supabase && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        realtime: {
          params: { eventsPerSecond: 20 }
        }
      });
      SUPABASE_ENABLED = true;
      setSupabaseStatus('connected');
      logSupabase('info', 'init', 'SDK 初始化成功');
      return true;
    } else {
      setSupabaseStatus('offline', 'SDK 未加载');
      SUPABASE_ENABLED = false;
      console.warn('[Supabase] SDK 未加载，降级到本地存储');

    SUPABASE_ENABLED = false;

// ============ Realtime 订阅 ============
function subscribeOrdersRealtime() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    // 先清理旧频道
    if (SUPABASE_ORDERS_CHANNEL) {
      supabaseClient.removeChannel(SUPABASE_ORDERS_CHANNEL);
    }
    SUPABASE_ORDERS_CHANNEL = supabaseClient
      .channel('orders-changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'orders' },
        (payload) => {
          console.log('[Realtime] orders change:', payload.eventType, payload.new?.id || payload.old?.id);
          // 增量更新本地 DB
          if (payload.eventType === 'INSERT' && payload.new) {
            const row = toCamel(payload.new);
            if (!DB.orders.find(o => o.id === row.id)) {
              DB.orders.push(row);
            }
          } else if (payload.eventType === 'UPDATE' && payload.new) {
            const row = toCamel(payload.new);
            const idx = DB.orders.findIndex(o => o.id === row.id);
            if (idx >= 0) DB.orders[idx] = row;
            else DB.orders.push(row);
          } else if (payload.eventType === 'DELETE' && payload.old) {
            const row = toCamel(payload.old);
            DB.orders = DB.orders.filter(o => o.id !== row.id);
          }
          saveData(false); // 仅存本地，不回写云端
          render();
        }
      )
      .subscribe((status) => {
        console.log('[Realtime] orders channel:', status);
      });
  } catch (e) {
    console.warn('[Realtime] orders subscription failed:', e.message);
  }
}

function subscribeChatRealtime() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    if (SUPABASE_CHAT_CHANNEL) {
      supabaseClient.removeChannel(SUPABASE_CHAT_CHANNEL);
    }
    SUPABASE_CHAT_CHANNEL = supabaseClient
      .channel('chat-changes')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'chat_messages' },
        (payload) => {
          console.log('[Realtime] chat_message insert:', payload.new?.id);
          const msg = toCamel(payload.new);
          const sid = msg.sessionId || 'default';
          if (!DB.chatMessages[sid]) DB.chatMessages[sid] = [];
          if (!DB.chatMessages[sid].find(m => m.id === msg.id)) {
            DB.chatMessages[sid].push(msg);
            // 同步更新会话列表
            const sess = DB.chatSessions.find(s => s.id === sid);
            if (sess) {
              sess.lastMsg = msg.content;
              sess.lastTime = msg.createTime || Date.now();
              if (msg.senderType !== 'admin' || DB.currentIdentity !== 'admin') {
                sess.unread = (sess.unread || 0) + 1;
              }
            }
            saveData(false);
            // 如果当前在客服页，刷新
            if (STATE.page === 'chat' || STATE.subPage === 'chatDetail' || (DB.currentIdentity === 'admin' && adminTab === 'chat')) {
              render();
            }
          }
        }
      )
      .subscribe((status) => {
        console.log('[Realtime] chat channel:', status);
      });
  } catch (e) {
    console.warn('[Realtime] chat subscription failed:', e.message);
  }
}

function copySQL() {
  const ta = document.getElementById('sqlTextarea');
  if (!ta) return;
  ta.select();
  ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    toast('SQL 已复制到剪贴板');
  } catch (e) {
    toast('复制失败，请手动选择复制');
  }
}

async function testSupabaseConnection() {
  const resultEl = document.getElementById('sqlResult');
  resultEl.textContent = '正在测试连接...';
  resultEl.style.color = 'var(--text-2)';
  try {
    if (!supabaseClient) throw new Error('Supabase 未初始化');
    const { data, error } = await supabaseClient.from('settings').select('id').limit(1);
    if (error) throw error;
    resultEl.textContent = '✅ 连接成功！Supabase 数据库可用。';
    resultEl.style.color = '#22c55e';
    SUPABASE_ENABLED = true;
    // 连接成功后尝试从云端拉取数据
    await syncFromSupabase();
    setTimeout(() => { closeModal(); render(); toast('云端数据已同步'); }, 1000);
  } catch (e) {
    resultEl.textContent = '❌ 连接失败：' + e.message + '（请先在 Supabase 执行建表 SQL）';
    resultEl.style.color = '#ef4444';
    SUPABASE_ENABLED = false;
  }
}

let DB = {};
const USER_ID_KEY = 'huhang_user_id_v1';
const USER_BOOSTER_KEY = 'huhang_booster_id_v1';

function getCurrentUserId() {
  let uid = localStorage.getItem(USER_ID_KEY);
  if (!uid) {
    uid = 'u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    localStorage.setItem(USER_ID_KEY, uid);
  }
  return uid;
}

function getCurrentBoosterId() {
  return localStorage.getItem(USER_BOOSTER_KEY) || null;
}

async function ensureCurrentUser() {
  const uid = getCurrentUserId();
  // 本地 DB.currentUser 初始化
  if (!DB.currentUser || DB.currentUser.id !== uid) {
    DB.currentUser = {
      id: uid,
      nickname: '电竞玩家',
      avatar: '玩',
      level: '黄金会员',
      balance: 500,
      coupons: 2,
      favorites: []
    };
  }
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    // 查询用户是否存在
    const { data, error } = await supabaseClient.from('users').select('*').eq('id', uid).single();
    if (error && error.code === 'PGRST116') {
      // 不存在，创建
      const userData = {
        id: uid,
        nickname: DB.currentUser.nickname || '电竞玩家',
        avatar: DB.currentUser.avatar || '玩',
        balance: DB.currentUser.balance || 0,
        vip_level: DB.currentUser.level || '普通会员',
        status: 1,
        created_at: new Date().toISOString()
      };
      await supabaseClient.from('users').insert(userData);
      console.log('[Supabase] 新匿名用户已创建:', uid);
    } else if (data) {
      // 已存在，同步数据到本地
      DB.currentUser.id = data.id;
      DB.currentUser.nickname = data.nickname || DB.currentUser.nickname;
      DB.currentUser.avatar = data.avatar || DB.currentUser.avatar;
      DB.currentUser.balance = parseFloat(data.balance || 0);
      DB.currentUser.level = data.vip_level || '普通会员';
      console.log('[Supabase] 用户信息已同步');
    }
  } catch (e) {
    console.warn('[Supabase] ensureCurrentUser failed:', e.message);
  }
}

async function verifyAdminLogin(username, password) {
  if (!supabaseClient || !SUPABASE_ENABLED) {
    // 降级：本地默认密码
    return password === (DB.adminPassword || 'admin888');
  }
  try {
    // 先确保 admins 表存在默认管理员记录（防止表为空时无法登录）
    await ensureAdminInSupabase();
    
    const { data, error } = await supabaseClient
      .from('admins')
      .select('*')
      .eq('username', username)
      .single();
    if (error || !data) {
      // Supabase 查询未命中，降级到本地密码
      console.warn('[Supabase] admin not found in table, fallback to local');
      return password === (DB.adminPassword || 'admin888');
    }
    // 明文比较（数据库中 password 字段存明文）
    return data.password === password;
  } catch (e) {
    console.warn('[Supabase] admin login failed:', e.message);
    // 降级到本地密码
    return password === (DB.adminPassword || 'admin888');
  }
}

async function ensureAdminInSupabase() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  try {
    const { data, error } = await supabaseClient

      .eq('username', 'admin')
      .single();
    if (error && error.code === 'PGRST116') {
      // 无记录，插入默认管理员

        username: 'admin',
        password: 'admin888',
        role: 'super_admin',
        status: 1
      });

async function loadSupabaseInBackground() {
  if (!supabaseClient) {
    setSupabaseStatus('offline', '无客户端');
    return;
  }
  try {
    setSupabaseStatus('connecting');
    const ok = await syncFromSupabase();
    if (ok) {
      setSupabaseStatus('connected');
      logSupabase('info', 'sync', '全量同步完成');
      SUPABASE_LAST_SYNC = Date.now();
      startPolling();
      subscribeOrdersRealtime();
      subscribeChatRealtime();
      await ensureCurrentUser();
      // 重放离线队列
      flushOfflineQueue();
      render();
    } else {
      setSupabaseStatus('failed', '同步失败');
      // 不直接关闭 SUPABASE_ENABLED，保留写入和轮询重试机会
      SUPABASE_ENABLED = true;
      startPolling();
      logSupabase('warn', 'sync', '全量同步失败，继续使用本地数据，后台持续重试');
    }
  } catch (e) {
    setSupabaseStatus('failed', e.message);
    SUPABASE_ENABLED = true;
    startPolling();
    logSupabase('error', 'sync', '加载云端数据异常: ' + e.message);
  }
}

};

const REVERSE_FIELD_MAP = {};
Object.keys(FIELD_MAP).forEach(k => { REVERSE_FIELD_MAP[FIELD_MAP[k]] = k; });

function toSnake(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toSnake);
  const out = {};
  for (const k of Object.keys(obj)) {
    const sk = FIELD_MAP[k] || k;
    out[sk] = obj[k];
  }
  return out;
}

function toCamel(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toCamel);
  const out = {};
  for (const k of Object.keys(obj)) {
    const ck = REVERSE_FIELD_MAP[k] || k;
    out[ck] = obj[k];
  }
  return out;
}

    if (withdrawalsRes.status === 'fulfilled' && withdrawalsRes.value.data) DB.withdrawals = toCamel(withdrawalsRes.value.data);

// ============ 离线队列 ============
function addToOfflineQueue(table, record, mode = 'upsert') {
  SUPABASE_OFFLINE_QUEUE.push({ table, record, mode, time: Date.now() });
  logSupabase('warn', 'queue', `加入离线队列: ${table} (${SUPABASE_OFFLINE_QUEUE.length} 条)`);
  scheduleFlushQueue();
}

function scheduleFlushQueue() {
  if (SUPABASE_QUEUE_TIMER) return;
  SUPABASE_QUEUE_TIMER = setTimeout(() => {
    SUPABASE_QUEUE_TIMER = null;
    flushOfflineQueue();
  }, 3000);
}

async function flushOfflineQueue() {
  if (!supabaseClient || !SUPABASE_ENABLED) return;
  if (SUPABASE_OFFLINE_QUEUE.length === 0) return;
  const queue = SUPABASE_OFFLINE_QUEUE.slice();
  SUPABASE_OFFLINE_QUEUE = [];
  logSupabase('info', 'queue', `开始重放 ${queue.length} 条离线操作`);
  let success = 0;
  for (const item of queue) {
    try {
      if (item.mode === 'upsert') {
        const { error } = await supabaseClient.from(item.table).upsert(item.record);
        if (error) throw error;
      }
      success++;
    } catch (e) {
      logSupabase('warn', 'queue', `重放失败 ${item.table}: ${e.message}`);
      SUPABASE_OFFLINE_QUEUE.push(item);
    }
  }
  if (success > 0) {
    logSupabase('info', 'queue', `重放成功 ${success}/${queue.length} 条`);
  }
  if (SUPABASE_OFFLINE_QUEUE.length > 0) {
    scheduleFlushQueue();
  }
}

// ============ 单条订单强制写入（立即，不防抖） ============
async function forceSyncOrder(order) {
  if (!supabaseClient || !SUPABASE_ENABLED) {
    addToOfflineQueue('orders', toSnake(order));
    return false;
  }
  try {
    const payload = toSnake(order);
    const { error } = await supabaseClient.from('orders').upsert(payload);
    if (error) throw error;
    logSupabase('info', 'order', `订单已同步: ${order.id}`);
    return true;
  } catch (e) {
    logSupabase('error', 'order', `订单写入失败: ${e.message}`);
    addToOfflineQueue('orders', toSnake(order));
    return false;
  }
}

async function forceFetchPendingOrders() {
  if (!supabaseClient || !SUPABASE_ENABLED) return null;
  try {
    const { data, error } = await supabaseClient
      .from('orders')
      .select('*')
      .eq('status', 'pending');
    if (error) throw error;
    const list = toCamel(data || []);
    // 合并到本地 DB（以云端为准，更新/追加）
    const map = new Map(DB.orders.map(o => [o.id, o]));
    list.forEach(o => map.set(o.id, o));
    DB.orders = Array.from(map.values());
    logSupabase('info', 'orders', `拉取待接单订单: ${list.length} 条`);
    return list;
  } catch (e) {
    logSupabase('error', 'orders', `拉取待接单订单失败: ${e.message}`);
    return null;
  }
}

  if (!supabaseClient) return false;
  try {

    if (DB.boosters && DB.boosters.length) {
      tableList.push('boosters');
      promises.push(supabaseClient.from('boosters').upsert(toSnake(DB.boosters)));
    }
    if (DB.products && DB.products.length) {
      tableList.push('products');
      promises.push(supabaseClient.from('products').upsert(toSnake(DB.products)));
    }
    if (DB.orders && DB.orders.length) {
      tableList.push('orders');

    }
    if (DB.paymentRecords && DB.paymentRecords.length) {

      promises.push(supabaseClient.from('withdrawals').upsert(toSnake(DB.withdrawals)));
    }
    if (DB.flowRecords && DB.flowRecords.length) {
      tableList.push('transactions');
      promises.push(supabaseClient.from('transactions').upsert(toSnake(DB.flowRecords)));
    }
    if (DB.assessments && DB.assessments.length) {
      tableList.push('assessments');
      promises.push(supabaseClient.from('assessments').upsert(toSnake(DB.assessments)));
    }
    if (DB.coupons && DB.coupons.length) {
      tableList.push('coupons');
      promises.push(supabaseClient.from('coupons').upsert(toSnake(DB.coupons)));
    }
    if (DB.userCoupons && DB.userCoupons.length) {
      tableList.push('user_coupons');
      promises.push(supabaseClient.from('user_coupons').upsert(toSnake(DB.userCoupons)));
    }
    if (DB.favorites && DB.favorites.length) {
      tableList.push('favorites');
      promises.push(supabaseClient.from('favorites').upsert(toSnake(DB.favorites)));
    }
    if (DB.messages && DB.messages.length) {
      tableList.push('messages');
      promises.push(supabaseClient.from('messages').upsert(toSnake(DB.messages)));
    }
    if (DB.chatSessions && DB.chatSessions.length) {
      tableList.push('chat_sessions');
      promises.push(supabaseClient.from('chat_sessions').upsert(toSnake(DB.chatSessions)));
    }
    if (DB.banners && DB.banners.length) {
      tableList.push('banners');
      promises.push(supabaseClient.from('banners').upsert(toSnake(DB.banners)));
    }
    if (DB.reviews && DB.reviews.length) {
      tableList.push('reviews');
      promises.push(supabaseClient.from('reviews').upsert(toSnake(DB.reviews)));
    }
    if (DB.users && DB.users.length) {
      tableList.push('users');
      promises.push(supabaseClient.from('users').upsert(toSnake(DB.users)));
    }
    
    // chat_messages 展平
    if (DB.chatMessages) {
      const flat = [];
      for (const [sid, arr] of Object.entries(DB.chatMessages)) {
        arr.forEach(m => {
          flat.push({ ...m, sessionId: sid });
        });
      }
      if (flat.length) {
        tableList.push('chat_messages');
        promises.push(supabaseClient.from('chat_messages').upsert(toSnake(flat)));
      }
    }
    
    // order_chat_messages 展平 { orderId: [msgs] } -> 数组
    if (DB.orderChatMessages) {
      const flat = [];
      for (const [oid, arr] of Object.entries(DB.orderChatMessages)) {
        arr.forEach(m => {
          flat.push({
            id: m.id,
            order_id: oid,
            user_id: m.userId,
            booster_id: m.boosterId,
            sender: m.sender,
            content: m.content,
            is_read: m.isRead || false,

          });
        });
      }
      if (flat.length) {
        tableList.push('order_chat_messages');
        promises.push(supabaseClient.from('order_chat_messages').upsert(flat));
      }
    }
    
    const results = await Promise.allSettled(promises);
    let hasError = false;
    results.forEach((r, i) => {
      const tbl = tableList[i];
      if (r.status === 'rejected') {
        hasError = true;
        logSupabase('error', 'save', `${tbl} 写入失败: ${r.reason?.message || r.reason}`);
      } else if (r.value?.error) {
        hasError = true;
        logSupabase('error', 'save', `${tbl} 写入错误: ${r.value.error.message} (code: ${r.value.error.code})`);
      } else {
        logSupabase('info', 'save', `${tbl} 写入成功`);
      }
    });
    
    if (!hasError) {
      SUPABASE_LAST_SYNC = Date.now();
      setSupabaseStatus('connected');
    } else {
      setSupabaseStatus('failed', '部分表写入失败');
    }
    return !hasError;
  } catch (e) {
    logSupabase('error', 'save', 'saveToSupabase 异常: ' + e.message);
    setSupabaseStatus('failed', e.message);
    return false;
  }
}

// ============ 轮询同步 ============
function startPolling() {
  if (SUPABASE_POLL_TIMER) return;
  SUPABASE_POLL_TIMER = setInterval(async () => {
    if (!SUPABASE_ENABLED || !supabaseClient) return;
    try {
      // 记录轮询前的 pending 订单数量和 ID 集合，用于新订单检测
      const prevPendingIds = new Set(DB.orders.filter(o => o.status === 'pending').map(o => o.id));
      // 记录轮询前的聊天消息数量，用于新消息检测
      const prevOrderChatCount = countTotalOrderChatMessages();
      const prevChatCount = countTotalChatMessages();

      await syncFromSupabase();
      await syncOrderChatFromSupabase();

      // --- 新订单检测（仅打手端）---
      if (DB.currentIdentity === 'booster') {
        const newPending = DB.orders.filter(o => o.status === 'pending' && !prevPendingIds.has(o.id));
        if (newPending.length > 0 && VOICE_STATE.initialized) {
          // 同一个订单只播报一次
          newPending.forEach(o => {
            if (!VOICE_STATE.announcedOrders.has(o.id)) {
              VOICE_STATE.announcedOrders.add(o.id);
              // 新订单优先级最高，立即打断当前语音
              speak('您有新的订单，请及时抢单', { priority: 'high' });
            }
          });
        }
      }

      // --- 新消息检测 ---
      const newOrderChatCount = countTotalOrderChatMessages();
      const newChatCount = countTotalChatMessages();
      if (newOrderChatCount > prevOrderChatCount || newChatCount > prevChatCount) {
        // 判断是否有发给我的新消息
        const hasNewMsgForMe = checkHasNewIncomingMessage(prevOrderChatCount, prevChatCount);
        if (hasNewMsgForMe && VOICE_STATE.initialized) {
          // 新消息提示（如果没有更高优先级语音在播）
          speak('您有新的消息', { priority: 'low' });
        }
      }

      // 更新标题未读数
      updateTitleUnread();

      render();
      // 如果正在订单聊天页，滚动到底部
      if (STATE.subPage === 'orderChatDetail') {
        setTimeout(scrollOrderChatBottom, 50);
      }
    } catch (e) {
      // 静默失败
    }
  }, 8000); // 每 8 秒拉取一次
}

  announcedMessages: new Set(), // 已播报过的消息 ID（去重）
  currentUtterance: null,   // 当前正在播放的语音
  currentPriority: 'low'    // 当前语音优先级 high > low
};

// 初始化语音播报（需在用户首次交互后调用，绕过浏览器自动播放限制）
function initVoice() {
  if (VOICE_STATE.initialized) return;
  if (!('speechSynthesis' in window)) return;
  // 尝试播放一个空语音以触发权限
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
    VOICE_STATE.initialized = true;
  } catch (e) {
    // 静默失败
  }
}

// 语音播报主函数
// priority: 'high'（新订单，可打断 low） / 'low'（新消息，不打断 high）
function speak(text, opts = {}) {
  const priority = opts.priority || 'low';

  // 检查开关
  if (!DB.settings.voiceEnabled) return;
  // 检查浏览器支持
  if (!('speechSynthesis' in window)) return;
  // 检查初始化（用户交互权限）
  if (!VOICE_STATE.initialized) return;

  // 优先级控制：新订单可以打断新消息，反之不行
  if (VOICE_STATE.currentUtterance) {
    if (priority === 'high' && VOICE_STATE.currentPriority === 'low') {
      window.speechSynthesis.cancel();
    } else {
      return; // 有更高或同级语音在播，跳过
    }
  }

  try {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 1.0;     // 正常语速
    utter.pitch = 1.0;    // 正常音调
    utter.volume = 0.8;   // 适中音量

    // 尝试选择中文女声
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('zh') && !v.name.toLowerCase().includes('male'));
    if (zhVoice) utter.voice = zhVoice;

    utter.onstart = () => {
      VOICE_STATE.currentUtterance = utter;
      VOICE_STATE.currentPriority = priority;
    };
    utter.onend = () => {
      VOICE_STATE.currentUtterance = null;
    };
    utter.onerror = () => {
      VOICE_STATE.currentUtterance = null;
    };

    window.speechSynthesis.speak(utter);
  } catch (e) {
    // 静默降级
  }
}

// 统计订单聊天消息总数（用于新消息检测）
function countTotalOrderChatMessages() {
  if (!DB.orderChatMessages) return 0;
  let count = 0;
  Object.values(DB.orderChatMessages).forEach(arr => { count += arr.length; });
  return count;
}

// 统计客服聊天消息总数
function countTotalChatMessages() {
  if (!DB.chatMessages) return 0;
  let count = 0;
  Object.values(DB.chatMessages).forEach(arr => { count += arr.length; });
  return count;
}

// 检查是否有发给我的新消息（排除自己发的 & 当前正在聊天的会话）
function checkHasNewIncomingMessage(prevOrderChatCount, prevChatCount) {
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';
  let hasNew = false;

  // 订单聊天：只统计对方发来的、且不在当前聊天页的消息
  if (DB.orderChatMessages) {
    Object.entries(DB.orderChatMessages).forEach(([oid, msgs]) => {
      const isCurrentChat = STATE.subPage === 'orderChatDetail' && STATE.orderChatOrderId === oid;
      if (isCurrentChat) return;
      msgs.forEach(m => {
        if (m.sender !== identity && !VOICE_STATE.announcedMessages.has(m.id)) {
          VOICE_STATE.announcedMessages.add(m.id);
          hasNew = true;
        }
      });
    });
  }

  // 客服聊天
  if (DB.chatMessages && DB.chatSessions) {
    DB.chatSessions.forEach(s => {
      const msgs = DB.chatMessages[s.id] || [];
      const isCurrentChat = STATE.subPage === 'chatDetail' && STATE.chatSessionId === s.id;
      if (isCurrentChat) return;
      msgs.forEach(m => {
        // 对方发来的消息（admin 发给我，或我是 admin 时用户发给我）
        const isIncoming = identity === 'admin' ? m.senderType !== 'admin' : m.senderType === 'admin';
        if (isIncoming && !VOICE_STATE.announcedMessages.has(m.id)) {
          VOICE_STATE.announcedMessages.add(m.id);
          hasNew = true;
        }
      });
    });
  }

  return hasNew;
}

// 计算总未读数（订单聊天 + 客服聊天 + 系统通知）
function getTotalUnread() {
  let count = 0;
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';

  // 订单聊天未读
  if (DB.orderChatMessages) {
    Object.values(DB.orderChatMessages).forEach(msgs => {
      msgs.forEach(m => {
        if (m.sender !== identity && !m.isRead) count++;
      });
    });
  }

  // 客服聊天未读
  if (DB.chatSessions) {
    DB.chatSessions.forEach(s => {
      if (s.unread) count += s.unread;
    });
  }

  // 系统通知未读（取第一条示例的 unread，实际场景可能是数组）
  if (DB.messages) {
    DB.messages.forEach(m => {
      if (m.unread) count += m.unread;
    });
  }

  return count;
}

function migrateData() {
  // 迁移：抽成比例设置
  if (!DB.settings.commissionRates) {
    DB.settings.commissionRates = { junior: 30, intermediate: 25, senior: 20 };
  }
  // 迁移：护航师等级字段
  if (DB.boosters) {
    DB.boosters.forEach((b, i) => {
      if (!b.level) {
        // 前2个高级，中间2个中级，后2个初级
        if (i < 2) b.level = 'senior';
        else if (i < 4) b.level = 'intermediate';
        else b.level = 'junior';
      }
    });
  }
  // 迁移：已完成订单补抽成字段
  if (DB.orders) {
    DB.orders.forEach(o => {
      if (o.status === 'completed' && o.boosterIncome === undefined) {
        const calc = calcCommission(o.realPay, o.boosterId);
        o.platformCommission = calc.platform;
        o.boosterIncome = calc.booster;
        o.commissionRate = calc.rate;
      }
    });
  }
  // 迁移：收入记录补字段
  if (DB.incomeRecords) {
    DB.incomeRecords.forEach(r => {
      if (r.platformIncome === undefined && r.rate === undefined) {
        r.platformIncome = 0;
        r.rate = 20;
      }
    });
  }
  saveData();
}

function saveData(syncToCloud = true) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  // 异步同步到 Supabase（失败不影响本地）
  if (syncToCloud) {
    scheduleSupabaseSave();
    // 同步当前用户信息
    scheduleUserSync();
  }
}

  if (!SUPABASE_ENABLED || !supabaseClient) return;

    _userSyncTimer = null;

async function syncCurrentUserToSupabase() {
  if (!supabaseClient || !DB.currentUser) return;
  try {
    const u = DB.currentUser;
    const payload = {
      id: u.id,
      nickname: u.nickname || '',
      avatar: u.avatar || '',
      balance: parseFloat(u.balance || 0),
      vip_level: u.level || '普通会员',
      status: 1
    };
    await supabaseClient.from('users').upsert(payload);
  } catch (e) {
    console.warn('[Supabase] user sync failed:', e.message);
  }
}

function $(sel) { return document.querySelector(sel); }

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function formatTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const pad = n => n.toString().padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatTimeShort(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  const pad = n => n.toString().padStart(2, '0');
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function formatMoney(n) { return (n || 0).toFixed(2); }

const LEVEL_MAP = {
  junior: { name:'初级', color:'#b87333', bg:'rgba(184,115,51,0.15)' },
  intermediate: { name:'中级', color:'#c0c0c0', bg:'rgba(192,192,192,0.15)' },
  senior: { name:'高级', color:'#d4af37', bg:'rgba(212,175,55,0.2)' }
};

function getLevelInfo(level) {
  return LEVEL_MAP[level] || LEVEL_MAP.junior;
}

function getBoosterCommission(booster) {
  if (!booster) return 20;
  // 优先使用自定义抽成，否则用等级默认抽成
  if (booster.customCommission !== undefined && booster.customCommission !== null && booster.customCommission !== '') {
    return Number(booster.customCommission);
  }
  const level = booster.level || 'junior';
  return DB.settings.commissionRates?.[level] ?? 20;
}

function getCommissionRate(boosterId) {
  const b = getBooster(boosterId);
  return getBoosterCommission(b);
}

function calculateIncome(orderAmount, commissionRate) {
  const platform = Math.round(orderAmount * commissionRate * 100) / 100;
  const booster = Math.round((orderAmount - platform) * 100) / 100;
  return { platformCommission: platform, boosterIncome: booster, rate: commissionRate };
}

function calcCommission(amount, boosterId) {
  const rate = getCommissionRate(boosterId);
  const result = calculateIncome(amount, rate);
  return { platform: result.platformCommission, booster: result.boosterIncome, rate };
}

function renderLevelBadge(level, size) {
  const info = getLevelInfo(level);
  const s = size || 'sm';
  const padding = s === 'sm' ? '2px 8px' : '3px 10px';
  const fontSize = s === 'sm' ? '10px' : '12px';
  return `<span style="display:inline-block;padding:${padding};border-radius:4px;font-size:${fontSize};font-weight:600;background:${info.bg};color:${info.color};border:1px solid ${info.color}40">${info.name}护航师</span>`;
}

function toast(msg, duration = 2000) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-overlay active" id="modal-overlay">

        ${contentHtml}
      </div>
    </div>`;
  const overlay = $('#modal-overlay');
  if (opts.closeOnOverlay !== false) {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });
  }
  return overlay;
}

// ============== RENDER ==============
function render() {
  const app = $('#app');
  if (DB.currentIdentity === 'admin') {
    app.classList.add('admin-mode');
    app.innerHTML = renderAdmin();
    initAdmin();
  } else {
    app.classList.remove('admin-mode');
    app.innerHTML = renderApp();
    initUserApp();
    // 打手端首页（抢单大厅）渲染时，立即从云端拉取最新订单
    if (DB.currentIdentity === 'booster' && STATE.page === 'home' && !STATE.subPage) {
      refreshGrabHall(true);
    }
  }
  saveData();
}

function renderApp() {
  const isBooster = DB.currentIdentity === 'booster';
  const tabs = isBooster ? renderBoosterTabs() : renderUserTabs();
  const pageContent = isBooster ? renderBoosterPage() : renderUserPage();
  const showTabbar = !STATE.subPage;
  return `
    ${renderTopbar()}
    <div id="page-container">
      ${pageContent}
    </div>
    ${showTabbar ? `<div class="tabbar">${tabs}</div>` : ''}
  `;
}

function renderTopbar() {
  const isBooster = DB.currentIdentity === 'booster';
  const titleMap = {
    home: isBooster ? '抢单大厅' : '护航电竞',
    category: '护航师',
    messages: '消息',
    orders: isBooster ? '我的接单' : '我的订单',
    profile: '我的'
  };
  const page = STATE.page;
  const showBack = !!STATE.subPage;
  const showSearch = page === 'home' && !isBooster;
  const unread = DB.chatSessions.reduce((s,x) => s + (x.unread||0), 0);
  
  if (showBack) {
    const subTitles = {
      boosterDetail: '护航师详情',
      placeOrder: '确认下单',
      pay: '收银台',
      orderDetail: '订单详情',
      wallet: '我的钱包',
      coupons: '优惠券',
      favorites: '我的收藏',
      assessment: '我要考核',
      settings: '设置',
      chatDetail: '客服对话',
      profileEdit: '个人资料',
      serviceSettings: '服务设置',
      income: '收入中心',
      reviewManage: '评价管理',
      applyBooster: '入驻申请'
    };
    return `
      <div class="topbar">
        <div class="icon-btn" onclick="goBack()">${ICONS.back}</div>
        <div class="title">${subTitles[STATE.subPage] || ''}</div>
        <div class="icons"><div style="width:24px"></div></div>
      </div>`;
  }
  
  return `
    <div class="topbar">
      <div class="logo">
        <div class="logo-icon">${isBooster ? '打' : '护'}</div>
        <span>${titleMap[page] || '护航电竞'}</span>
      </div>
      <div class="icons">
        ${showSearch ? `<div class="icon-btn">${ICONS.search}</div>` : ''}
        <div class="icon-btn" onclick="goPage('messages')">
          ${ICONS.bell}
          ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}
        </div>
      </div>
      <div class="sync-status sync-${SUPABASE_STATUS}" title="云端同步状态：${SUPABASE_STATUS}">
        <span class="sync-dot"></span>
        <span class="sync-text">${getSyncStatusLabel()}</span>
      </div>
    </div>`;
}

function getSyncStatusLabel() {
  const map = {
    'connecting': '连接中',
    'connected': '已连接',
    'failed': '同步异常',
    'offline': '离线'
  };
  return map[SUPABASE_STATUS] || SUPABASE_STATUS;
}

function renderUserTabs() {
  const tabs = [
    { key:'home', icon:ICONS.home, label:'首页' },
    { key:'category', icon:ICONS.category, label:'分类' },
    { key:'messages', icon:ICONS.message, label:'消息' },
    { key:'orders', icon:ICONS.order, label:'订单' },
    { key:'profile', icon:ICONS.user, label:'我的' }
  ];
  const unreadTotal = getTotalUnread();
  return tabs.map(t => `
    <div class="tab ${STATE.page===t.key?'active':''}" onclick="goPage('${t.key}')" style="position:relative">
      ${t.icon}
      <span>${t.label}</span>
      ${t.key==='messages' && unreadTotal>0 ? '<span class="tab-badge"></span>' : ''}
    </div>`).join('');
}

function renderBoosterTabs() {
  const tabs = [
    { key:'home', icon:ICONS.grab, label:'抢单大厅' },
    { key:'orders', icon:ICONS.order, label:'我的接单' },
    { key:'messages', icon:ICONS.message, label:'消息' },
    { key:'profile', icon:ICONS.user, label:'我的' }
  ];
  const unreadTotal = getTotalUnread();
  return tabs.map(t => `
    <div class="tab ${STATE.page===t.key?'active':''}" onclick="goPage('${t.key}')" style="position:relative">
      ${t.icon}
      <span>${t.label}</span>
      ${t.key==='messages' && unreadTotal>0 ? '<span class="tab-badge"></span>' : ''}
    </div>`).join('');
}

function goPage(page) {
  STATE.page = page;
  STATE.subPage = null;
  initVoice(); // 任何点击都可触发语音初始化
  render();
  updateTitleUnread();
}
function goSubPage(sub, params) {
  STATE.subPage = sub;
  if (params) Object.assign(STATE, params);
  initVoice();
  render();
  updateTitleUnread();
  window.scrollTo(0,0);
}
function goBack() {
  if (STATE.subPage) {
    STATE.subPage = null;
    initVoice();
    render();
    updateTitleUnread();
  }
}

// ============== USER PAGES ==============
function renderUserPage() {
  if (STATE.subPage) return renderUserSubPage();
  switch (STATE.page) {
    case 'home': return renderHomePage();
    case 'category': return renderCategoryPage();
    case 'messages': return renderMessagesPage();
    case 'orders': return renderOrdersPage();
    case 'profile': return renderProfilePage();
    default: return renderHomePage();
  }
}

function renderUserSubPage() {
  switch (STATE.subPage) {
    case 'boosterDetail': return renderBoosterDetail();
    case 'placeOrder': return renderPlaceOrder();
    case 'pay': return renderPayPage();
    case 'orderDetail': return renderOrderDetail();
    case 'wallet': return renderWalletPage();
    case 'coupons': return renderCouponsPage();
    case 'favorites': return renderFavoritesPage();
    case 'assessment': return renderAssessmentPage();
    case 'settings': return renderSettingsPage();
    case 'chatDetail': return renderChatDetail();
    case 'orderChatDetail': return renderOrderChatDetail();
    default: return '<div class="empty">页面不存在</div>';
  }
}

// --- CATEGORY ---
function renderCategoryPage() {
  let boosters = DB.boosters.filter(b => b.status === 'approved');
  if (STATE.filterGame !== 'all') {
    boosters = boosters.filter(b => b.gameId === STATE.filterGame);
  }
  if (STATE.sortBy === 'sales') boosters.sort((a,b)=>b.orders-a.orders);
  else if (STATE.sortBy === 'price') boosters.sort((a,b)=>a.price-b.price);
  else if (STATE.sortBy === 'rating') boosters.sort((a,b)=>b.rating-a.rating);
  
  const gameFilters = [{id:'all',name:'全部'}, ...DB.games.map(g=>({id:g.id,name:g.name}))];
  const sorts = [{k:'default',n:'综合'},{k:'sales',n:'销量'},{k:'price',n:'价格'},{k:'rating',n:'评分'}];
  
  return `
    <div class="page active">
      <div class="filter-bar">
        ${gameFilters.map(g=>`<span class="filter-pill ${STATE.filterGame===g.id?'active':''}" onclick="STATE.filterGame='${g.id}';render()">${g.name}</span>`).join('')}
      </div>
      <div class="filter-bar" style="top:100px">
        ${sorts.map(s=>`<span class="filter-pill ${STATE.sortBy===s.k?'active':''}" onclick="STATE.sortBy='${s.k}';render()">${s.n}</span>`).join('')}
      </div>
      <div style="padding-top:8px">
        ${boosters.length === 0 ? '<div class="empty">暂无护航师</div>' : boosters.map(b=>renderBoosterCard(b)).join('')}
      </div>
    </div>`;
}

  render();
}

  orderForm.quantity = Math.max(1, orderForm.quantity + d);

function toggleCouponPicker() {
  const el = document.getElementById('couponPicker');
  if (el) el.classList.toggle('hidden');
}
function selectCoupon(id) {
  orderForm.couponId = id;
  render();

function submitOrder() {
  const p = getProduct(STATE.selectedProductId);
  if (!p) return;
  const b = getBooster(p.boosterId);
  if (!orderForm.gameAccount) { toast('请输入游戏ID'); return; }
  if (!orderForm.contact) { toast('请输入联系方式'); return; }
  
  const total = p.price * orderForm.quantity;
  let discount = 0;
  if (orderForm.couponId) {
    const c = DB.coupons.find(x=>x.id===orderForm.couponId);
    if (c && total >= c.minAmount) discount = c.amount;
  }
  const realPay = total - discount;
  
  const order = {
    id: 'O' + Date.now().toString().slice(-10),
    orderNo: 'O' + Date.now().toString().slice(-10),
    userId: DB.currentUser.id,
    userName: DB.currentUser.nickname,
    boosterId: p.boosterId,
    boosterName: b.nickname,
    gameId: p.gameId,
    gameName: getGameName(p.gameId),
    productId: p.id,
    productName: p.name,
    productType: p.type,
    unitPrice: p.price,
    quantity: orderForm.quantity,
    totalAmount: total,
    unit: p.unit,
    price: total,
    realPay: realPay,
    couponId: orderForm.couponId,
    couponAmount: discount,
    server: orderForm.server,
    gameIdAccount: orderForm.gameAccount,
    gameAccount: orderForm.gameAccount,
    requirement: orderForm.requirement,
    contact: orderForm.contact,
    status: 'pending',
    payStatus: 'unpaid',
    createTime: Date.now(),
    payTime: null,
    startTime: null,
    completeTime: null
  };
  
  STATE.pendingOrder = order;
  goSubPage('pay');
}

function confirmPay() {
  const order = STATE.pendingOrder;
  if (!order) return;
  const payway = document.querySelector('input[name="payway"]:checked')?.value || 'wechat';
  
  if (payway === 'wechat') {
    showWxPayModal(order);
  } else if (payway === 'qrcode') {
    showQrCodePayModal(order);
  } else {
    if (DB.currentUser.balance < order.realPay) {
      toast('余额不足，请先充值');
      return;
    }
    DB.currentUser.balance -= order.realPay;
    completeOrderPay(order, 'balance');
  }
}

    STATE.pendingOrder = null;
    orderForm = { quantity:1, server:'', gameAccount:'', requirement:'', contact:'', couponId:null };

function completeOrderPay(order, payway) {
  order.status = 'pending'; // 待接单
  order.payStatus = 'paid';
  order.payTime = Date.now();
  order.payway = payway;
  DB.orders.push(order);
  
  // Record payment
  DB.paymentRecords.push({
    id: genId('P'),
    orderId: order.id,
    userId: order.userId,
    amount: order.realPay,
    payway: payway,
    status: 'success',
    createTime: Date.now(),
    payTime: Date.now(),
    tradeNo: ''
  });
  
  // Flow record
  DB.flowRecords.push({
    id: genId('F'),
    userId: order.userId,
    type: 'consume',
    amount: order.realPay,
    balanceChange: -order.realPay,
    orderId: order.id,
    description: `订单支付 ${order.productName}`,
    createTime: Date.now()
  });
  
  // 扣减优惠券
  if (order.couponId) {
    const idx = DB.userCoupons.indexOf(order.couponId);
    if (idx > -1) DB.userCoupons.splice(idx, 1);
  }
  
  // 增加系统消息
  addSystemMessage('订单支付成功', `您的订单 ${order.id} 已支付成功，等待护航师接单`);
  
  saveData();
  
  // 立即同步订单到 Supabase（不等待防抖）
  forceSyncOrder(order).then(ok => {
    if (!ok) {
      toast('订单已提交，正在同步到云端...');
    }
  });
}

function addSystemMessage(title, content) {
  // 可扩展为系统消息列表，这里先用toast示意
}

// 给指定用户发送一条客服会话消息（用户端消息页可看到）
function addMessageToUser(userId, fromName, content) {
  if (!userId || !content) return;
  const sessionId = 'sys_' + userId;
  let session = DB.chatSessions.find(s => s.id === sessionId);
  if (!session) {
    session = {
      id: sessionId,
      userId: userId,
      userName: fromName || '系统',
      avatar: fromName?.substr(0,1) || '系',
      lastMsg: content,
      lastTime: Date.now(),
      unread: 1,
      isSystem: true
    };
    DB.chatSessions.push(session);
  } else {
    session.lastMsg = content;
    session.lastTime = Date.now();
    session.unread = (session.unread || 0) + 1;
  }
  if (!DB.chatMessages) DB.chatMessages = {};
  if (!DB.chatMessages[sessionId]) DB.chatMessages[sessionId] = [];
  DB.chatMessages[sessionId].push({
    id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    senderType: 'system',
    senderId: 'system',
    senderName: fromName || '系统',
    content: content,
    createTime: Date.now(),
    isRead: false
  });
}

function renderOrdersPage() {
  const tabs = [
    { k:'all', n:'全部' },
    { k:'pending', n:'待接单' },
    { k:'ongoing', n:'已接单' },
    { k:'in_progress', n:'服务中' },
    { k:'toConfirm', n:'待确认' },

    { k:'refund', n:'退款' }

  let orders = DB.orders.filter(o => o.userId === DB.currentUser.id);

    if (STATE.orderTab === 'refund') {
      orders = orders.filter(o => o.status === 'refunding' || o.status === 'refunded');

  orders.sort((a,b) => b.createTime - a.createTime);
  
  return `

    btns.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openOrderChat('${o.id}')">${unread>0?'消息('+unread+')':'联系护航师'}</button>`);

    btns.push(`<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();confirmComplete('${o.id}')">确认完成</button>`);
    btns.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openOrderChat('${o.id}')">${unread>0?'消息('+unread+')':'联系护航师'}</button>`);

    btns.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();goSubPage('orderDetail',{selectedOrderId:'${o.id}'})">去评价</button>`);

  return btns.join('');

function cancelOrder(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  if (confirm('确定要取消订单吗？')) {

function confirmComplete(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  if (confirm('确认订单已完成？')) {
    o.status = 'completed';
    o.completeTime = Date.now();

async function forceSyncOrderChat(orderId, msg) {
  if (!supabaseClient || !SUPABASE_ENABLED) return false;
  try {
    const payload = {
      id: msg.id,
      order_id: orderId,
      user_id: msg.userId,
      booster_id: msg.boosterId,
      sender: msg.sender,
      content: msg.content,
      is_read: msg.isRead || false,
      created_at: new Date(msg.createTime).toISOString()
    };
    const { error } = await supabaseClient.from('order_chat_messages').upsert(payload);
    if (error) throw error;
    logSupabase('info', 'order_chat', `消息已同步: ${msg.id}`);
    return true;
  } catch (e) {
    logSupabase('error', 'order_chat', `消息同步失败: ${e.message}`);
    return false;
  }
}

async function syncOrderChatFromSupabase() {
  if (!supabaseClient || !SUPABASE_ENABLED) return null;
  try {
    const { data, error } = await supabaseClient.from('order_chat_messages').select('*');
    if (error) throw error;
    if (!DB.orderChatMessages) DB.orderChatMessages = {};
    const rows = data || [];
    rows.forEach(row => {
      const oid = row.order_id;
      if (!DB.orderChatMessages[oid]) DB.orderChatMessages[oid] = [];
      const existing = DB.orderChatMessages[oid].find(m => m.id === row.id);
      if (!existing) {
        DB.orderChatMessages[oid].push({
          id: row.id,
          orderId: row.order_id,
          userId: row.user_id,
          boosterId: row.booster_id,
          sender: row.sender,
          content: row.content,
          isRead: row.is_read,
          createTime: new Date(row.created_at).getTime()
        });
      } else {
        existing.isRead = row.is_read;
      }
    });
    Object.keys(DB.orderChatMessages).forEach(oid => {
      DB.orderChatMessages[oid].sort((a,b) => a.createTime - b.createTime);
    });
    logSupabase('info', 'order_chat', `拉取订单聊天消息: ${rows.length} 条`);
    return rows;
  } catch (e) {
    logSupabase('warn', 'order_chat', `拉取订单聊天消息失败: ${e.message}`);
    return null;
  }
}

function getUnreadOrderChatCount() {
  if (!DB.orderChatMessages) return 0;
  const identity = DB.currentIdentity === 'booster' ? 'booster' : 'user';
  let count = 0;
  Object.values(DB.orderChatMessages).forEach(msgs => {
    msgs.forEach(m => {
      if (m.sender !== identity && !m.isRead) count++;
    });
  });
  return count;
}

function sendChatMsg() {
  const input = document.getElementById('chatInput');
  const text = input?.value.trim();
  if (!text) return;
  
  const sessionId = STATE.chatSessionId;
  const isAdmin = DB.currentIdentity === 'admin';
  const from = isAdmin ? 'admin' : 'user';
  
  if (!DB.chatMessages[sessionId]) DB.chatMessages[sessionId] = [];
  DB.chatMessages[sessionId].push({
    id: genId('m'),
    from: from,
    content: text,
    time: Date.now()
  });
  
  // 更新会话最后消息
  const session = DB.chatSessions.find(s => s.id === sessionId);
  if (session) {
    session.lastMsg = text;
    session.lastTime = Date.now();
    // 对方未读+1
    if (isAdmin) session.unread = (session.unread || 0) + 0; // 管理员发的，用户端未读
  }
  
  input.value = '';
  saveData();
  render();
  
  // 自动回复（简易模拟）
  if (!isAdmin) {
    setTimeout(() => {
      const replies = ['好的，已收到您的消息~','客服正在核实，请稍等','请问您的订单号是多少呢？','感谢您的反馈，我们会尽快处理'];
      const reply = replies[Math.floor(Math.random()*replies.length)];
      DB.chatMessages[sessionId].push({
        id: genId('m'),
        from: 'admin',
        content: reply,
        time: Date.now()
      });
      if (session) { session.lastMsg = reply; session.lastTime = Date.now(); }
      saveData();
      if (STATE.subPage === 'chatDetail' && STATE.chatSessionId === sessionId) {
        render();
        scrollChatBottom();
      }
    }, 800);
  }
  setTimeout(scrollChatBottom, 50);
}

async function verifyAdmin() {
  const input = document.getElementById('adminPwdInput')?.value;
  if (!input) return toast('请输入密码');
  
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = '验证中...'; }
  
  try {
    const ok = await verifyAdminLogin('admin', input);
    if (ok) {
      DB.currentIdentity = 'admin';
      STATE.adminNav = 'dashboard';
      closeModal();
      render();
    } else {
      toast('密码错误');
      if (btn) { btn.disabled = false; btn.textContent = '确认'; }
    }
  } catch (e) {
    toast('验证失败：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '确认'; }
  }
}

function grabOrder(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o || o.status !== 'pending') return;
  // 默认使用第一个已通过的护航师身份
  const booster = DB.boosters.find(b => b.status === 'approved') || { id:'b001', nickname:'测试护航师' };
  o.boosterId = booster.id;
  o.boosterName = booster.nickname;
  o.status = 'ongoing';
  o.takeTime = Date.now();
  DB.currentBooster = booster;
  saveData();
  toast('抢单成功！');
  render();
  // 立即同步到 Supabase
  forceSyncOrder(o);
}

// --- Booster Orders ---
function renderBoosterOrders() {
  const tabs = [
    { k:'ongoing', n:'待开始' },
    { k:'in_progress', n:'服务中' },
    { k:'toConfirm', n:'待确认' },
    { k:'completed', n:'已完成' },
    { k:'cancelled', n:'已取消' }
  ];
  
  const boosterId = (DB.currentBooster?.id) || 'b001';
  let orders = DB.orders.filter(o => o.boosterId === boosterId);
  if (STATE.boosterTab) {
    orders = orders.filter(o => o.status === STATE.boosterTab);
  } else {
    STATE.boosterTab = 'ongoing';
    orders = orders.filter(o => o.status === 'ongoing');
  }
  orders.sort((a,b) => b.createTime - a.createTime);
  
  // 计算未读消息数
  const getUnread = (orderId) => {
    const msgs = DB.orderChatMessages?.[orderId] || [];
    return msgs.filter(m => m.sender !== 'booster' && !m.isRead).length;
  };
  
  return `
    <div class="page active">
      <div class="inner-tabs">
        ${tabs.map(t => `<div class="inner-tab ${STATE.boosterTab===t.k?'active':''}" onclick="STATE.boosterTab='${t.k}';render()">${t.n}</div>`).join('')}
      </div>
      ${orders.length === 0 ? '<div class="empty"><p>暂无订单</p></div>' : orders.map(o => {
        const unread = getUnread(o.id);
        return `
        <div class="order-card" onclick="goSubPage('orderDetail',{selectedOrderId:'${o.id}'})">
          <div class="order-header">
            <span class="order-game">${o.gameName} · ${o.productName}</span>
            <span class="order-status ${getStatusClass(o.status)}">${getStatusText(o.status)}${unread>0?'<span class="unread-dot" style="margin-left:4px"></span>':''}</span>
          </div>

              <div class="price" style="font-size:15px;color:var(--gold)">¥${formatMoney(o.status==='completed'?(o.boosterIncome||0):calculateIncome(o.realPay,getCommissionRate(boosterId)).boosterIncome)}</div>

            ${o.status === 'ongoing' ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();startService('${o.id}')">开始服务</button>` : ''}
            ${o.status === 'in_progress' ? `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();uploadProof('${o.id}')">完成服务</button>` : ''}

      }).join('')}
    </div>`;
}

function startService(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'in_progress';
  o.startTime = Date.now();
  saveData();
  toast('服务已开始');
  render();
  forceSyncOrder(o);
}

function uploadProof(orderId) {
  showModal(`
    <div>
      <div class="modal-header">
        <h4>完成服务</h4>
        <span class="modal-close" onclick="closeModal()">${ICONS.close}</span>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-2);margin-bottom:10px">请描述已完成的服务内容，提交后等待用户确认完成。</p>
        <textarea class="form-textarea" id="proofText" placeholder="请输入完成说明（可选）"></textarea>
        <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="completeService('${orderId}')">确认完成</button>
      </div>
    </div>`);
}

function completeService(orderId) {
  const text = document.getElementById('proofText')?.value || '';
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'toConfirm';
  o.completeProof = text;
  o.completeTime = Date.now();
  // 发送系统消息给用户
  addMessageToUser(o.userId, '系统', `您的订单 ${o.id} 护航师已完成服务，请确认完成`);
  saveData();
  toast('已提交，等待用户确认');
  closeModal();
  render();
  forceSyncOrder(o);
}

function drawIncomeChart() {
  const canvas = document.getElementById('incomeChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const w = rect.width;
  const h = rect.height;
  
  // Mock data for 7 days
  const data = [1200, 1800, 1500, 2200, 2800, 2400, 3100];
  const labels = ['周一','周二','周三','周四','周五','周六','周日'];
  const maxVal = Math.max(...data) * 1.2;
  const barW = (w - 60) / data.length * 0.5;
  const gap = (w - 60) / data.length;
  
  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = 20 + (h - 40) * i / 4;
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(w - 10, y);
    ctx.stroke();
  }
  
  // Bars
  data.forEach((v, i) => {
    const x = 50 + i * gap + (gap - barW) / 2;
    const barH = (h - 40) * v / maxVal;
    const y = h - 20 - barH;
    
    const grad = ctx.createLinearGradient(0, y, 0, h - 20);
    grad.addColorStop(0, '#d4af37');
    grad.addColorStop(1, 'rgba(212,175,55,0.2)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, 4);
    ctx.fill();
    
    // Label
    ctx.fillStyle = 'rgba(160,160,184,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[i], x + barW/2, h - 4);
  });
}

function confirmQrPayment(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'pending'; // 确认到账，进入抢单大厅
  o.payStatus = 'paid';
  o.payTime = Date.now();
  // 补全支付记录
  const pay = DB.paymentRecords.find(p => p.orderId === orderId);
  if (pay) { pay.status = 'success'; pay.payTime = Date.now(); }
  // 交易流水
  DB.flowRecords.push({
    id: genId('F'),
    userId: o.userId,
    type: 'consume',
    amount: o.realPay,
    balanceChange: -o.realPay,
    orderId: o.id,
    description: `订单支付（人工确认） ${o.productName}`,
    createTime: Date.now()
  });
  // 给用户发系统消息
  addMessageToUser(o.userId, '系统', `您的订单 ${o.id} 已确认到账，正在为您匹配护航师`);
  saveData();
  toast('已确认收款，订单进入抢单大厅');
  render();
  // 立即同步到云端
  forceSyncOrder(o);
}

function rejectQrPayment(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  o.status = 'cancelled';
  o.payStatus = 'unpaid';
  o.cancelTime = Date.now();
  const pay = DB.paymentRecords.find(p => p.orderId === orderId);
  if (pay) { pay.status = 'failed'; }
  // 给用户发系统消息
  addMessageToUser(o.userId, '系统', `您的订单 ${o.id} 因未收到付款已被取消，如有疑问请联系客服`);
  saveData();
  toast('已取消订单');
  render();
  forceSyncOrder(o);
}

function approveRefund(orderId) {

  if (!o) return;

  o.refundTime = Date.now();

function rejectRefund(orderId) {

  } else {
    hint.textContent = '当前使用自定义抽成比例';
  }
}

function onCustomCommissionChange() {
  const customInput = document.getElementById('boosterCustomCommission');
  const hint = document.getElementById('commissionHint');
  if (customInput.value === '') {
    const level = document.getElementById('boosterLevelSelect').value;
    customInput.placeholder = DB.settings.commissionRates[level];
    hint.textContent = '当前使用等级默认抽成比例';
  } else {
    let v = parseInt(customInput.value) || 0;
    v = Math.min(100, Math.max(0, v));
    hint.textContent = `当前使用自定义抽成比例：${v}%`;
  }
}

  const level = document.getElementById('boosterLevelSelect').value;

            ${records.length===0 ? '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-3)">暂无考核申请</td></tr>' : records.map(a => `
              <tr>

                <td>${a.curRank}</td>
                <td>${a.targetRank}</td>
                <td style="font-size:12px">${a.contact}</td>
                <td style="font-size:12px;color:var(--text-3)">${formatTimeShort(a.submitTime)}</td>
                <td><span class="order-status ${a.status==='approved'?'completed':a.status==='pending'?'pending':'refund'}">${a.status==='approved'?'已通过':a.status==='pending'?'待审核':'未通过'}</span></td>
                <td>
                  ${a.status==='pending' ? `
                    <button class="btn btn-sm btn-primary" onclick="assessAction('${a.id}','approved')">通过</button>
                    <button class="btn btn-sm btn-gray" onclick="assessAction('${a.id}','rejected')">拒绝</button>
                  ` : `<button class="btn btn-sm btn-outline" onclick="viewAssessDetail('${a.id}')">查看</button>`}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function assessAction(id, status) {
  const remark = status === 'rejected' ? prompt('请填写拒绝原因：', '') : (prompt('请填写审核备注（选填）：', '') || '考核通过');
  if (status === 'rejected' && remark === null) return;
  const a = DB.assessments.find(x => x.id === id);
  if (a) {
    a.status = status;
    a.remark = remark || '';
    a.reviewTime = Date.now();
    saveData();
    toast('审核完成');
    render();
  }
}

  const a = DB.assessments.find(x => x.id === id);

  showModal(`

// --- Admin Chat ---
function renderAdminChat() {
  const sessions = DB.chatSessions.slice().sort((a,b) => b.lastTime - a.lastTime);
  const curSession = sessions.find(s => s.id === STATE.chatSessionId) || sessions[0];
  const messages = curSession ? (DB.chatMessages[curSession.id] || []) : [];
  const quickReplies = DB.settings.quickReplies;
  
  return `
    <div class="admin-chat-layout">
      <div class="admin-chat-list">
        ${sessions.map(s => `
          <div class="msg-list-item ${s.id===STATE.chatSessionId?'active':''}" onclick="selectAdminChat('${s.id}')" style="${s.id===STATE.chatSessionId?'background:var(--gold-bg)':''}">
            <div class="msg-avatar-lg">${s.userName.substr(0,1)}${s.unread>0?'<span class="unread-dot"></span>':''}</div>
            <div class="msg-content">
              <div class="msg-title"><span>${s.userName}</span><span class="msg-time">${formatTimeShort(s.lastTime)}</span></div>
              <div class="msg-preview">${s.lastMsg}</div>
            </div>
          </div>`).join('')}
        ${sessions.length===0 ? '<div class="empty" style="padding:40px 20px"><p style="font-size:12px">暂无会话</p></div>' : ''}
      </div>
      <div class="admin-chat-main">
        ${curSession ? `
          <div style="padding:12px 16px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:10px">
            <div class="avatar sm">${curSession.userName.substr(0,1)}</div>
            <span style="font-weight:500">${curSession.userName}</span>
          </div>
          <div class="chat-messages" id="chatMessages" style="flex:1;padding:12px">
            ${messages.map(m => `
              <div class="chat-msg ${m.from==='admin'?'sent':'received'}">
                <div class="msg-avatar">${m.from==='admin'?'管':curSession.userName.substr(0,1)}</div>
                <div class="msg-bubble">${m.content}</div>
              </div>`).join('')}
          </div>
          <div class="quick-replies">
            ${quickReplies.map(q => `<span class="quick-reply" onclick="fillQuickReply('${q}')">${q}</span>`).join('')}
          </div>
          <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendAdminChat()">
            <button onclick="sendAdminChat()">发送</button>
          </div>
        ` : '<div class="empty" style="flex:1;display:flex;align-items:center;justify-content:center"><p>选择左侧会话开始对话</p></div>'}
      </div>
    </div>`;
}

function selectAdminChat(sessionId) {
  STATE.chatSessionId = sessionId;
  const s = DB.chatSessions.find(x => x.id === sessionId);
  if (s) s.unread = 0;
  saveData();
  render();
  setTimeout(scrollChatBottom, 50);
}

function fillQuickReply(text) {
  const input = document.getElementById('chatInput');
  if (input) { input.value = text; input.focus(); }
}

function sendAdminChat() {
  const input = document.getElementById('chatInput');
  const text = input?.value.trim();
  if (!text) return;
  const sessionId = STATE.chatSessionId;
  if (!DB.chatMessages[sessionId]) DB.chatMessages[sessionId] = [];
  DB.chatMessages[sessionId].push({
    id: genId('m'), from: 'admin', content: text, time: Date.now()
  });
  const session = DB.chatSessions.find(s => s.id === sessionId);
  if (session) {
    session.lastMsg = text;
    session.lastTime = Date.now();
    session.unread = (session.unread || 0) + 1;
  }
  input.value = '';
  saveData();
  render();
  setTimeout(scrollChatBottom, 50);
}

  saveData();
  toast('添加成功');
  render();

}

ALTER TABLE users DISABLE ROW LEVEL SECURITY;
ALTER TABLE boosters DISABLE ROW LEVEL SECURITY;
ALTER TABLE products DISABLE ROW LEVEL SECURITY;
ALTER TABLE payments DISABLE ROW LEVEL SECURITY;
ALTER TABLE transactions DISABLE ROW LEVEL SECURITY;
ALTER TABLE order_chat_messages DISABLE ROW LEVEL SECURITY;</code>
        </div>
      </div>
      
      <div class="detail-section">
        <h4>收款码设置</h4>

            <div style="flex:1">
              <input type="file" accept="image/*" id="qrWechatUpload" style="display:none" onchange="handleQrUpload(this, 'wechat')">
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('qrWechatUpload').click()">上传微信收款码</button>
              <button class="btn btn-gray btn-sm" style="margin-left:6px" onclick="DB.settings.paymentQrWechat='';saveData();render();toast('已清除')">清除</button>

              ${s.paymentQrAlipay ? `<img src="${s.paymentQrAlipay}" style="width:100%;height:100%;object-fit:contain">` : '<span style="font-size:11px;color:var(--text-3)">未设置</span>'}
            </div>
            <div style="flex:1">
              <input type="file" accept="image/*" id="qrAlipayUpload" style="display:none" onchange="handleQrUpload(this, 'alipay')">
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('qrAlipayUpload').click()">上传支付宝收款码</button>

}

function handleQrUpload(input, type) {
  const file = input.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('图片不能超过 2MB');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    if (type === 'wechat') {
      DB.settings.paymentQrWechat = e.target.result;
    } else {
      DB.settings.paymentQrAlipay = e.target.result;
    }
    saveData();
    render();
    toast('收款码已上传');
  };
  reader.readAsDataURL(file);
}

function syncFromSupabaseManual() {
  if (!supabaseClient) {
    toast('Supabase 未初始化');
    return;
  }
  toast('正在从云端同步...');
  syncFromSupabase().then(ok => {
    if (ok) {
      toast('同步成功');

      toast('同步失败，请检查控制台');

}

async function loadCloudStats() {
  const el = document.getElementById('cloudStats');
  if (!el) return;
  if (!supabaseClient) { el.innerHTML = '<span style="color:var(--text-3)">Supabase 未连接</span>'; return; }
  try {
    const tables = ['orders', 'users', 'boosters', 'products', 'payments', 'withdrawals'];
    const results = await Promise.all(tables.map(t => 
      supabaseClient.from(t).select('id', { count: 'exact', head: true })
    ));
    const labels = { orders: '订单', users: '用户', boosters: '护航师', products: '商品', payments: '支付记录', withdrawals: '提现记录' };
    let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
    results.forEach((r, i) => {
      const t = tables[i];
      const count = r.error ? '读取失败' : (r.count ?? 0);
      const color = r.error ? 'color:#ef4444' : 'color:var(--text-1);font-weight:600';
      html += `<div><span style="color:var(--text-3)">${labels[t]}：</span><span style="${color}">${count}</span></div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<span style="color:#ef4444">读取失败：${e.message}</span>`;
  }
}

async function changeAdminPwd() {
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const newPwd2 = document.getElementById('newPwd2').value;
  if (!oldPwd) return toast('请输入当前密码');
  if (!newPwd || newPwd.length < 6) return toast('新密码至少6位');
  if (newPwd !== newPwd2) return toast('两次密码不一致');
  
  // 验证旧密码：优先 Supabase，降级本地
  let oldPwdValid = false;
  if (supabaseClient && SUPABASE_ENABLED) {
    try {
      const { data, error } = await supabaseClient
        .from('admins')
        .select('password')
        .eq('username', 'admin')
        .single();
      if (data && data.password === oldPwd) {
        oldPwdValid = true;
      } else if (error && error.code === 'PGRST116') {
        // 表里没有管理员记录，用本地校验
        oldPwdValid = oldPwd === (DB.adminPassword || 'admin888');
      }
    } catch (e) {
      console.warn('[Supabase] verify old pwd failed:', e.message);
      oldPwdValid = oldPwd === (DB.adminPassword || 'admin888');
    }
  } else {
    oldPwdValid = oldPwd === (DB.adminPassword || 'admin888');
  }
  
  if (!oldPwdValid) return toast('原密码错误');
  
  // 更新本地
  DB.adminPassword = newPwd;
  saveData();
  
  // 同步到 Supabase
  if (supabaseClient && SUPABASE_ENABLED) {
    try {
      // upsert：有则更新，无则插入
      await supabaseClient.from('admins').upsert(
        { username: 'admin', password: newPwd, role: 'super_admin', status: 1 },
        { onConflict: 'username' }
      );
    } catch (e) {
      console.warn('[Supabase] update admin password failed:', e.message);
      toast('提示：本地密码已更新，云端同步失败');
      return;
    }
  }
  
  toast('密码修改成功');
  render();
}

function removeQuickReply(i) {

// ============== INITIALIZATION ==============
function initUserApp() {
  // Banner auto-play
  if (STATE.page === 'home' && !STATE.subPage) {
    if (window._bannerTimer) clearInterval(window._bannerTimer);
    window._bannerTimer = setInterval(() => {
      if (STATE.page === 'home' && !STATE.subPage && DB.currentIdentity !== 'admin') {
        STATE.bannerIndex = (STATE.bannerIndex + 1) % DB.banners.length;
        const dots = document.querySelectorAll('.banner-dots span');
        const titleEl = document.querySelector('.banner-title');
        const subEl = document.querySelector('.banner-sub');
        if (dots.length) dots.forEach((d,i)=>d.classList.toggle('active', i===STATE.bannerIndex));
        if (titleEl && DB.banners[STATE.bannerIndex]) titleEl.textContent = DB.banners[STATE.bannerIndex].title;
        if (subEl && DB.banners[STATE.bannerIndex]) subEl.textContent = DB.banners[STATE.bannerIndex].sub;
      }
    }, 4000);
  }
  // 订单聊天页滚动到底部
  if (STATE.subPage === 'orderChatDetail') {
    setTimeout(scrollOrderChatBottom, 50);
  }
}

function init() {
  initSupabase();
  loadData();
  render();
  updateTitleUnread();
  // 首次用户交互后初始化语音（绕过浏览器自动播放限制）
  const firstInteract = () => {
    initVoice();
    document.removeEventListener('click', firstInteract);
    document.removeEventListener('touchstart', firstInteract);
    document.removeEventListener('keydown', firstInteract);
  };
  document.addEventListener('click', firstInteract);
  document.addEventListener('touchstart', firstInteract);
  document.addEventListener('keydown', firstInteract);
}

// Start the app
document.addEventListener('DOMContentLoaded', init);
// Fallback if DOMContentLoaded already fired
if (document.readyState !== 'loading') {
  initSupabase();
  loadData();
  render();
}

</script>
